<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#246bdf" />
<title>Vise — learn, practise, level up</title>
<style>
:root {
  --primary:#2670e8;
  --primary2:#4c91ff;
  --primary-soft:#eaf2ff;
  --ink:#17253d;
  --muted:#65748b;
  --line:#e3eaf4;
  --paper:#fff;
  --bg:#f5f8fd;
  --good:#159b69;
  --warn:#e0a22c;
  --bad:#dc5a65;
  --shadow:0 12px 35px rgba(33,68,120,.10);
  --radius:22px
}
* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh
}
body.theme-purple {
  --primary:#7651d8;
  --primary2:#9a78f1;
  --primary-soft:#f1edff;
  --shadow:0 12px 35px rgba(87,60,160,.11)
}
button,input,textarea,select {
  font:inherit
}
button {
  cursor:pointer
}
button:disabled {
  opacity:.45;
  cursor:not-allowed;
  transform:none!important
}
.hidden {
  display:none!important
}
.muted {
  color:var(--muted)
}
.tiny {
  font-size:12px
}
.eyebrow {
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--primary)
}
#app {
  min-height:100vh
}
.screen {
  min-height:100vh
}
.center-screen {
  display:grid;
  place-items:center;
  padding:28px 16px;
  background:radial-gradient(circle at 12% 12%,var(--primary-soft),transparent 32%),radial-gradient(circle at 90% 85%,#dff8f0 0,transparent 28%),var(--bg)
}
.onboard-card {
  width:min(920px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:30px;
  box-shadow:0 25px 80px rgba(40,75,130,.13);
  padding:clamp(24px,5vw,52px);
  position:relative;
  overflow:hidden
}
.onboard-card:after {
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:var(--primary-soft);
  right:-95px;
  top:-110px;
  z-index:0
}
.onboard-card>* {
  position:relative;
  z-index:1
}
.brand {
  font-weight:1000;
  letter-spacing:-2px;
  font-size:clamp(34px,6vw,58px);
  color:var(--primary);
  line-height:1
}
.brand-lockup {
  display:flex;
  align-items:center;
  gap:14px;
  width:max-content;
  max-width:100%
}
.brand-symbol {
  display:block;
  flex:none;
  filter:drop-shadow(0 4px 7px rgba(28,65,120,.16))
}
.brand .brand-title {
  display:block;
  line-height:.94
}
.brand small {
  display:block;
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-top:8px
}
.brand small.brand-terra {
  color:var(--primary);
  font-size:10px;
  letter-spacing:3.2px;
  line-height:1;
  text-transform:lowercase;
  margin-top:4px;
  font-weight:950
}
.brand small.brand-context {
  font-size:10px;
  letter-spacing:1.5px;
  margin-top:7px
}
.onboard-title {
  font-size:clamp(28px,4vw,43px);
  letter-spacing:-1.5px;
  margin:24px 0 10px;
  line-height:1.1
}
.onboard-copy {
  color:var(--muted);
  font-size:16px;
  line-height:1.65;
  max-width:650px
}
.choice-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:28px
}
.choice-card {
  border:2px solid var(--line);
  background:#fff;
  border-radius:22px;
  padding:24px;
  text-align:left;
  transition:.2s;
  min-height:170px
}
.choice-card:hover {
  border-color:var(--primary);
  transform:translateY(-4px);
  box-shadow:var(--shadow)
}
.choice-card .choice-icon {
  font-size:38px;
  display:block;
  margin-bottom:12px
}
.choice-card strong {
  display:block;
  font-size:21px;
  margin-bottom:6px
}
.choice-card strong.choice-brand small {
  display:block;
  color:var(--primary);
  font-size:9px;
  font-weight:950;
  letter-spacing:2.8px;
  line-height:1;
  text-transform:lowercase;
  margin-top:2px
}
.choice-card span:last-child {
  font-size:13px;
  color:var(--muted);
  line-height:1.45
}
.year-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:24px
}
.year-btn {
  border:1.5px solid var(--line);
  background:white;
  border-radius:16px;
  padding:17px;
  font-weight:900;
  color:var(--ink);
  font-size:18px;
  transition:.15s
}
.year-btn:hover {
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-2px)
}
.senior-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:24px
}
.senior-btn {
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  background:white;
  border:1.5px solid var(--line);
  border-radius:16px;
  padding:16px;
  transition:.15s
}
.senior-btn:hover {
  border-color:var(--primary);
  transform:translateY(-2px)
}
.senior-btn .ico {
  font-size:27px
}
.senior-btn strong {
  display:block
}
.senior-btn small {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px
}
.back-btn,.ghost-btn,.secondary-btn,.primary-btn,.danger-btn {
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:850;
  transition:.15s
}
.back-btn,.ghost-btn,.secondary-btn {
  background:#eef3fa;
  color:#3a4c65
}
.back-btn:hover,.ghost-btn:hover,.secondary-btn:hover {
  filter:brightness(.97);
  transform:translateY(-1px)
}
.primary-btn {
  background:var(--primary);
  color:white;
  box-shadow:0 5px 0 color-mix(in srgb,var(--primary),#000 20%);
  padding:12px 18px
}
.primary-btn:hover {
  filter:brightness(1.06);
  transform:translateY(-2px)
}
.danger-btn {
  background:#fff0f1;
  color:#b3424d
}
.text-btn {
  border:0;
  background:none;
  color:var(--primary);
  font-weight:850;
  padding:8px
}
.small-btn {
  padding:8px 11px;
  border-radius:10px;
  font-size:12px
}
/* dashboard */
.topbar {
  height:76px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(16px,4vw,46px);
  position:sticky;
  top:0;
  z-index:20
}
.top-brand-wrap {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0
}
.top-brand {
  font-weight:1000;
  font-size:27px;
  letter-spacing:-1.4px;
  color:var(--primary);
  white-space:nowrap;
  line-height:.98
}
.top-brand-wordmark {
  display:block;
  line-height:.9
}
.top-brand-terra {
  display:block;
  color:var(--primary);
  font-size:8px;
  font-weight:950;
  letter-spacing:2.7px;
  line-height:1;
  text-transform:lowercase;
  margin-top:3px
}
.top-brand .top-brand-meta {
  font-size:10px;
  display:block;
  letter-spacing:1.25px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:5px;
  line-height:1.15
}
.top-right {
  display:flex;
  align-items:center;
  gap:10px
}
.pill {
  padding:8px 12px;
  border-radius:999px;
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:900;
  font-size:13px;
  white-space:nowrap
}
.avatar-mini {
  width:39px;
  height:39px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  font-size:22px;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line);
  overflow:hidden;
  flex:0 0 auto;
  isolation:isolate
}
/* Keep the complete avatar inside the circular profile image. The SVG's
   native 180:292 ratio is preserved while its height follows the avatar
   container, including the smaller mobile-header size. */
.avatar-mini-svg {
  display:block;
  width:auto;
  height:100%;
  max-width:100%;
  max-height:100%;
  margin:auto;
  flex:0 0 auto
}
.layout {
  max-width:1380px;
  margin:auto;
  padding:26px clamp(14px,3vw,36px) 64px;
  display:grid;
  grid-template-columns:225px minmax(0,1fr);
  gap:25px
}
.sidebar {
  align-self:start;
  position:sticky;
  top:98px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
  box-shadow:var(--shadow)
}
.nav-label {
  font-size:10px;
  letter-spacing:1.4px;
  color:#91a0b4;
  font-weight:900;
  padding:13px 11px 7px
}
.nav-btn {
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:transparent;
  color:#53637a;
  padding:12px;
  border-radius:12px;
  text-align:left;
  font-weight:800;
  margin:2px 0
}
.nav-btn .nav-ico {
  width:22px;
  text-align:center;
  font-size:17px
}
.nav-btn:hover {
  background:#f6f8fc
}
.nav-btn.active {
  background:var(--primary-soft);
  color:var(--primary)
}
.sidebar-bottom {
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:14px
}
.main {
  min-width:0
}
.page-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin:3px 0 22px
}
.page-head h1 {
  font-size:clamp(26px,3vw,36px);
  letter-spacing:-1.2px;
  margin:5px 0 5px
}
.page-head p {
  margin:0;
  color:var(--muted);
  line-height:1.45
}
.stat-row {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px
}
.stat-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
  box-shadow:0 6px 20px rgba(30,60,100,.04)
}
.stat-card span {
  display:block;
  font-size:12px;
  color:var(--muted);
  font-weight:750
}
.stat-card strong {
  display:block;
  font-size:25px;
  letter-spacing:-.8px;
  margin-top:4px
}
.stat-card em {
  font-style:normal;
  color:var(--primary);
  font-size:12px;
  font-weight:800
}
.hero {
  background:linear-gradient(115deg,var(--primary),var(--primary2));
  color:white;
  border-radius:24px;
  padding:25px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  box-shadow:0 14px 30px color-mix(in srgb,var(--primary),transparent 78%);
  margin-bottom:19px;
  overflow:hidden;
  position:relative
}
.hero:after {
  content:"✦";
  position:absolute;
  right:22%;
  top:-45px;
  font-size:170px;
  color:#ffffff16
}
.hero h2 {
  font-size:25px;
  margin:5px 0 7px;
  letter-spacing:-.7px
}
.hero p {
  margin:0;
  color:#ffffffdf;
  max-width:560px;
  line-height:1.5
}
.hero .primary-btn {
  background:#fff;
  color:var(--primary);
  box-shadow:0 5px 0 #d8e5fc;
  white-space:nowrap;
  z-index:1
}
.section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:22px 0 13px
}
.section-title h2 {
  font-size:20px;
  letter-spacing:-.5px;
  margin:0
}
.section-title p {
  margin:3px 0 0;
  color:var(--muted);
  font-size:13px
}
.section-title > .text-btn {
  flex:0 0 auto;
  white-space:nowrap
}
.card-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}
.course-card,.panel,.feature-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:19px;
  box-shadow:0 7px 22px rgba(30,60,100,.045)
}
.course-card {
  transition:.18s;
  position:relative;
  overflow:hidden
}
.course-card:hover {
  transform:translateY(-3px);
  box-shadow:var(--shadow)
}
.course-top {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}
.course-symbol {
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  font-size:22px
}
.course-card h3 {
  font-size:17px;
  margin:13px 0 6px
}
.course-card p {
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
  min-height:40px;
  margin:0
}
.progress-track {
  height:8px;
  background:#edf1f7;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0 8px
}
.progress-fill {
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  width:0
}
.course-foot {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--muted);
  gap:10px
}
.locked {
  opacity:.64
}
.lock-chip {
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#f1f3f7;
  color:#68768a
}
.tag {
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--primary-soft);
  color:var(--primary);
  font-size:11px;
  font-weight:900;
  padding:6px 9px;
  border-radius:999px
}
.two-col {
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr);
  gap:15px
}
.feature-list {
  display:grid;
  gap:10px
}
.feature-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #eef1f6
}
.feature-row:last-child {
  border-bottom:0
}
.feature-row .ficon {
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  font-size:18px
}
.feature-row strong {
  display:block;
  font-size:13px
}
.feature-row small {
  color:var(--muted)
}
.rank-box {
  background:linear-gradient(135deg,#172943,#27466f);
  color:#fff;
  border-radius:19px;
  padding:19px
}
.rank-box h3 {
  margin:6px 0 5px
}
.rank-box p {
  font-size:12px;
  color:#d6e3f7;
  line-height:1.45
}
.rank-track {
  height:8px;
  background:#ffffff2c;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 6px
}
.rank-track span {
  display:block;
  height:100%;
  background:#b5d2ff;
  border-radius:99px
}
.rank-meta {
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#d8e5fa
}
.curriculum-note {
  background:#fff9e9;
  border:1px solid #f2e3b8;
  border-radius:13px;
  padding:12px 14px;
  color:#76602e;
  font-size:12px;
  line-height:1.5;
  margin-top:15px
}
.empty {
  text-align:center;
  background:white;
  border:1px dashed #cdd8e7;
  border-radius:17px;
  padding:30px;
  color:var(--muted)
}
.empty strong {
  display:block;
  color:var(--ink);
  margin-bottom:5px
}
/* lesson detail */
.breadcrumb {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--muted);
  margin:4px 0 16px;
  flex-wrap:wrap
}
.breadcrumb button {
  background:none;
  border:0;
  padding:0;
  color:var(--primary);
  font-weight:850
}
.lesson-list {
  display:grid;
  gap:11px
}
.lesson-row {
  display:flex;
  align-items:center;
  gap:13px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px
}
.lesson-number {
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:950;
  display:grid;
  place-items:center
}
.lesson-row strong {
  display:block
}
.lesson-row small {
  display:block;
  color:var(--muted);
  margin-top:3px
}
.lesson-row .push {
  margin-left:auto
}
.lesson-shell {
  max-width:850px;
  margin:auto
}
.lesson-progress {
  height:7px;
  background:#e8edf5;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0 20px
}
.lesson-progress span {
  height:100%;
  display:block;
  background:var(--primary);
  border-radius:99px
}
.lesson-step {
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:clamp(20px,4vw,34px);
  box-shadow:var(--shadow)
}
.lesson-step h2 {
  font-size:27px;
  margin:7px 0 14px
}
.lesson-step p {
  color:#485a72;
  line-height:1.8;
  font-size:16px
}
.example-box {
  background:var(--primary-soft);
  border-left:4px solid var(--primary);
  border-radius:10px;
  padding:14px 16px;
  margin-top:18px;
  line-height:1.6
}
.lesson-controls {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px
}
.key-point {
  display:inline-block;
  margin:6px 5px 0 0;
  background:#f1f5fb;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:800;
  color:#53647b
}
/* quizzes */
.exam-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px
}
.exam-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:19px;
  display:flex;
  flex-direction:column;
  min-height:205px
}
.exam-card .exam-icon {
  font-size:26px
}
.exam-card h3 {
  margin:12px 0 6px
}
.exam-card p {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:0 0 16px;
  flex:1
}
.exam-card button {
  align-self:flex-start
}
.quiz-shell {
  max-width:840px;
  margin:auto
}
.quiz-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}
.timer {
  background:#fff2e4;
  color:#9a5e0b;
  border-radius:12px;
  padding:9px 12px;
  font-weight:950;
  font-variant-numeric:tabular-nums
}
.quiz-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:clamp(20px,4vw,34px);
  box-shadow:var(--shadow)
}
.quiz-card h2 {
  font-size:clamp(21px,3vw,28px);
  line-height:1.35;
  margin:8px 0 22px
}
.answer-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px
}
.answer-btn {
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:13px;
  padding:14px;
  text-align:left;
  font-weight:800;
  color:#34465f;
  min-height:60px
}
.answer-btn:hover:not(:disabled) {
  border-color:var(--primary);
  background:var(--primary-soft)
}
.answer-btn.correct {
  border-color:#52bd91;
  background:#e9faf2;
  color:#176a4c
}
.answer-btn.wrong {
  border-color:#e58b91;
  background:#fff0f1;
  color:#a13d46
}
.feedback {
  margin-top:15px;
  border-radius:13px;
  background:#f2f6fc;
  padding:14px;
  line-height:1.55;
  font-size:14px
}
.quiz-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:18px

    ]},12:{title:'Fields, quantum & modern physics',desc:'Explore fields and induction alongside modern physics concepts and models.',a:['Fields and induction','Electric and magnetic fields exert forces and can transfer energy. Changing magnetic flux can induce an electromotive force.','A generator uses electromagnetic induction to produce an electrical output.'],b:['Modern physics','Quantum and nuclear models explain observations that classical physics cannot fully describe. Evaluate models using experimental evidence.','The photoelectric effect provides evidence that light energy can be transferred in discrete packets.'],qs:[

  earth:{11:{title:'Earth systems & geoscience processes',desc:'Investigate Earth materials, geological processes and system interactions.',a:['Earth materials and processes','Minerals, rocks and geological structures record processes that shape Earth over time.','Rock textures and mineral composition can help identify how a rock formed.'],b:['Earth systems and resources','Analyse interactions among geosphere, hydrosphere, atmosphere and biosphere, including resource formation and use.','Groundwater movement links the geosphere and hydrosphere.'],qs:[
     Q("An igneous rock has large crystals. What does this suggest about its cooling history?",["It cooled slowly beneath the surface","It formed by cemented sediments","It cooled instantly at the surface","It formed without molten material"],0,"Slow cooling gives crystals more time to grow, commonly within intrusive igneous rocks.",2),
     Q("Which method provides an absolute numerical age for a suitable rock?",["Superposition alone","Cross-cutting relationships alone","Radiometric dating","Comparing colour only"],2,"Radiometric dating uses known radioactive decay rates to estimate numerical ages.",2),
     Q("A seismic P-wave travels through solids and liquids, while an S-wave does not travel through liquids. What does this indicate about Earth’s outer core?",["It contains no matter","It is solid rock","It is liquid","It is part of the atmosphere"],2,"The absence of S-waves through the outer core supports the conclusion that it is liquid.",2),
     Q("Which interaction links the hydrosphere and geosphere?",["Bird migration only","Sunlight reflecting from clouds","Groundwater dissolving minerals and moving through rock","The Moon’s orbit"],2,"Water interacts with rocks through weathering, dissolution and groundwater flow.",2),
     Q("What role does heat-driven mantle convection play in Earth systems?",["It causes the daily cycle of tides","It stops all plate movement","It removes the need for gravity","It helps transfer internal energy and contributes to plate motion"],3,"Heat transfer within the mantle contributes to dynamic processes that move and deform lithospheric plates.",2),
     Q("Why are models used to investigate Earth systems over geological time?",["Models remove uncertainty completely","Models prevent new measurements","Many processes occur too slowly or at scales difficult to observe directly","Earth processes have no evidence"],2,"Models help examine long timescales and complex systems, but are tested against observations.",2)
    ]},12:{title:'Climate, resources & environmental change',desc:'Evaluate environmental systems, climate evidence and sustainable resource decisions.',a:['Climate and Earth systems','Climate interactions involve energy balance, ocean and atmosphere circulation, and feedback processes.','A feedback can amplify or reduce an initial climate change.'],b:['Resources and sustainability','Evaluate evidence about resource extraction, environmental impacts and strategies for sustainable management.','A sustainability decision considers environmental, social and economic evidence.'],qs:[
     Q("A positive climate feedback is one that…",["Always reduces an initial change","Amplifies an initial change","Stops energy transfer","Only affects daily weather"],1,"Positive feedback reinforces the original disturbance, such as ice-albedo feedback.",2),
     Q("Which evidence most directly indicates a long-term change in global sea level?",["A single beach photograph","Repeated tide-gauge and satellite measurements across decades","One high tide","One storm surge"],1,"Long-term instrumental records allow trends to be separated from short-term variations.",2),
     Q("A mine proposal has economic benefits but risks groundwater contamination. Which approach best reflects environmental assessment?",["Ignore baseline data","Consider only immediate profit","Compare measured risks, benefits, alternatives and management plans","Assume contamination is impossible"],2,"Sound decisions assess environmental, social and economic evidence, including mitigation and alternatives.",2),
     Q("An increase in atmospheric CO₂ can affect ocean chemistry by…",["Removing all dissolved carbon","Increasing dissolved CO₂ and lowering ocean pH","Making seawater strongly alkaline","Stopping ocean circulation"],1,"Dissolved CO₂ forms carbonic acid and shifts carbonate equilibria, lowering pH.",2),
     Q("Which strategy is most useful for assessing whether a resource is being managed sustainably?",["Measure only the initial resource amount","Monitor extraction rates, resource recovery and environmental indicators over time","Ignore future demand","Use one anecdote"],1,"Sustainability requires ongoing monitoring of resource stocks, recovery and impacts.",2),
     Q("A hazard-risk assessment combines hazard, exposure and vulnerability. Why?",["Exposure is unrelated to risk","Vulnerability can never be reduced","A hazard is more damaging where people or assets are exposed and vulnerable","A hazard always causes equal damage everywhere"],2,"Risk depends not only on the hazard but also on what is exposed and how susceptible it is.",2)
    ]}},
  marine:{11:{title:'Marine ecosystems & ocean processes',desc:'Study marine biodiversity, ocean circulation and ecological interactions.',a:['Marine ecosystems','Marine habitats support diverse organisms shaped by salinity, depth, light, temperature and nutrient availability.','A coral reef supports many interacting species and depends on suitable environmental conditions.'],b:['Ocean processes','Waves, tides and currents move energy and materials through marine environments.','Ocean currents redistribute heat and nutrients across large distances.'],qs:[

     Q("Countershading in many marine animals is an adaptation that…",["Allows it to breathe without oxygen","Makes the animal less visible when viewed from above or below","Makes it float at any depth","Stops all heat exchange"],1,"A darker upper surface and lighter underside can reduce visual detection from different viewing directions.",2)
    ]},12:{title:'Marine change & conservation',desc:'Evaluate pressures on marine systems and evidence-based conservation responses.',a:['Human impacts and marine change','Marine ecosystems are affected by pollution, habitat change, overharvesting and climate-driven changes.','Nutrient enrichment can trigger algal blooms that alter oxygen availability.'],b:['Monitoring and conservation','Scientists monitor marine environments using sampling, remote sensing and long-term data to assess management strategies.','A conservation plan should set measurable indicators and evaluate change over time.'],qs:[
     Q("A coral bleaching event is commonly associated with…",["A sudden increase in dissolved oxygen","Corals gaining extra skeleton","The tide stopping","Corals losing symbiotic algae under environmental stress"],3,"Heat stress can disrupt coral-algal symbiosis, causing corals to lose colour and an important energy source.",2),
     Q("Excess nutrients entering coastal water can trigger eutrophication. A likely consequence is…",["Permanent increase in water clarity","Immediate recovery of all seagrass","A decrease in primary production","Algal blooms followed by oxygen depletion"],3,"Algal blooms and subsequent decomposition can reduce dissolved oxygen.",2),

     Q("Why can marine heatwaves affect food webs?",["They only change ocean colour","They alter species physiology, distribution and timing of ecological interactions","They stop photosynthesis in all organisms permanently","They remove salinity"],1,"Temperature stress can shift species ranges, reproduction and interactions across trophic levels.",2),

  psychology:{11:{title:'Behaviour, cognition & research',desc:'Explore psychological approaches, cognition, research methods and ethical practice.',a:['Psychology and behaviour','Psychology uses scientific methods to investigate behaviour and mental processes. Different perspectives offer different explanations.','A cognitive explanation may focus on attention, memory and decision-making.'],b:['Research design and ethics','Research needs clear variables, appropriate methods, reliable data and ethical treatment of participants.','An operational definition states exactly how a variable will be measured.'],qs:[

     Q("During REM sleep, which pattern is most commonly observed?",["All muscle tone increases to allow walking","The body stops regulating temperature","Rapid eye movements and vivid dreaming are more likely","The brain becomes completely inactive"],2,"REM sleep is associated with rapid eye movements, active brain patterns and vivid dreaming.",2),
     Q("Which brain region is strongly involved in planning, decision-making and voluntary control?",["Cerebellum only","Occipital lobe","Frontal lobe","Brainstem only"],2,"The frontal lobes contribute to executive functions such as planning, decision-making and voluntary movement.",2),

     Q("Why are classification systems used when describing psychological disorders?",["They replace assessment with a single symptom","They provide shared criteria and language for organising patterns of symptoms","They prove that every person is identical","They show that behaviour never changes"],1,"Classification systems provide shared criteria and terminology, although assessment still requires context and professional judgement.",2)
    ]},12:{title:'Development, learning & psychological applications',desc:'Apply psychological evidence to development, learning, wellbeing and real-world contexts.',a:['Learning and development','Learning theories explain how experience and development influence behaviour, memory and skills.','A controlled experiment can test whether a learning strategy changes recall performance.'],b:['Evaluating evidence','Evaluate the quality of psychological claims by considering sample size, bias, reliability and whether results can be generalised.','A small convenience sample may not represent a wider population.'],qs:[

     Q("A study reports r = 0.70 between stress and sleep disruption. What can be concluded?",["Stress definitely causes all sleep disruption","There is a positive association, but causation is not established","Sleep disruption causes stress in every case","There is no relationship"],1,"Correlation describes association and does not by itself establish a causal direction.",2),
     Q("Which process is most closely associated with social conformity?",["A reflex arc","Changing behaviour or opinions to align with a group","Sensory threshold detection","Solving a memory task alone"],1,"Conformity involves adjusting behaviour or beliefs in response to group norms or pressure.",2),

     Q("Cross-cultural psychology examines…",["How culture can shape behaviour and mental processes","Whether all cultures have identical values","Behaviour without considering social context","Only differences in physical height"],0,"Cross-cultural psychology considers how cultural contexts influence thinking, behaviour and social processes.",2)
    ]}}

 const key=data[path]?.[year]; if(!key)return null;
 const seniorQuestions=key.qs;
 return C(`${path}${year}`,key.title,key.desc,SENIOR_PATHS.science.find(x=>x.id===path)?.icon||'🔬',[L(key.a[0],key.a[1],`To investigate ${key.a[0].toLowerCase()}, identify key terms, examine relevant evidence or representations, and connect the observations to an appropriate scientific model.`,key.a[2],[key.a[0]]),L(key.b[0],key.b[1],`When studying ${key.b[0].toLowerCase()}, compare evidence, check the assumptions behind the model, and explain how the findings support a conclusion.`,key.b[2],[key.b[0]])],seniorQuestions);
}

function getCourses(run){
 if(!run)return [];
 if(run.year<=10)return (JUNIOR[run.subject][run.year]||[]).map(c=>expandedJuniorCourse(c,run.subject,run.year));
 const selected=run.pathway;
 const base=run.subject==='math' ? seniorCourse(selected,run.year) : seniorScienceCourse(selected,run.year);
 return base?[expandedSeniorCourse(base,run.subject,run.year,selected)]:[];
}

const JUNIOR_LESSON_BANKS={
 math:{
  number:[
   ['Factors, multiples and primes','A factor divides a number exactly. A multiple is the result of multiplying a number by an integer, and a prime number has exactly two positive factors.','List factor pairs or use divisibility tests before choosing a method. Prime factorisation writes a composite number as a product of primes.','For 36, the prime factorisation is 2 × 2 × 3 × 3, or 2² × 3².'],
   ['Equivalent fractions and ordering','Equivalent fractions name the same quantity even when their numerators and denominators differ.','Use a common denominator or convert to decimals when comparing fractions. Keep the whole amount in mind when interpreting a fraction.','3/5 = 6/10, so 3/5 and 6/10 represent the same amount.'],
   ['Adding and subtracting fractions','Fractions can be added or subtracted directly only when they have a common denominator.','Find the lowest common denominator, rename each fraction, then add or subtract the numerators. Simplify the result if possible.','1/3 + 1/4 = 4/12 + 3/12 = 7/12.'],
   ['Multiplying and dividing fractions','Multiplication finds a fraction of another quantity; division asks how many groups of a given size fit.','Multiply numerator by numerator and denominator by denominator. To divide by a fraction, multiply by its reciprocal.','2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6.'],
   ['Rates and unit rates','A rate compares quantities measured in different units. A unit rate expresses the amount for one unit.','Divide the first quantity by the second and keep the units in the answer. Compare unit rates rather than package sizes alone.','If 180 km takes 3 hours, the average rate is 60 km/h.'],
   ['Percentage change','Percentage change compares the size of a change with the original amount.','Find the difference first, divide by the original amount, then multiply by 100. State whether the result is an increase or decrease.','A price rises from $40 to $50. The change is $10, so the increase is 10/40 × 100 = 25%.'],
   ['Powers, indices and standard form','Indices show repeated multiplication. Standard form writes very large or very small numbers as a number from 1 to 10 multiplied by a power of ten.','Use index laws only when their conditions are met. Count place-value shifts carefully when converting to standard form.','6 200 000 = 6.2 × 10⁶. Also, 3² × 3³ = 3⁵ = 243.']
  ],
  algebra:[
   ['Substitution into formulas','Substitution replaces each variable with a known value so a formula can be evaluated.','Write the replacement clearly, use brackets for negative values and follow the order of operations. Include units when the formula represents a measurement.','For A = lw, l = 8 cm and w = 3 cm give A = 8 × 3 = 24 cm².'],
   ['Collecting like terms','Like terms have matching variable parts and powers. Their coefficients can be combined, but unlike terms stay separate.','Group matching terms, add or subtract their coefficients, and keep the variable part unchanged.','7x + 3 − 2x + 5 simplifies to 5x + 8.'],
   ['Expanding single brackets','Expanding uses the distributive property to multiply a factor by every term inside brackets.','Multiply the outside term by each term inside, keeping signs with their terms. Then collect like terms.','4(2x − 3) = 8x − 12.'],
   ['Factorising expressions','Factorising reverses expansion by writing an expression as a product of factors.','Find the highest common factor shared by every term, then divide each term by it. Check by expanding again.','6x + 15 = 3(2x + 5).'],
   ['Multi-step linear equations','A linear equation can be solved by undoing operations while keeping both sides balanced.','Expand brackets if needed, collect variable terms on one side and constants on the other, then divide by the coefficient.','3(x + 2) = 18 gives 3x + 6 = 18, so x = 4.'],
   ['Inequalities and number lines','An inequality compares quantities that are not necessarily equal. Its solution is a range of possible values.','Solve using inverse operations. Reverse the inequality sign when multiplying or dividing by a negative number, then show the solution on a number line.','For 2x + 1 < 9, x < 4.'],
   ['Coordinate graphs and intercepts','Coordinates locate points using an ordered pair (x, y). A graph can show how two quantities relate.','Plot the horizontal coordinate first and the vertical coordinate second. Intercepts occur where a graph crosses an axis.','The point (−2, 3) is two units left and three units above the origin.']
  ],
  geometry:[
   ['Angle relationships','Angles on a straight line total 180°, angles around a point total 360°, and vertically opposite angles are equal.','Mark known angles on a diagram and choose the relationship that connects them to the unknown angle.','If one angle on a straight line is 118°, the adjacent angle is 62°.'],
   ['Parallel lines and transversals','When a transversal crosses parallel lines, corresponding and alternate angles are equal, while co-interior angles total 180°.','Identify the angle pair before using a rule. Show the relationship in working rather than assuming angles look equal.','If an alternate angle is 73°, its matching alternate angle is also 73°.'],
   ['Transformations','Translations, reflections, rotations and enlargements change a shape’s position, orientation or size.','Describe a transformation using its direction, distance, mirror line, centre, angle or scale factor.','A 90° clockwise rotation turns a point around the stated centre without changing its distance from that centre.'],
   ['Area of composite shapes','A composite shape is made from simpler shapes whose areas can be combined.','Split the figure into rectangles, triangles or other familiar shapes. Add joined areas or subtract cut-out areas.','A 10 cm by 6 cm rectangle with a 2 cm by 2 cm corner removed has area 60 − 4 = 56 cm².'],
   ['Volume and surface area','Volume measures the space inside a three-dimensional object; surface area measures the total area of its outside faces.','Select the formula for the solid, keep units consistent and distinguish square units from cubic units.','A prism with cross-sectional area 12 cm² and length 5 cm has volume 60 cm³.'],
   ['Pythagoras in right triangles','Pythagoras links the two shorter sides and the hypotenuse of a right-angled triangle.','Identify the hypotenuse first. Substitute the known lengths, rearrange if necessary, and use a square root for the missing side.','If the shorter sides are 6 cm and 8 cm, the hypotenuse is √(36 + 64) = 10 cm.'],
   ['Trigonometric ratios','Sine, cosine and tangent connect an angle in a right triangle to ratios of its side lengths.','Label opposite, adjacent and hypotenuse relative to the chosen angle, then select the ratio that contains the known and unknown sides.','For an angle θ, tan θ = opposite ÷ adjacent.']
  ],
  stats:[
   ['Types of data and sampling','Data may be categorical or numerical. A sample is a subset of a population used to investigate a question.','Check how the data was collected, whether the sample is representative and whether measurements are discrete or continuous.','A survey of 40 randomly selected students is a sample of the school population.'],
   ['Choosing a data display','Different displays suit different data: bar charts compare categories, histograms show grouped numerical data, and line graphs show change over time.','Look at the variable and purpose before choosing axes and intervals. Label units and use a suitable scale.','Monthly rainfall over a year is naturally shown with a time-based line graph or column graph.'],
   ['Mean, median and mode','Mean, median and mode describe different forms of centre in a data set.','Order the data to find the median, identify the most frequent value for the mode, and calculate mean as total divided by count.','For 2, 3, 3, 7, 10 the median is 3 and the mode is 3.'],
   ['Range and interquartile range','Range measures the full spread from minimum to maximum. Interquartile range measures the spread of the middle half of the data.','Compare spread alongside centre. A large range may be caused by one unusual value, so check the distribution.','For data with Q1 = 12 and Q3 = 20, the interquartile range is 8.'],
   ['Outliers and skewed distributions','An outlier is a value far from the general pattern. A skewed distribution has a longer tail on one side.','Inspect a plot and consider whether an unusual value is a recording error or a genuine observation. Median and IQR are often useful for skewed data.','A very high house price can pull the mean upward while leaving the median less affected.'],
   ['Probability of combined events','Combined events involve more than one outcome, and the relationship between events affects the calculation.','Use a table, list or tree diagram. Multiply along branches for successive independent events and add separate routes that meet the condition.','For two independent coin tosses, P(two heads) = 1/2 × 1/2 = 1/4.'],
   ['Scatterplots and association','A scatterplot shows paired numerical data and can reveal positive, negative or no clear association.','Describe direction, form and strength. A relationship does not by itself prove that one variable causes the other.','As study time rises, scores may also rise, showing a positive association in the sample.']
  ]

 science:{
  biology:[
   ['Cells as the basic unit of life','Cells are the basic structural and functional units of living organisms. Different cell structures carry out specialised jobs.','Compare plant and animal cells, link organelles to their functions and use a microscope image or diagram as evidence.','A plant cell has a cell wall and chloroplasts; an animal cell does not have either of these structures.'],
   ['Cell structures and organelles','The nucleus contains genetic material, the cell membrane controls exchange, and mitochondria release usable energy through cellular respiration.','Name a structure, describe its job and explain how that job supports the whole cell.','A cell membrane helps regulate which substances enter and leave the cell.'],
   ['Classification and scientific naming','Classification groups organisms by shared characteristics and evidence of relatedness. Scientific names provide a consistent naming system.','Use observable features and classification keys rather than relying on habitat or one superficial similarity.','A dichotomous key separates organisms by choosing between paired descriptions at each step.'],
   ['Adaptations and survival','Adaptations are inherited features that can improve an organism’s chances of surviving and reproducing in a particular environment.','Connect a feature to the environmental challenge it helps address. Distinguish inherited adaptations from changes an individual learns.','A thick layer of insulating fat can reduce heat loss in a cold marine environment.'],
   ['Food webs and trophic levels','Food webs show feeding relationships and how energy moves between producers, consumers and decomposers.','Trace arrows from the food source to the organism that receives the energy. Consider how a change in one population can affect others.','If a producer population falls, herbivores that depend on it may also decline.'],
   ['Photosynthesis and cellular respiration','Photosynthesis stores energy in glucose, while cellular respiration releases energy from glucose for cell processes.','Compare the inputs and outputs of each process and note where each occurs in a plant cell.','Photosynthesis uses carbon dioxide and water to produce glucose and oxygen in the presence of light.'],
   ['Body systems working together','Organ systems interact to maintain conditions needed for cells to function.','Trace how materials move between systems and explain how one system supports another.','The respiratory system adds oxygen to the blood, and the circulatory system transports it to body cells.']
  ],
  earth:[
   ['The rock cycle','Igneous, sedimentary and metamorphic rocks can change from one type to another through processes in the rock cycle.','Connect each rock type with its formation process, such as cooling, deposition, heat or pressure.','Magma that cools and solidifies forms igneous rock.'],
   ['Plate boundaries and landforms','Movement of tectonic plates creates features such as mountain ranges, ocean trenches, volcanoes and earthquakes.','Use plate-boundary diagrams to identify whether plates move apart, collide or slide past one another.','At a convergent boundary, one plate may be forced beneath another in a process called subduction.'],
   ['Weathering, erosion and deposition','Weathering breaks rock down, erosion moves sediment, and deposition drops sediment in a new location.','Identify the process occurring at each stage and the agent involved, such as water, wind, ice or gravity.','A river can erode a bank, transport sediment downstream and deposit it where water slows.'],
   ['The water cycle and catchments','Water moves between the atmosphere, land and oceans through processes including evaporation, condensation, precipitation and runoff.','Follow the movement of water through a catchment and consider how land use affects infiltration and runoff.','After heavy rain, impermeable surfaces can increase runoff into nearby creeks.'],
   ['Seasons and Earth’s tilt','Seasons are caused by Earth’s tilted axis as it orbits the Sun, changing sunlight angle and day length through the year.','Compare the tilt of each hemisphere relative to the Sun. Do not explain seasons as simply a change in distance from the Sun.','When the Southern Hemisphere tilts towards the Sun, it receives more direct sunlight and has longer days.'],
   ['Climate patterns and evidence','Climate describes long-term patterns in temperature, rainfall and other atmospheric conditions.','Distinguish short-term weather from long-term climate and use records from multiple years to identify trends.','A single hot day is weather evidence; decades of rising average temperatures are climate evidence.'],
   ['Earth resources and sustainability','Natural resources include materials and energy from Earth systems. Sustainable management considers environmental, social and economic impacts.','Compare extraction, use, renewal and waste. Use evidence to explain trade-offs between different management choices.','Recycling metals can reduce the need for new mining and lower resource demand.']
  ],
  chemistry:[
   ['The particle model of matter','The particle model explains solids, liquids and gases through particle arrangement, movement and spacing.','Compare particle diagrams and link changes in movement to heating or cooling.','When a liquid evaporates, particles at the surface gain enough energy to enter the gas state.'],
   ['Elements, compounds and mixtures','An element contains one type of atom, a compound contains chemically bonded elements, and a mixture contains substances physically combined.','Use particle diagrams or chemical formulae to identify whether substances are elements, compounds or mixtures.','Water is a compound; air is a mixture of gases.'],
   ['Atoms and the periodic table','Atoms contain protons, neutrons and electrons. The periodic table organises elements by atomic number and recurring properties.','Use atomic number to identify proton number and, for a neutral atom, electron number. Compare patterns within groups and periods.','A neutral sodium atom has 11 protons and 11 electrons.'],
   ['Physical and chemical changes','A physical change alters form or state without making a new substance; a chemical change produces new substances.','Look for evidence such as gas formation, colour change or temperature change, while checking whether a new substance has formed.','Melting ice is a physical change; rusting iron is a chemical change.'],
   ['Separating mixtures','Mixtures can be separated using physical properties such as particle size, solubility, boiling point or magnetism.','Choose a method that matches the property difference between components. Some mixtures need more than one separation step.','Filtration separates an insoluble solid from a liquid.'],
   ['Chemical reactions and equations','Chemical reactions rearrange atoms to form new substances. A balanced equation has equal numbers of each type of atom on both sides.','Count each atom on both sides and change coefficients, not formula subscripts, to balance an equation.','2H₂ + O₂ → 2H₂O has four hydrogen atoms and two oxygen atoms on each side.'],
   ['Conservation of mass','In a closed system, total mass is conserved during a chemical reaction because atoms are rearranged rather than created or destroyed.','Include all reactants and products when comparing mass. Remember that a gas escaping from an open container can make the measured mass appear to change.','If 12 g of carbon reacts with 32 g of oxygen, 44 g of carbon dioxide forms.']
  ],
  physics:[
   ['Forces and free-body diagrams','A force is a push or pull measured in newtons. Free-body diagrams show the forces acting on one chosen object.','Draw the object, add labelled arrows for each force and compare their directions and sizes to reason about the net force.','A stationary book on a table has a downward weight balanced by an upward normal force.'],
   ['Balanced and unbalanced forces','Balanced forces have a net force of zero; unbalanced forces produce acceleration.','Add forces with direction in mind. Do not assume that an object must be stationary just because forces are balanced; it may move at constant velocity.','A trolley moving at constant speed in a straight line has zero net force.'],
   ['Energy stores and transfers','Energy can be stored and transferred between objects and systems, but the total energy is conserved.','Describe the starting store, transfer pathway and final store. Include useful and dissipated energy when evaluating efficiency.','In a falling object, gravitational potential energy is transferred mainly to kinetic energy.'],
   ['Heat transfer','Thermal energy can be transferred by conduction, convection and radiation.','Identify whether particles, moving fluid or electromagnetic waves transfer the energy. Explain how insulation changes the rate of transfer.','A metal spoon warms in hot soup mainly through conduction.'],
   ['Waves and wave properties','Waves transfer energy without requiring an overall transfer of matter. Transverse and longitudinal waves differ in the direction of oscillation.','Label amplitude, wavelength, frequency and period. Use v = fλ when the wave speed is required.','A wave with frequency 5 Hz and wavelength 2 m travels at 10 m/s.'],
   ['Electric circuits and current','An electric current is the rate of flow of charge. A complete circuit provides a path for charge to move.','Use circuit symbols accurately and compare series and parallel arrangements. Check how adding components changes current and potential difference.','In a simple series circuit, the current is the same at every point in the loop.'],
   ['Magnetism and electromagnets','Magnetic fields describe the forces around magnets and current-carrying conductors. An electromagnet uses electric current to create a magnetic field.','Use field-line diagrams to show direction and compare ways to strengthen an electromagnet.','Adding more turns of wire around an iron core can strengthen an electromagnet.']
  ]

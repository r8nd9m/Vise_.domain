<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#246bdf" />
<title>Vise — learn, practise, level up</title>
<style>
:root {
  --primary:#2670e8;
  --primary2:#4c91ff;
  --primary-soft:#eaf2ff;
  --ink:#17253d;
  --muted:#65748b;
  --line:#e3eaf4;
  --paper:#fff;
  --bg:#f5f8fd;
  --good:#159b69;
  --warn:#e0a22c;
  --bad:#dc5a65;
  --shadow:0 12px 35px rgba(33,68,120,.10);
  --radius:22px
}
* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh
}
body.theme-purple {
  --primary:#7651d8;
  --primary2:#9a78f1;
  --primary-soft:#f1edff;
  --shadow:0 12px 35px rgba(87,60,160,.11)
}
button,input,textarea,select {
  font:inherit
}
button {
  cursor:pointer
}
button:disabled {
  opacity:.45;
  cursor:not-allowed;
  transform:none!important
}
.hidden {
  display:none!important
}
.muted {
  color:var(--muted)
}
.tiny {
  font-size:12px
}
.eyebrow {
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--primary)
}
#app {
  min-height:100vh
}
.screen {
  min-height:100vh
}
.center-screen {
  display:grid;
  place-items:center;
  padding:28px 16px;
  background:radial-gradient(circle at 12% 12%,var(--primary-soft),transparent 32%),radial-gradient(circle at 90% 85%,#dff8f0 0,transparent 28%),var(--bg)
}
.onboard-card {
  width:min(920px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:30px;
  box-shadow:0 25px 80px rgba(40,75,130,.13);
  padding:clamp(24px,5vw,52px);
  position:relative;
  overflow:hidden
}
.onboard-card:after {
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:var(--primary-soft);
  right:-95px;
  top:-110px;
  z-index:0
}
.onboard-card>* {
  position:relative;
  z-index:1
}
.brand {
  font-weight:1000;
  letter-spacing:-2px;
  font-size:clamp(34px,6vw,58px);
  color:var(--primary);
  line-height:1
}
.brand small {
  display:block;
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-top:8px
}
.onboard-title {
  font-size:clamp(28px,4vw,43px);
  letter-spacing:-1.5px;
  margin:24px 0 10px;
  line-height:1.1
}
.onboard-copy {
  color:var(--muted);
  font-size:16px;
  line-height:1.65;
  max-width:650px
}
.choice-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:28px
}
.choice-card {
  border:2px solid var(--line);
  background:#fff;
  border-radius:22px;
  padding:24px;
  text-align:left;
  transition:.2s;
  min-height:170px
}
.choice-card:hover {
  border-color:var(--primary);
  transform:translateY(-4px);
  box-shadow:var(--shadow)
}
.choice-card .choice-icon {
  font-size:38px;
  display:block;
  margin-bottom:12px
}
.choice-card strong {
  display:block;
  font-size:21px;
  margin-bottom:6px
}
.choice-card span:last-child {
  font-size:13px;
  color:var(--muted);
  line-height:1.45
}
.year-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:24px
}
.year-btn {
  border:1.5px solid var(--line);
  background:white;
  border-radius:16px;
  padding:17px;
  font-weight:900;
  color:var(--ink);
  font-size:18px;
  transition:.15s
}
.year-btn:hover {
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-2px)
}
.senior-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:24px
}
.senior-btn {
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  background:white;
  border:1.5px solid var(--line);
  border-radius:16px;
  padding:16px;
  transition:.15s
}
.senior-btn:hover {
  border-color:var(--primary);
  transform:translateY(-2px)
}
.senior-btn .ico {
  font-size:27px
}
.senior-btn strong {
  display:block
}
.senior-btn small {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px
}
.back-btn,.ghost-btn,.secondary-btn,.primary-btn,.danger-btn {
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:850;
  transition:.15s
}
.back-btn,.ghost-btn,.secondary-btn {
  background:#eef3fa;
  color:#3a4c65
}
.back-btn:hover,.ghost-btn:hover,.secondary-btn:hover {
  filter:brightness(.97);
  transform:translateY(-1px)
}
.primary-btn {
  background:var(--primary);
  color:white;
  box-shadow:0 5px 0 color-mix(in srgb,var(--primary),#000 20%);
  padding:12px 18px
}
.primary-btn:hover {
  filter:brightness(1.06);
  transform:translateY(-2px)
}
.danger-btn {
  background:#fff0f1;
  color:#b3424d
}
.text-btn {
  border:0;
  background:none;
  color:var(--primary);
  font-weight:850;
  padding:8px
}
.small-btn {
  padding:8px 11px;
  border-radius:10px;
  font-size:12px
}
/* dashboard */
.topbar {
  height:76px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(16px,4vw,46px);
  position:sticky;
  top:0;
  z-index:20
}
.top-brand {
  font-weight:1000;
  font-size:27px;
  letter-spacing:-1.4px;
  color:var(--primary);
  white-space:nowrap
}
.top-brand span {
  font-size:11px;
  display:block;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:-3px
}
.top-right {
  display:flex;
  align-items:center;
  gap:10px
}
.pill {
  padding:8px 12px;
  border-radius:999px;
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:900;
  font-size:13px;
  white-space:nowrap
}
.avatar-mini {
  width:39px;
  height:39px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  font-size:22px;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line)
}
.layout {
  max-width:1380px;
  margin:auto;
  padding:26px clamp(14px,3vw,36px) 64px;
  display:grid;
  grid-template-columns:225px minmax(0,1fr);
  gap:25px
}
.sidebar {
  align-self:start;
  position:sticky;
  top:98px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
  box-shadow:var(--shadow)
}
.nav-label {
  font-size:10px;
  letter-spacing:1.4px;
  color:#91a0b4;
  font-weight:900;
  padding:13px 11px 7px
}
.nav-btn {
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:transparent;
  color:#53637a;
  padding:12px;
  border-radius:12px;
  text-align:left;
  font-weight:800;
  margin:2px 0
}
.nav-btn .nav-ico {
  width:22px;
  text-align:center;
  font-size:17px
}
.nav-btn:hover {
  background:#f6f8fc
}
.nav-btn.active {
  background:var(--primary-soft);
  color:var(--primary)
}
.sidebar-bottom {
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:14px
}
.main {
  min-width:0
}
.page-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin:3px 0 22px
}
.page-head h1 {
  font-size:clamp(26px,3vw,36px);
  letter-spacing:-1.2px;
  margin:5px 0 5px
}
.page-head p {
  margin:0;
  color:var(--muted);
  line-height:1.45
}
.stat-row {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px
}
.stat-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
  box-shadow:0 6px 20px rgba(30,60,100,.04)
}
.stat-card span {
  display:block;
  font-size:12px;
  color:var(--muted);
  font-weight:750
}
.stat-card strong {
  display:block;
  font-size:25px;
  letter-spacing:-.8px;
  margin-top:4px
}
.stat-card em {
  font-style:normal;
  color:var(--primary);
  font-size:12px;
  font-weight:800
}
.hero {
  background:linear-gradient(115deg,var(--primary),var(--primary2));
  color:white;
  border-radius:24px;
  padding:25px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  box-shadow:0 14px 30px color-mix(in srgb,var(--primary),transparent 78%);
  margin-bottom:19px;
  overflow:hidden;
  position:relative
}
.hero:after {
  content:"✦";
  position:absolute;
  right:22%;
  top:-45px;
  font-size:170px;
  color:#ffffff16
}
.hero h2 {
  font-size:25px;
  margin:5px 0 7px;
  letter-spacing:-.7px
}
.hero p {
  margin:0;
  color:#ffffffdf;
  max-width:560px;
  line-height:1.5
}
.hero .primary-btn {
  background:#fff;
  color:var(--primary);
  box-shadow:0 5px 0 #d8e5fc;
  white-space:nowrap;
  z-index:1
}
.section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:22px 0 13px
}
.section-title h2 {
  font-size:20px;
  letter-spacing:-.5px;
  margin:0
}
.section-title p {
  margin:3px 0 0;
  color:var(--muted);
  font-size:13px
}
.section-title > .text-btn {
  flex:0 0 auto;
  white-space:nowrap
}
.card-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}
.course-card,.panel,.feature-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:19px;
  box-shadow:0 7px 22px rgba(30,60,100,.045)
}
.course-card {
  transition:.18s;
  position:relative;
  overflow:hidden
}
.course-card:hover {
  transform:translateY(-3px);
  box-shadow:var(--shadow)
}
.course-top {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}
.course-symbol {
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  font-size:22px
}
.course-card h3 {
  font-size:17px;
  margin:13px 0 6px
}
.course-card p {
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
  min-height:40px;
  margin:0
}
.progress-track {
  height:8px;
  background:#edf1f7;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0 8px
}
.progress-fill {
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  width:0
}
.course-foot {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--muted);
  gap:10px
}
.locked {
  opacity:.64
}
.lock-chip {
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#f1f3f7;
  color:#68768a
}
.tag {
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--primary-soft);
  color:var(--primary);
  font-size:11px;
  font-weight:900;
  padding:6px 9px;
  border-radius:999px
}
.two-col {
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr);
  gap:15px
}
.feature-list {
  display:grid;
  gap:10px
}
.feature-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #eef1f6
}
.feature-row:last-child {
  border-bottom:0
}
.feature-row .ficon {
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  font-size:18px
}
.feature-row strong {
  display:block;
  font-size:13px
}
.feature-row small {
  color:var(--muted)
}
.rank-box {
  background:linear-gradient(135deg,#172943,#27466f);
  color:#fff;
  border-radius:19px;
  padding:19px
}
.rank-box h3 {
  margin:6px 0 5px
}
.rank-box p {
  font-size:12px;
  color:#d6e3f7;
  line-height:1.45
}
.rank-track {
  height:8px;
  background:#ffffff2c;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 6px
}
.rank-track span {
  display:block;
  height:100%;
  background:#b5d2ff;
  border-radius:99px
}
.rank-meta {
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#d8e5fa
}
.curriculum-note {
  background:#fff9e9;
  border:1px solid #f2e3b8;
  border-radius:13px;
  padding:12px 14px;
  color:#76602e;
  font-size:12px;
  line-height:1.5;
  margin-top:15px
}
.empty {
  text-align:center;
  background:white;
  border:1px dashed #cdd8e7;
  border-radius:17px;
  padding:30px;
  color:var(--muted)
}
.empty strong {
  display:block;
  color:var(--ink);
  margin-bottom:5px
}
/* lesson detail */
.breadcrumb {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--muted);
  margin:4px 0 16px;
  flex-wrap:wrap
}
.breadcrumb button {
  background:none;
  border:0;
  padding:0;
  color:var(--primary);
  font-weight:850
}
.lesson-list {
  display:grid;
  gap:11px
}
.lesson-row {
  display:flex;
  align-items:center;
  gap:13px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px
}
.lesson-number {
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:950;
  display:grid;
  place-items:center
}
.lesson-row strong {
  display:block
}
.lesson-row small {
  display:block;
  color:var(--muted);
  margin-top:3px
}
.lesson-row .push {
  margin-left:auto
}
.lesson-shell {
  max-width:850px;
  margin:auto
}
.lesson-progress {
  height:7px;
  background:#e8edf5;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0 20px
}
.lesson-progress span {
  height:100%;
  display:block;
  background:var(--primary);
  border-radius:99px
}
.lesson-step {
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:clamp(20px,4vw,34px);
  box-shadow:var(--shadow)
}
.lesson-step h2 {
  font-size:27px;
  margin:7px 0 14px
}
.lesson-step p {
  color:#485a72;
  line-height:1.8;
  font-size:16px
}
.example-box {
  background:var(--primary-soft);
  border-left:4px solid var(--primary);
  border-radius:10px;
  padding:14px 16px;
  margin-top:18px;
  line-height:1.6
}
.lesson-controls {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px
}
.key-point {
  display:inline-block;
  margin:6px 5px 0 0;
  background:#f1f5fb;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:800;
  color:#53647b
}
/* quizzes */
.exam-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px
}
.exam-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:19px;
  display:flex;
  flex-direction:column;
  min-height:205px
}
.exam-card .exam-icon {
  font-size:26px
}
.exam-card h3 {
  margin:12px 0 6px
}
.exam-card p {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:0 0 16px;
  flex:1
}
.exam-card button {
  align-self:flex-start
}
.quiz-shell {
  max-width:840px;
  margin:auto
}
.quiz-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}
.timer {
  background:#fff2e4;
  color:#9a5e0b;
  border-radius:12px;
  padding:9px 12px;
  font-weight:950;
  font-variant-numeric:tabular-nums
}
.quiz-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:clamp(20px,4vw,34px);
  box-shadow:var(--shadow)
}
.quiz-card h2 {
  font-size:clamp(21px,3vw,28px);
  line-height:1.35;
  margin:8px 0 22px
}
.answer-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px
}
.answer-btn {
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:13px;
  padding:14px;
  text-align:left;
  font-weight:800;
  color:#34465f;
  min-height:60px
}
.answer-btn:hover:not(:disabled) {
  border-color:var(--primary);
  background:var(--primary-soft)
}
.answer-btn.correct {
  border-color:#52bd91;
  background:#e9faf2;
  color:#176a4c
}
.answer-btn.wrong {
  border-color:#e58b91;
  background:#fff0f1;
  color:#a13d46
}
.feedback {
  margin-top:15px;
  border-radius:13px;
  background:#f2f6fc;
  padding:14px;
  line-height:1.55;
  font-size:14px
}
.quiz-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:18px
}
.result-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px;
  text-align:center;
  box-shadow:var(--shadow);
  max-width:650px;
  margin:auto
}
.result-score {
  font-size:58px;
  font-weight:1000;
  letter-spacing:-3px;
  color:var(--primary)
}
/* flashcards */
.flash-layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(250px,.8fr);
  gap:15px
}
.flashcard {
  min-height:220px;
  background:linear-gradient(140deg,var(--primary),var(--primary2));
  color:white;
  border-radius:22px;
  padding:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:var(--shadow);
  cursor:pointer;
  user-select:none
}
.flashcard strong {
  font-size:22px;
  line-height:1.4
}
.flashcard small {
  display:block;
  margin-top:20px;
  color:#ffffffc9
}
.form-field {
  display:grid;
  gap:6px;
  margin-bottom:12px
}
.form-field label {
  font-size:12px;
  font-weight:900;
  color:#52647d
}
.form-field input,.form-field textarea,.form-field select {
  width:100%;
  border:1px solid #dce5f0;
  border-radius:11px;
  padding:12px;
  color:var(--ink);
  background:#fff;
  outline:none
}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)
}
.form-field textarea {
  min-height:84px;
  resize:vertical
}
.flash-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;

  general:{11:{title:'Data, finance & applied models',desc:'Build practical models for financial decisions, statistics and real-world problems.',a:['Financial mathematics','Use percentages, simple and compound growth, loans and repayments to compare financial choices.','A balance of $1,000 growing by 4% for one period becomes $1,040.'],b:['Data and networks','Summarise distributions, interpret relationships and represent connected systems using network diagrams.','A median is often useful when a data set contains an extreme value.'],qs:[

  specialist:{11:{title:'Vectors, matrices & proof',desc:'Develop mathematical reasoning with vectors, matrices and structured proof.',a:['Vectors and geometry','Represent vectors using components and use vector operations to describe magnitude, direction and geometric relationships.','The vector (3,4) has magnitude √(3² + 4²) = 5.'],b:['Matrices and reasoning','Use matrices to represent and solve structured problems. Build clear mathematical arguments using definitions and logical steps.','A 2 × 2 matrix has two rows and two columns.'],qs:[

     Q("Differentiate y = e^(3x).",["3e^(3x)","e^(x)","e^(3x)","3xe^(3x)"],0,"Using the chain rule, d/dx[e^(3x)] = 3e^(3x).",2),

    ]}}
 };
 const key=sets[path]?.[year]; if(!key)return null;
 const lessons=[L(key.a[0],key.a[1],`To apply ${key.a[0].toLowerCase()}, identify the known information, select a suitable mathematical method, show each step clearly, and interpret the result in context.`,key.a[2],[key.a[0]]),L(key.b[0],key.b[1],`To work with ${key.b[0].toLowerCase()}, choose a useful representation, check assumptions and units, then explain what the result means for the situation.`,key.b[2],[key.b[0]])];
 const seniorQuestions=key.qs;
 return C(`${path}${year}`,key.title,key.desc,SENIOR_PATHS.math.concat(SENIOR_PATHS.science).find(x=>x.id===path)?.icon||'🎓',lessons,seniorQuestions);
}

function loadProfile(){

  const profile={...base,...stored,version:3};

  profile.equipped={...base.equipped,...(stored.equipped&&typeof stored.equipped==='object'?stored.equipped:{})};
  for(const [slot,id] of Object.entries(profile.equipped)){
   const item=COSMETICS.find(c=>c.id===id&&c.slot===slot);
   if(!item||!profile.owned.includes(id))profile.equipped[slot]=base.equipped[slot]||'';
  }
  profile.achievements=stored.achievements&&typeof stored.achievements==='object'?stored.achievements:{};

function inferMathTool(q){if(q.toolId)return q.toolId;const text=`${q.question||''} ${q.explanation||''} ${q.expected||''}`.toLowerCase();if(/pythagor|hypotenuse|right[- ]angled triangle|right triangle/.test(text))return 'pythagoras';if(/quadratic|x²|x\^2|discriminant/.test(text))return 'quadratic';if(/\b(sin|cos|tan)\b|trigonomet|angle of elevation|angle of depression/.test(text))return 'trig';if(/index law|indices|exponent|\braised to\b|power of/.test(text))return 'indices';if(/circumference|diameter|radius|\bcircle\b|π|\bpi\b/.test(text))return 'circle';if(/\bspeed\b|\bvelocity\b|distance.{0,35}time|time.{0,35}distance/.test(text))return 'speed';if(/percentage|percent|discount|interest rate|percentage change/.test(text))return 'percent';if(/factoris|factoriz|expand|rearrang|simplif|\bequation\b|\bsolve\b|\bvariable\b|find x|\bx\s*=/.test(text))return 'algebra';return null;}

function toolForQuestion(q){if(run?.subject!=='math'||Number(q.difficulty||1)<3)return null;return q.toolId||null;}

function questionType(q,index){if(q.type)return q.type;if(run?.subject==='math')return index%5===1?'short':index%5===2?'working':index%5===4?'short':'mcq';return index%5===1?'short':index%5===2?'paragraph':index%5===4?'short':'mcq';}

function makeAssessmentQuestion(q,index){const type=questionType(q,index),expected=q.options?.[q.answer]||'',toolId=run?.subject==='math'?inferMathTool({...q,expected}):null,difficulty=Math.max(Number(q.difficulty||1),toolId&&index%5===2?3:toolId&&index%5===4?4:1);const decorated={...q,type,expected,difficulty,toolId};return {...decorated,modelAnswer:q.explanation||'Review the related lesson for the method and key idea.'};}

function responseLooksCorrect(q,response){const text=String(response||'').trim().toLowerCase();if(!text)return false;const expected=String(q.expected||'').trim().toLowerCase();if(q.type==='short'){if(text===expected||text.includes(expected))return true;const words=expected.replace(/[^a-z0-9.%−-]+/g,' ').split(/\s+/).filter(w=>w.length>=4);return words.length?words.slice(0,2).every(w=>text.includes(w)):false;}if(q.type==='working'){const nums=expected.match(/-?\d+(?:\.\d+)?/g)||[];if(nums.some(n=>text.replace(/,/g,'').includes(n)))return text.length>=3;const words=expected.replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(w=>w.length>=4);return words.length?words.slice(0,2).every(w=>text.includes(w)):false;}if(q.type==='paragraph'){const source=`${expected} ${q.explanation||''}`.toLowerCase();const keywords=[...new Set(source.replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(w=>w.length>=5))].slice(0,8);return text.length>=80&&keywords.filter(w=>text.includes(w)).length>=2;}return false;}

function rankInfo(){
 const total=Math.max(1,getTotalLessons()),count=Math.min(run?.completedLessons?.length||0,total);
 const needFor=index=>index===0?0:Math.ceil(total*index/(RANKS.length-1));
 let index=0;for(let i=1;i<RANKS.length;i++){if(count>=needFor(i))index=i;}
 const current={...RANKS[index],need:needFor(index)},next=RANKS[index+1]?{...RANKS[index+1],need:needFor(index+1)}:null;
 const progress=next?Math.max(0,Math.min(100,((count-current.need)/(next.need-current.need))*100)):100;
 return {index,current,next,progress,count};
}

n → practise → diagnose</h2><p class="muted" style="line-height:1.6;font-size:13px">Use these teaching lessons first. Then complete the short learning path, take a timed assessment, and use the feedback to decide what to revise next.</p></div><div class="panel" style="margin-top:14px"><strong>Tip</strong><p class="muted" style="font-size:13px;line-height:1.55">For Maths, write every algebraic step. For Science, use precise terminology and link evidence to your conclusion.</p></div></aside></div>`;}

,i)).join('')}</div></div><div><div class="rank-box"><div class="eyebrow" style="color:#bcd4ff">RANK PROGRESSION</div><h3>${rank.current.name}</h3><p>${rank.next?`${rank.next.need-rank.count} more lesson${rank.next.need-rank.count===1?'':'s'} to reach ${rank.next.name}.`:'Highest rank reached. Brilliant work.'}</p><div class="rank-track"><span style="width:${rank.progress}%"></span></div><div class="rank-meta"><span>${rank.count} completed</span><span>${rank.next?rank.next.need+' next':'MAX RANK'}</span></div></div><div class="panel" style="margin-top:14px"><div class="section-title" style="margin:0 0 8px"><h2>Quick actions</h2></div><div class="feature-list"><div class="feature-row"><span class="ficon">⏱️</span><div><strong>Timed practice</strong><small>Build exam confidence</small></div><button class="text-btn" data-action="tab" data-tab="exams">Go</button></div><div class="feature-row"><span class="ficon">🃏</span><div><strong>Flashcards</strong><small>Recall key ideas</small></div><button class="text-btn" data-action="tab" data-tab="cards">Go</button></div><div class="feature-row"><span class="ficon">🎨</span><div><strong>Customise character</strong><small>Unlock and equip items</small></div><button class="text-btn" data-action="tab" data-tab="customize">Go</button></div></div></div></div></div><div class="curriculum-note"><strong>Curriculum note:</strong> Years 7–10 are organised around QCAA’s Australian Curriculum v9.0 content descriptions. Years 11–12 use QCAA senior subject pathways and are introductory study materials, not a full syllabus. IQ Points are ${brandName()} game currency, not a measure of intelligence. This is an independent study aid; your school’s sequence and assessment may differ. <a href="https://www.qcaa.qld.edu.au/p-10/aciq/version-9/learning-areas/p-10-mathematics" target="_blank" rel="noopener">QCAA Maths</a> · <a href="https://www.qcaa.qld.edu.au/p-10/aciq/version-9/learning-areas/p-10-science" target="_blank" rel="noopener">QCAA Science</a> · <a href="https://www.qcaa.qld.edu.au/senior/senior-subjects/syllabuses" target="_blank" rel="noopener">Senior syllabuses</a></div>`;}

function renderCourseCard(c,i){const done=c.lessons.filter(l=>lessonDone(c,l)).length,pct=Math.round(done/c.lessons.length*100),locked=!unlockedCourse(i);return `<article class="course-card ${locked?'locked':''}"><div class="course-top"><span class="course-symbol">${c.icon}</span>${locked?'<span class="lock-chip">🔒 Locked</span>':`<span class="tag">${courseComplete(c)?'✓ Complete':`${done}/${c.lessons.length} lessons`}</span>`}</div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="course-foot"><span>${pct}% complete</span>${locked?'<span>Finish the course above</span>':`<button class="text-btn small-btn" data-action="open-course" data-course="${c.id}">Open →</button>`}</div></article>`;}

 return `<div class="page-head"><div><div class="eyebrow">PART 1 · LEARN BIT BY BIT</div><h1>Lessons</h1><p>Each course is split into short, guided lessons. Finish them to increase your rank.</p></div><span class="pill">${run.completedLessons.length} lessons completed</span></div><div class="card-grid">${courses.map((c,i)=>renderCourseCard(c,i)).join('')}</div>`;}

function renderLessonStep(c,l){const i=lessonStep,step=l.steps[i],done=lessonDone(c,l),pct=Math.round(((i+1)/l.steps.length)*100);const content=i===2?`<div class="example-box"><strong>Worked example</strong><br>${esc(step.body)}</div>`:`<p>${esc(step.body)}</p>`;return `<div class="breadcrumb"><button data-action="tab" data-tab="lessons">Lessons</button> / <button data-action="open-course" data-course="${c.id}">${esc(c.title)}</button> / ${esc(l.title)}</div><div class="lesson-shell"><div class="eyebrow">SHORT LESSON · STEP ${i+1} OF ${l.steps.length}</div><div class="lesson-progress"><span style="width:${pct}%"></span></div><article class="lesson-step"><span class="tag">${esc(c.title)}</span><h2>${esc(step.title)}</h2>${content}${l.takeaways?.length?`<div style="margin-top:18px"><div class="eyebrow">KEY IDEAS</div>${l.takeaways.map(t=>`<span class="key-point">${esc(t)}</span>`).join('')}</div>`:''}<div class="lesson-controls"><button class="secondary-btn" data-action="lesson-back">${i===0?'Back to course':'← Previous step'}</button>${i<l.steps.length-1?`<button class="primary-btn" data-action="lesson-next">Next step →</button>`:`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary-btn" data-action="lesson-check" data-course="${c.id}">🧪 Lesson check</button><button class="primary-btn" data-action="complete-lesson" data-course="${c.id}" data-lesson="${slug(l.title)}" ${done?'disabled':''}>${done?'Lesson completed ✓':'Complete lesson ✓'}</button></div>`}</div></article></div>`;}

function renderExams(){const courses=currentCourses();const complete=courses.filter(courseComplete);const available=eligibleQuestions().length>0;return `<div class="page-head"><div><div class="eyebrow">PART 2 · TIMED PRACTICE</div><h1>Practice exams</h1><p>Timed assessments based on lessons you have completed. Pass with 70% or more to earn IQ Points.</p></div><span class="pill">🎯 70% pass mark</span></div><div class="exam-grid"><article class="exam-card"><span class="exam-icon">📝</span><h3>Year-level exam</h3><p>A mixed timed assessment from the ${run.year<=10?`Year ${run.year} curriculum`:esc(SENIOR_PATHS[run.subject].find(p=>p.id===run.pathway)?.name||'senior subject')} material you have studied. Includes a countdown timer.</p><button class="primary-btn" data-action="start-final" ${available?'':'disabled'}>Start timed exam</button></article><article class="exam-card"><span class="exam-icon">🏆</span><h3>Course exam</h3><p>Complete all lessons in a course to unlock its focused, timed practice exam.</p><button class="secondary-btn" data-action="scroll-course">Choose course</button></article></div><div class="section-title"><div><h2>Course practice</h2><p>Finish a course’s lessons to unlock its exam.</p></div><span class="tag">${complete.length}/${courses.length} unlocked</span></div><div class="card-grid">${courses.map((c,i)=>{const ok=courseComplete(c);return `<article class="course-card ${ok?'':'locked'}"><div class="course-top"><span class="course-symbol">${c.icon}</span><span class="${ok?'tag':'lock-chip'}">${ok?'Exam unlocked':'🔒 Lessons first'}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="course-foot" style="margin-top:16px"><span>${c.questions.length} practice questions</span><button class="${ok?'primary-btn':'secondary-btn'} small-btn" data-action="course-exam" data-course="${c.id}" ${ok?'':'disabled'}>Practise</button></div></article>`;}).join('')}</div><div class="curriculum-note">Assessment note: these are original practice questions written for revision, not official QCAA examination papers. Check your teacher’s assessment conditions and subject materials too.</div>`;}

function eligibleQuestions(){return currentCourses().filter(c=>courseComplete(c)).flatMap(c=>c.questions.map(q=>({...q,course:c.title,courseId:c.id})));}

function questionScope(questions){return [...new Set(questions.map(q=>q.courseId).filter(Boolean))].sort().join('|')||'all';}

/* =========================================================
   09 · QUIZZES, TIMERS, ASSESSMENTS & RESULTS
   ========================================================= */
function startQuiz(mode,questions,minutes,label,targetCourse=null){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}const decorated=questions.map((q,i)=>makeAssessmentQuestion(q,i));const count=mode==='exam'?Math.min(16,decorated.length):mode==='course'?Math.min(decorated.length,decorated.length):mode==='lesson'?Math.min(2,decorated.length):Math.min(6,decorated.length);const picked=shuffle(decorated).slice(0,count);if(!picked.length){toast('Complete a lesson first to unlock questions from that material.');return;}const timed=mode==='exam'||mode==='course';quiz={mode,label,questions:picked,index:0,score:0,answered:false,correct:false,answer:null,selected:null,response:'',timed,endsAt:timed?Date.now()+minutes*60*1000:null,timeLeft:timed?minutes*60:null,targetCourse,expired:false,toolsViewed:{}};view='quiz';render();}

function startTimer(){if(timerHandle||!quiz||!quiz.timed||quiz.answered)return;timerHandle=setInterval(()=>{if(!quiz||view!=='quiz'){clearInterval(timerHandle);timerHandle=null;return;}const left=Math.max(0,Math.ceil((quiz.endsAt-Date.now())/1000));const el=$('#timerValue');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(timerHandle);timerHandle=null;quiz.expired=true;finishQuiz(true);}},500);}

function renderQuiz(){if(!quiz)return '';const q=quiz.questions[quiz.index],type=q.type||'mcq',progress=Math.round((quiz.index/quiz.questions.length)*100),left=quiz.timed?Math.max(0,quiz.endsAt-Date.now()):0;const timer=quiz.timed?`<div class="timer">⏱ <span id="timerValue">${Math.floor(left/60000)}:${String(Math.floor((left/1000)%60)).padStart(2,'0')}</span></div>`:`<div class="timer">∞ <span>No timer</span></div>`;const tool=toolForQuestion(q),toolViewed=tool?quiz.toolsViewed?.[tool]:true;const typeLabel={mcq:'Multiple choice',short:'Short answer',working:'Show your working',paragraph:'TEEL-style response'}[type];let body='';if(type==='mcq'){body=`<div class="answer-grid">${q.options.map((o,i)=>{const selected=quiz.selected===i;let cls='answer-btn';if(quiz.answered&&i===q.answer)cls+=' correct';else if(quiz.answered&&selected&&i!==q.answer)cls+=' wrong';else if(selected)cls+=' selected';return `<button class="${cls}" data-action="select-answer" data-index="${i}" ${quiz.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`;}).join('')}</div>`;}else{const placeholder=type==='working'?'Write every step of your calculation here…':type==='paragraph'?'Write a structured TEEL paragraph. Include terminology, evidence or an example, and explain how it supports your point.':'Write a concise answer in your own words…';body=`<textarea id="freeResponse" class="response-box" ${quiz.answered?'disabled':''} placeholder="${placeholder}">${esc(quiz.response||'')}</textarea>`;}return `${renderHeader()}<div class="layout"><aside class="sidebar"><div class="nav-label">ASSESSMENT</div><div class="nav-btn active"><span class="nav-ico">📝</span>${esc(quiz.label)}</div>${tool?`<div class="required-tool"><strong>🧰 Required tool</strong><br>${esc(MATH_TOOLS.find(t=>t.id===tool)?.name||'Maths tool')}<br>${toolViewed?`<div class="formula" style="margin-top:8px">${esc(MATH_TOOLS.find(t=>t.id===tool)?.formula||'')}</div>`:`<button class="text-btn small-btn" data-action="open-tool" data-tool="${tool}">Open tool</button>`}</div>`:''}<button class="nav-btn" data-action="exit-quiz"><span class="nav-ico">←</span>Leave test</button></aside><main class="main" id="mainContent"><div class="quiz-shell"><div class="quiz-top"><div><div class="eyebrow">QUESTION ${quiz.index+1} OF ${quiz.questions.length}</div><div class="muted tiny">${quiz.mode==='pop'?'Pop quiz':quiz.mode==='exam'?'Timed year-level exam':quiz.mode==='lesson'?'Lesson check':'Course practice exam'} · <span class="question-type">${typeLabel}</span></div></div>${timer}</div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><article class="quiz-card"><div class="eyebrow">${esc(q.course||'CURRICULUM MIX')}</div><h2>${esc(q.question)}</h2>${body}${quiz.answered?`<div class="feedback ${quiz.correct?'good':'bad'}"><strong>${quiz.correct?'Correct! ✓':'Not quite.'}</strong> ${esc(q.explanation)}</div>`:''}<div class="quiz-footer"><span class="muted tiny">Score: ${quiz.score}/${quiz.index+(quiz.answered?1:0)}</span>${quiz.answered?`<button class="primary-btn" data-action="next-question">${quiz.index===quiz.questions.length-1?'Finish assessment':'Next question →'}</button>`:`<div class="submit-row"><span class="muted tiny">${type==='mcq'?(quiz.selected==null?'Select an answer first.':'Answer selected.'):'Submit your response when you are ready.'}</span><button class="primary-btn" data-action="submit-answer" ${tool&&!toolViewed?'disabled':type==='mcq'?quiz.selected==null?'disabled':'':quiz.response?.trim()?'':'disabled'}>Submit answer ✓</button></div>`}</div></article></div></main></div>`;}

function answerQuestion(index,response){if(!quiz||quiz.answered)return;const q=quiz.questions[quiz.index];let correct=false;if(q.type==='mcq'){if(!Number.isInteger(index)||index<0||index>=q.options.length)return;quiz.answer=index;correct=index===q.answer;}else{quiz.answer=String(response||'').trim();correct=responseLooksCorrect(q,quiz.answer);}q.userResponse=q.type==='mcq'?q.options[quiz.answer]:quiz.answer;q.correct=correct;quiz.answered=true;quiz.correct=correct;if(correct)quiz.score++;render();}

function finishQuiz(expired=false){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}if(!quiz)return;quiz.expired=expired||quiz.expired;const total=quiz.questions.length,score=quiz.score,pct=total?Math.round(score/total*100):0,passed=pct>=70&&!quiz.expired;const rewardBase=20+Math.max(0,run.year-7)*5;const multiplier=quiz.mode==='exam'?1.5:quiz.mode==='course'?1.15:.65;const scope=quiz.targetCourse||questionScope(quiz.questions);const key=`${quiz.mode}:${scope}`;run.bestScores=run.bestScores||{};run.passedAssessments=run.passedAssessments||[];const best=Number(run.bestScores[key])||0;let award=0;if(passed){const raw=Math.round(rewardBase*multiplier*pct/100);award=best>=pct?0:Math.max(1,raw-Math.round(rewardBase*multiplier*best/100));run.bestScores[key]=Math.max(best,pct);run.iq+=award;if(!run.passedAssessments.includes(key)){run.passedAssessments.push(key);run.examsPassed=(run.examsPassed||0)+1;}}run.totalCorrect=(run.totalCorrect||0)+score;run.totalQuestions=(run.totalQuestions||0)+total;if(quiz.mode==='course'&&quiz.targetCourse&&passed&&!run.passedCourses.includes(quiz.targetCourse))run.passedCourses.push(quiz.targetCourse);quiz.result={score,total,pct,passed,award,expired:quiz.expired,questions:quiz.questions.map(q=>({question:q.question,type:q.type,answer:q.type==='mcq'?q.options[q.answer]:q.expected,userResponse:q.userResponse||'',model:q.modelAnswer,explanation:q.explanation,correct:q.correct}))};checkAchievements();save();view='result';render();}

function renderResult(){if(!quiz?.result)return '';const r=quiz.result,misses=r.questions.filter(q=>!q.correct),improve=misses.slice(0,5);return `${renderHeader()}<div class="layout"><aside class="sidebar"><div class="nav-label">RESULTS</div><div class="nav-btn active">🏁 Feedback</div><button class="nav-btn" data-action="tab" data-tab="learn"><span class="nav-ico">🧑‍🏫</span>Review lessons</button><button class="nav-btn" data-action="tab" data-tab="exams"><span class="nav-ico">⏱️</span>Back to exams</button></aside><main class="main"><div class="result-wrap"><article class="result-card"><div class="score-hero"><div class="eyebrow">${r.passed?'ASSESSMENT PASSED':'ASSESSMENT COMPLETE'}</div><div style="font-size:52px;margin:10px">${r.passed?'🎉':'📘'}</div><h1>${r.passed?'Great work!':'Good effort — keep practising.'}</h1><div class="result-score">${r.pct}%</div><p class="muted">${r.score}/${r.total} correct.${r.expired?' The timer ran out.':''}</p>${r.passed?(r.award?`<div class="tag" style="font-size:15px;margin:9px">+${r.award} IQ Points 🧠</div>`:'<p class="muted">You have already earned the IQ reward for this score.</p>'):'<p class="muted">You need 70% to pass and earn IQ Points.</p>'}</div><div class="result-grid"><div class="mini-result"><strong>${r.total-r.score}</strong><small>Questions to review</small></div><div class="mini-result"><strong>${r.pct}%</strong><small>Score</small></div><div class="mini-result"><strong>${r.passed?'Pass':'Keep practising'}</strong><small>Status</small></div></div><div class="improve"><strong>🎯 What to improve</strong>${improve.length?`<ul class="improvement-list">${improve.map(q=>`<li><strong>${esc(q.type==='mcq'?'Knowledge check':q.type==='working'?'Working out':q.type==='paragraph'?'TEEL explanation':'Short answer')}:</strong> ${esc(q.question)}</li>`).join('')}</ul>`:'<p style="margin:7px 0 0">Nothing flagged — excellent result. Keep revising so you can reproduce the method without prompts.</p>'}</div><div class="answer-sheet"><div class="section-title" style="margin-top:20px"><div><h2>Answer sheet</h2><p>Compare your response with the model answer and explanation.</p></div></div>${r.questions.map((q,i)=>`<details ${i<2?'open':''}><summary>${i+1}. ${esc(q.question)} ${q.correct?'✓':'✗'}</summary><p><strong>Your response:</strong> ${esc(q.userResponse||'Not recorded')}</p><p><strong>Correct answer / model response:</strong> ${esc(q.answer)}</p>${q.model?`<p class="muted"><strong>Explanation:</strong> ${esc(q.model)}</p>`:''}</details>`).join('')}</div><div class="modal-actions" style="justify-content:center;margin-top:20px"><button class="primary-btn" data-action="tab" data-tab="learn">Review learning material</button><button class="secondary-btn" data-action="tab" data-tab="exams">Back to exams</button></div></article></div></main></div>`;}

function renderCards(){const popReady=eligibleQuestions().length>0;const cards=builtInCards().concat(profile.customFlashcards.map((c,i)=>({...c,id:`custom-${i}`,index:i,custom:true})));const visible=flashMode==='custom'?cards.filter(c=>c.custom):flashMode==='builtIn'?cards.filter(c=>!c.custom):cards;if(!visible.length){return `<div class="page-head"><div><div class="eyebrow">PART 3 · RECALL PRACTICE</div><h1>Pop quizzes & flashcards</h1><p>Make a personal deck or revise the key ideas from your lessons.</p></div></div><div class="empty"><strong>No flashcards in this view yet.</strong>Add your own card using the form, or switch to lesson cards. Complete all lessons in a course to unlock a pop quiz from that material.</div>${renderCardMaker()}`;}flashIndex=((flashIndex%visible.length)+visible.length)%visible.length;const card=visible[flashIndex];return `<div class="page-head"><div><div class="eyebrow">PART 3 · RECALL PRACTICE</div><h1>Pop quizzes & flashcards</h1><p>Tap the card to reveal the answer. Create your own cards and they’ll be saved with your run profile.</p></div><button class="primary-btn" data-action="start-pop" ${popReady?'':'disabled'}>Start pop quiz →</button></div>${popReady?'':'<p class="muted tiny">Complete all lessons in a course to unlock a pop quiz based on that course.</p>'}<div class="flash-layout"><div><div class="section-title"><div><h2>Flashcard deck</h2><p>${visible.length} cards · ${flashIndex+1} of ${visible.length}</p></div><select id="flashFilter" class="form-field" style="margin:0;width:auto"><option value="all" ${flashMode==='all'?'selected':''}>All cards</option><option value="builtIn" ${flashMode==='builtIn'?'selected':''}>Lesson cards</option><option value="custom" ${flashMode==='custom'?'selected':''}>My cards</option></select></div><div class="flashcard" data-action="flip-card"><div><strong>${esc(flashFlipped?card.back:card.front)}</strong><small>${flashFlipped?'ANSWER — tap to turn back':'QUESTION — tap to reveal'}</small></div></div><div class="flash-actions"><button class="secondary-btn" data-action="flash-prev">← Previous</button><button class="primary-btn" data-action="flip-card">${flashFlipped?'Show question':'Reveal answer'}</button><button class="secondary-btn" data-action="flash-next">Next →</button>${card.custom?`<button class="danger-btn small-btn" data-action="delete-card" data-index="${card.index}">Delete card</button>`:''}</div></div><div>${renderCardMaker()}<div class="panel" style="margin-top:14px"><strong>How to use the cards</strong><p class="muted" style="font-size:13px;line-height:1.55">Try to answer before revealing the back. Revisit difficult cards, and create your own cards from class notes or topics you want to remember.</p></div></div></div>`;}

function builtInCards(){const list=[];currentCourses().forEach(c=>c.lessons.forEach(l=>{if(!lessonDone(c,l))return;const step=l.steps[0];list.push({id:`${c.id}-${slug(l.title)}`,front:`What is the key idea in “${l.title}”?`,back:step.body,custom:false});}));return list;}

function renderCardMaker(){return `<div class="panel"><div class="section-title" style="margin-top:0"><div><h2>Make a flashcard</h2><p>Build your own recall prompts.</p></div><span>✍️</span></div><form id="cardForm"><div class="form-field"><label for="cardFront">Front · question or term</label><input id="cardFront" maxlength="180" placeholder="e.g. What is homeostasis?" required></div><div class="form-field"><label for="cardBack">Back · answer</label><textarea id="cardBack" maxlength="300" placeholder="Write a short answer..." required></textarea></div><button class="primary-btn" type="submit">＋ Save flashcard</button></form></div>`;}

function renderCustomize(){const current=profile.equipped;const slots=[['face','Face'],['head','Headwear'],['outfit','Clothing'],['accessory','Accessory'],['aura','Aura'],['background','Scene']];const bg=COSMETICS.find(c=>c.id===current.background)?.emoji||'☁️';const face=COSMETICS.find(c=>c.id===current.face)?.emoji||'🙂';const head=COSMETICS.find(c=>c.id===current.head)?.emoji||'';const outfit=COSMETICS.find(c=>c.id===current.outfit)?.emoji||'👕';const accessory=COSMETICS.find(c=>c.id===current.accessory)?.emoji||'';const aura=COSMETICS.find(c=>c.id===current.aura)?.emoji||'';const bgColor=bg==='🌌'?'eee5ff':bg==='🌳'?'e8f5e8':bg==='🌅'?'fff0e8':'eaf2ff';const items=COSMETICS.filter(c=>cosmeticFilter==='all'||c.slot===cosmeticFilter);return `<div class="page-head"><div><div class="eyebrow">YOUR AVATAR</div><h1>Character studio</h1><p>Collect cosmetic parts by rank or spend IQ Points in the shop.</p></div><span class="pill">🧠 ${run.iq} IQ available</span></div><div class="avatar-layout"><section class="avatar-preview"><div class="eyebrow">LIVE PREVIEW</div><div class="avatar-stage" style="background:linear-gradient(140deg,#fff,#${bgColor})"><div style="font-size:28px;height:32px">${aura}</div><div class="avatar-figure"><div class="avatar-head">${face}<span class="headwear">${head}</span></div><div class="avatar-body">${outfit}<span class="accessory">${accessory}</span></div></div><div style="font-size:13px;font-weight:900">Your ${brandName()} character</div></div><p class="muted tiny">Your equipped parts are saved between visits and runs.</p></section><section class="panel"><div class="section-title" style="margin-top:0"><div><h2>Cosmetic collection</h2><p>Filter by slot, then equip or buy an item.</p></div></div><div class="form-field" style="max-width:240px;margin-bottom:16px"><label for="cosmeticFilter">Show</label><select id="cosmeticFilter"> <option value="all" ${cosmeticFilter==='all'?'selected':''}>All slots</option>${slots.map(([slot,label])=>`<option value="${slot}" ${cosmeticFilter===slot?'selected':''}>${label}</option>`).join('')}</select></div><div class="cosmetic-grid">${items.map(c=>{const owned=profile.owned.includes(c.id),equipped=current[c.slot]===c.id;const required=c.rank?RANKS[c.rank]?.name||'Rank':'',achievement=ACHIEVEMENTS.find(a=>a.id===c.achievement);return `<div class="cosmetic"><div class="cosmetic-icon">${c.emoji||'◻️'}</div><strong>${esc(c.name)}</strong><small>${owned?'Owned':achievement?`Unlock: ${esc(achievement.name)}`:c.rank?`Unlock at rank ${required}`:`${c.price} IQ Points`}</small><button class="${equipped?'secondary-btn':owned?'primary-btn':'secondary-btn'} small-btn" data-action="${owned?'equip-cosmetic':'buy-cosmetic'}" data-id="${c.id}" ${equipped||(!owned&&achievement)?'disabled':''}>${equipped?'Equipped':owned?'Equip':achievement?'Locked':c.rank?'Locked':'Buy'}</button></div>`;}).join('')}</div></section></div>`;}

function renderHistory(){return `<div class="page-head"><div><div class="eyebrow">SAVED RUNS</div><h1>Run history</h1><p>Your previous runs are archived here when you start a new one.</p></div><button class="primary-btn" data-action="new-run">＋ New run</button></div><div class="panel">${profile.history.length?profile.history.map(h=>`<div class="history-row"><div class="hist-icon">${h.subject==='science'?'🧪':'🔷'}</div><div><strong>${h.subject==='science'?'Vise Beyond':'Vise'} · Year ${h.year}${h.pathway?` · ${esc((SENIOR_PATHS[h.subject]||[]).find(p=>p.id===h.pathway)?.name||'')}`:''}</strong><small>Started ${new Date(h.createdAt).toLocaleDateString()} – archived ${new Date(h.endedAt).toLocaleDateString()} · ${h.completedLessons} lessons · ${h.examsPassed} assessments passed</small></div><b>${h.iq} IQ</b><span class="tag">${esc(h.rank)}</span></div>`).join(''):'<div class="empty"><strong>No previous runs yet.</strong>When you start a new run, your current run will be archived here.</div>'}</div><div class="curriculum-note">Starting a new run does not delete your run history, custom flashcards or cosmetics. It resets your current run’s lesson progress and IQ Points.</div>`;}

function renderResume(){return `<div class="modal-backdrop"><div class="modal"><div class="brand" style="font-size:38px">${run.subject==='science'?'Vise Beyond':'Vise'}</div><div class="eyebrow" style="margin-top:22px">WELCOME BACK</div><h2>Continue where you left off?</h2><p>You have a saved Year ${run.year} ${run.subject==='science'?'Science':'Maths'} run${run.pathway?` in ${esc(SENIOR_PATHS[run.subject].find(p=>p.id===run.pathway)?.name||'')}`:''}, with ${run.completedLessons.length} lessons completed and ${run.iq} IQ Points.</p><div class="modal-actions"><button class="primary-btn" data-action="continue-run">Continue run</button><button class="secondary-btn" data-action="new-run">Start a new run</button></div><p class="tiny" style="margin-top:15px">Your finished-run history and character collection are kept when you start again.</p></div></div>`;}

function modalConfirmNew(){return `<div class="modal-backdrop" id="confirmModal"><div class="modal"><h2>Start a new run?</h2><p>Your current progress and IQ total will be saved to Run History. The new run will start with fresh lesson progress and 0 IQ Points.</p><div class="modal-actions"><button class="secondary-btn" data-action="cancel-new">Keep current run</button><button class="primary-btn" data-action="confirm-new">Archive & start new</button></div></div></div>`;}

function showResume(){const modal=document.createElement('div');modal.innerHTML=renderResume();document.body.appendChild(modal.firstElementChild);}

function removeModal(){const m=$('.modal-backdrop');if(m)m.remove();}

/* =========================================================
   10 · USER ACTIONS, EVENT LISTENERS & APP STARTUP
   ========================================================= */
function action(el){const act=el.dataset.action;if(!act)return;
 switch(act){
  case'choose-subject':pendingSubject=el.dataset.subject;view='year';render();break;
  case'go-subject':pendingSubject=null;view='subject';render();break;
  case'choose-year':pendingYear=Number(el.dataset.year);if(pendingYear>=11){view='senior';render();}else createRun(pendingSubject,pendingYear);break;
  case'back-year':view='year';render();break;
  case'choose-pathway':createRun(pendingSubject,pendingYear,el.dataset.pathway);break;
  case'continue-run':removeModal();view='dashboard';activeTab='home';render();break;
  case'new-run':removeModal();document.body.insertAdjacentHTML('beforeend',modalConfirmNew());break;
  case'cancel-new':removeModal();break;
  case'confirm-new':removeModal();startNewRun();break;
  case'tab':selectedCourse=null;selectedLesson=null;activeTab=el.dataset.tab;setView('dashboard');break;
  case'open-tool':{if(!quiz)break;quiz.toolsViewed=quiz.toolsViewed||{};quiz.toolsViewed[el.dataset.tool]=true;toast(`${MATH_TOOLS.find(t=>t.id===el.dataset.tool)?.name||'Tool'} opened.`);render();break;}
  case'select-answer':{if(!quiz||quiz.answered)return;quiz.selected=Number(el.dataset.index);render();break;}
  case'submit-answer':{if(!quiz||quiz.answered)break;const q=quiz.questions[quiz.index];if(q.type==='mcq'){if(quiz.selected==null){toast('Select an answer first.');break;}answerQuestion(quiz.selected,'');}else{const response=$('#freeResponse')?.value.trim()||'';if(!response){toast('Write your response before submitting.');break;}quiz.response=response;answerQuestion(null,response);}break;}
  case'change-path':document.body.insertAdjacentHTML('beforeend',modalConfirmNew());break;
  case'open-course':selectedCourse=el.dataset.course;selectedLesson=null;lessonStep=0;activeTab='lessons';setView('dashboard');break;
  case'open-lesson':if(el.dataset.course)selectedCourse=el.dataset.course;selectedLesson=el.dataset.lesson;lessonStep=0;activeTab='lessons';setView('dashboard');break;
  case'lesson-next':lessonStep=Math.min(2,lessonStep+1);render();break;
  case'lesson-back':if(lessonStep>0){lessonStep--;render();}else{selectedLesson=null;render();}break;
  case'complete-lesson':{const id=`${el.dataset.course}:${el.dataset.lesson}`;if(!run.completedLessons.includes(id)){run.completedLessons.push(id);applyRankUnlocks();checkAchievements();save();toast('Lesson completed! Your rank progress increased.');}selectedLesson=null;render();break;}
  case'scroll-course':activeTab='exams';render();setTimeout(()=>$('.section-title')?.scrollIntoView({behavior:'smooth'}),20);break;
  case'lesson-check':{const c=currentCourses().find(x=>x.id===el.dataset.course);if(c)startQuiz('lesson',c.questions,0,`${c.title} lesson check`,c.id);break;}
  case'start-pop':{const qs=eligibleQuestions();if(!qs.length){toast('Complete every lesson in at least one course first. Pop quizzes only use completed-course material.');break;}startQuiz('pop',qs,0,'Pop quiz',`scope:${questionScope(qs)}`);break;}
  case'start-final':{const qs=eligibleQuestions();if(!qs.length){toast('Complete every lesson in at least one course to unlock your year-level practice exam.');break;}startQuiz('exam',qs,18,'Year-level timed exam',`scope:${questionScope(qs)}`);break;}
  case'course-exam':{const c=currentCourses().find(x=>x.id===el.dataset.course);if(c&&courseComplete(c))startQuiz('course',c.questions,8,`${c.title} exam`,c.id);else toast('Complete the course lessons to unlock this exam.');break;}
  
  case'next-question':if(quiz.index<quiz.questions.length-1){quiz.index++;quiz.answered=false;quiz.correct=false;quiz.answer=null;quiz.selected=null;quiz.response='';render();}else finishQuiz(false);break;
  case'exit-quiz':if(confirm('Leave this assessment? Your current attempt will not earn IQ Points.')){if(timerHandle)clearInterval(timerHandle);timerHandle=null;quiz=null;activeTab='exams';setView('dashboard');}break;
  case'flip-card':flashFlipped=!flashFlipped;render();break;
  case'flash-next':flashIndex++;flashFlipped=false;render();break;
  case'flash-prev':flashIndex--;flashFlipped=false;render();break;
  case'delete-card':if(confirm('Delete this custom flashcard?')){profile.customFlashcards.splice(Number(el.dataset.index),1);save();flashIndex=0;render();toast('Flashcard deleted.');}break;
  case'equip-cosmetic':{const item=COSMETICS.find(c=>c.id===el.dataset.id);if(item&&profile.owned.includes(item.id)){profile.equipped[item.slot]=item.id;save();render();toast(`${item.name} equipped.`);}break;}
  case'buy-cosmetic':{const item=COSMETICS.find(c=>c.id===el.dataset.id);if(!item)break;if(item.achievement){toast('Earn the matching achievement to unlock this cosmetic.');break;}if(item.rank){toast(`Reach rank ${RANKS[item.rank]?.name||item.rank} to unlock this item.`);break;}if(run.iq<item.price){toast('You need more IQ Points for this item.');break;}run.iq-=item.price;profile.owned.push(item.id);profile.equipped[item.slot]=item.id;save();render();toast(`${item.name} purchased and equipped.`);break;}
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el);});
// Keep typed short-answer / working responses in state and update Submit immediately.
$('#app').addEventListener('input',e=>{if(e.target.id!=='freeResponse'||!quiz||quiz.answered)return;quiz.response=e.target.value;const submit=$('#app [data-action="submit-answer"]');const tool=toolForQuestion(quiz.questions[quiz.index]);if(submit)submit.disabled=!quiz.response.trim()||(!!tool&&!quiz.toolsViewed?.[tool]);});
$('#app').addEventListener('change',e=>{if(e.target.id==='flashFilter'){flashMode=e.target.value;flashIndex=0;flashFlipped=false;render();}if(e.target.id==='cosmeticFilter'){cosmeticFilter=e.target.value;render();}});
$('#app').addEventListener('submit',e=>{if(e.target.id!=='cardForm')return;e.preventDefault();const front=$('#cardFront')?.value.trim(),back=$('#cardBack')?.value.trim();if(!front||!back)return;if(profile.customFlashcards.length>=500){toast('Your custom flashcard collection is full.');return;}profile.customFlashcards.push({front,back,createdAt:new Date().toISOString()});save();flashMode='custom';flashIndex=profile.customFlashcards.length-1;flashFlipped=false;render();toast('Flashcard saved.');});

function boot(){profile=loadProfile();run=profile.currentRun;if(run){applyTheme();applyRankUnlocks(true);save();showResume();}else{view='subject';render();}}
window.addEventListener('beforeunload',()=>save());
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
boot();
</script>
</body>
</html>

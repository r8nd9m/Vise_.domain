const SENIOR_LESSON_BANKS={
 essential:[
  ['Personal budgets','A budget compares expected income with planned spending over a set period.','List income and fixed costs first, then estimate variable costs and leave room for unexpected expenses.','With $520 income and $455 planned costs, the remaining amount is $65.'],
  ['Percentages in everyday finance','Percentages describe parts of a whole and are common in discounts, fees, tax and interest.','Convert the percentage to a decimal, identify the correct base amount and check whether the amount is added or subtracted.','A 10% discount on $85 is $8.50, giving a sale price of $76.50.'],
  ['Simple interest','Simple interest is calculated on the original principal for each time period.','Use I = Prt and ensure the rate and time units match. Add the interest to the principal when a final balance is required.','$2 000 at 4% simple interest for 3 years earns $240.'],
  ['Compound growth','Compound growth applies each period’s growth to the updated balance.','Use a multiplier of 1 + r for growth or 1 − r for a decrease, raised to the number of periods.','$1 000 growing by 5% for two periods becomes $1 000 × 1.05² = $1 102.50.'],
  ['Comparing loans','Loan comparisons should include interest, fees, repayment size and the total amount repaid.','Compare offers over the same borrowing amount and time period. A low advertised rate does not automatically mean the lowest total cost.','A $100 establishment fee must be included when comparing the total cost of two loans.'],
  ['Unit pricing and best buys','Unit pricing converts different package sizes to a common unit so that prices can be compared fairly.','Divide the price by the quantity, then compare the cost per kilogram, litre or item. Check that quality and quantity are comparable.','$4.80 for 800 g costs $6 per kilogram.'],
  ['Measurement accuracy','Measurement results depend on the instrument, its scale and the precision of the reading.','Record units, use the smallest scale division sensibly and avoid claiming more precision than the instrument allows.','A ruler marked in millimetres cannot support a measurement reported to six decimal places.'],
  ['Metric conversions','Metric prefixes represent powers of ten and make it possible to convert between related units.','Write the conversion factor before calculating and check whether the numerical value should increase or decrease.','2.5 km = 2 500 m because one kilometre is 1 000 metres.'],
  ['Rates and travel','Rates compare two quantities, such as distance per time or cost per unit.','Use a consistent unit system and rearrange the relationship for the unknown quantity.','A 150 km trip over 2.5 hours has an average speed of 60 km/h.'],
  ['Time and timetables','Timetable problems involve elapsed time, start and finish times, transfers and possible delays.','Convert times to a common format, account for date changes and add waiting or transfer time.','A journey beginning at 9:35 and lasting 1 hour 50 minutes ends at 11:25.'],
  ['Scale drawings and plans','A scale drawing uses a fixed ratio between drawing dimensions and real dimensions.','Convert the drawing measurement using the scale, and keep units consistent throughout the calculation.','At 1:100, a 4.2 cm plan length represents 4.2 m in reality.'],
  ['Perimeter and area in context','Perimeter measures the distance around a boundary, while area measures the size of a surface.','Sketch the shape, label dimensions and choose the correct formula. Include units and consider waste when estimating materials.','A 6 m by 4 m floor has area 24 m² and perimeter 20 m.'],
  ['Volume and capacity','Volume measures three-dimensional space; capacity describes how much a container holds.','Calculate volume using the solid’s dimensions, then convert to litres when needed. One cubic metre equals 1 000 litres.','A 0.5 m³ tank has capacity 500 L.'],
  ['Data collection and bias','A useful data collection method produces information relevant to the question and limits avoidable bias.','Define the population, sample and variable. Consider whether the sampling method could exclude important groups.','Surveying only people at a sports centre may bias a study of all residents’ exercise habits.'],
  ['Reading statistical summaries','Mean, median, range and quartiles summarise different features of a data set.','Choose a summary that suits the shape of the data and whether extreme values are present.','The median is often more representative than the mean when income data are strongly right-skewed.'],
  ['Graphs and misleading scales','Graph scales and labels influence how a data pattern is perceived.','Check axis starting points, interval size, units and whether categories are comparable before interpreting a graph.','A bar chart that starts its vertical axis at 90 can exaggerate a small difference.'],
  ['Probability in decisions','Probability measures the likelihood of an event from 0 to 1. It can inform decisions but does not guarantee an outcome.','Identify all possible outcomes and whether they are equally likely. Compare theoretical and experimental probability when data are available.','A probability of 0.2 means about 20 occurrences per 100 trials in the long run.'],
  ['Choosing a representative sample','A representative sample reflects important features of the population being studied.','Use a suitable selection method and check whether sample size, location or timing could distort the result.','Randomly sampling across several year levels is usually fairer than asking one class only.'],
  ['Interpreting maps and directions','Maps use symbols, scales, coordinates and orientation to communicate spatial information.','Read the legend, establish the direction and convert distances using the stated scale.','A 3 cm map distance at 1 cm : 2 km represents 6 km.'],
  ['Energy use and household costs','Energy consumption is measured over time and contributes to household running costs.','Read power ratings and usage times carefully. Compare energy use using consistent units such as kWh.','A 2 kW appliance used for 3 hours consumes 6 kWh.'],
  ['Workplace measurement','Workplace tasks often require dimensions, tolerances, quantities and safe interpretation of equipment readings.','Follow the stated measurement convention, repeat readings when appropriate and record results clearly.','Three measurements of a length can be compared to identify a consistent value and any unusual reading.'],
  ['Estimation and reasonableness','Estimation checks whether a calculated answer is plausible before it is used.','Round values to friendly numbers, predict an approximate result and compare it with the exact calculation.','A bill for 19 items at about $5 each should be close to $95, not $950.'],
  ['Comparing payment options','Payment plans differ in deposit, instalments, fees and total cost.','Calculate the total paid under each option and compare the same product over the same period.','A $200 deposit plus 10 payments of $35 totals $550.']
 ],
 general:[
  ['Linear models','A linear model represents a constant rate of change using a straight-line relationship.','Identify the dependent and independent variables, find the gradient and intercept, and interpret both in context.','A cost model C = 4n + 12 has a $12 fixed fee and a $4 cost per item.'],
  ['Gradient and intercept','Gradient describes change in y for each unit change in x; the y-intercept is the value when x is zero.','Calculate rise over run from two points and check what the intercept means in the situation.','For y = 3x − 5, the gradient is 3 and the y-intercept is −5.'],
  ['Simultaneous linear equations','Simultaneous equations describe conditions that must be true at the same time.','Use substitution or elimination, then check the ordered pair in both original equations.','x + y = 10 and x − y = 2 give x = 6 and y = 4.'],
  ['Quadratic relationships','Quadratic models contain a squared variable and have a parabolic graph.','Identify the intercepts, turning point and direction of opening. Use factorisation or the quadratic formula to solve roots.','x² − 5x + 6 = 0 factorises to (x − 2)(x − 3) = 0.'],
  ['Exponential growth and decay','Exponential models change by a constant percentage or multiplier over equal time periods.','Identify the initial value and multiplier, then distinguish growth from decay.','A value falling by 10% each period is multiplied by 0.90 each time.'],
  ['Financial recurrence','A recurrence relation describes how a financial balance changes from one period to the next.','Identify the starting balance, interest multiplier and regular payment or deposit, and keep the order of operations consistent.','A balance after interest and a withdrawal can be modelled by B(n+1) = 1.02B(n) − 50.'],
  ['Compound interest and investments','Compound interest adds earned interest to the balance so later interest is calculated on a larger amount.','Use a compound growth model and check the compounding frequency and number of periods.','$3 000 at 6% compounded annually for two years becomes $3 000 × 1.06².'],
  ['Loans and annuities','Loans and annuities involve repeated payments or deposits over time.','Track how each payment changes the balance and compare the total paid with the original principal.','A larger regular repayment usually reduces the time needed to repay a loan.'],
  ['Matrices as data structures','Matrices organise numerical information in rows and columns and can represent systems or transformations.','Check matrix order before addition or multiplication and perform operations entry by entry when appropriate.','A 3 × 2 matrix contains three rows and two columns.'],
  ['Matrix transformations','A transformation matrix maps an input vector to a new vector.','Multiply the matrix by the coordinate column vector and interpret the resulting position.','The matrix [[0,−1],[1,0]] rotates a point 90° anticlockwise about the origin.'],
  ['Networks and vertices','A network represents connected objects using vertices and edges.','Translate the situation into a diagram and label the connections or weights clearly.','In a road network, intersections can be vertices and roads can be edges.'],
  ['Shortest paths','A shortest-path method finds a route that minimises the total edge weight.','Add the weights along candidate routes and compare totals; identify what the weights measure.','A route of 4 + 3 + 2 minutes is shorter than a route of 5 + 6 minutes.'],
  ['Minimum spanning trees','A spanning tree connects every vertex without cycles, and a minimum spanning tree has the smallest total edge weight.','Build a connected network while choosing low-weight edges and avoiding cycles.','A minimum spanning tree can help plan a low-cost cable network connecting every building.'],
  ['Describing distributions','A distribution describes how numerical values are spread and where they cluster.','Use shape, centre, spread and possible outliers together rather than reporting a single statistic.','A long right tail indicates a positively skewed distribution.'],
  ['Standard deviation','Standard deviation measures how far values typically spread around the mean.','Interpret it in the original units and compare it with the centre and shape of the data.','A small standard deviation indicates values are clustered more closely around the mean.'],
  ['Correlation and regression','Correlation describes the direction and strength of an association; regression models a relationship between variables.','Inspect a scatterplot, consider outliers and avoid interpreting association as proof of causation.','A correlation of r = −0.8 indicates a strong negative linear association.'],
  ['Time-series trends','Time-series data record a variable at successive times.','Separate long-term trend from seasonal or irregular variation and use a consistent time scale.','Monthly sales may rise each December because of a seasonal pattern.'],
  ['Moving averages','A moving average smooths short-term fluctuations to make an underlying trend easier to see.','Choose a window length, calculate each window average and align the result with the appropriate time period.','A three-month moving average of 12, 15 and 18 is 15.'],
  ['Conditional probability','Conditional probability measures the chance of an event when another event is already known.','Restrict the sample space to the condition and compare the favourable outcomes with the remaining outcomes.','If 12 of 20 students who play sport also swim, P(swim | sport) = 12/20.'],
  ['Independent events','Two events are independent when the occurrence of one does not change the probability of the other.','Check the context before multiplying probabilities; independence should not be assumed without reason.','For independent events with probabilities 0.5 and 0.2, the chance of both is 0.1.'],
  ['Sampling variability','Different random samples from one population can produce different statistics.','Consider sample size and sampling method when comparing estimates. Larger samples generally reduce random variation.','Two random samples may produce slightly different sample means.'],
  ['Interpreting statistical reports','A statistical report should communicate the question, data source, method, result and limitations.','Check whether the evidence supports the conclusion and whether relevant context has been left out.','A survey result should state the sample size and how respondents were selected.'],
  ['Modelling assumptions','A mathematical model simplifies a real situation and depends on assumptions.','State the assumptions, test whether they fit the context and explain when the model may stop being useful.','A constant-speed travel model may fail when traffic or road conditions change.']
 ],
 methods:[
  ['Domain and range','The domain is the set of allowable inputs to a function; the range is the set of outputs produced.','Check restrictions such as denominators, square roots and the context of the model. Read ranges from graphs carefully.','For f(x) = √x over the real numbers, the domain is x ≥ 0 and range is y ≥ 0.'],
  ['Polynomial functions','Polynomial functions are sums of terms with non-negative integer powers of the variable.','Use degree and leading coefficient to predict end behaviour, then factorise or use technology to investigate roots.','The function x² − 4 has roots x = −2 and x = 2.'],
  ['Factor theorem','The factor theorem links roots of a polynomial to factors of that polynomial.','If f(a) = 0, then (x − a) is a factor. Substitute possible roots and divide the polynomial when useful.','If f(2) = 0, then x − 2 is a factor of f(x).'],
  ['Remainder theorem','The remainder theorem states that dividing f(x) by (x − a) leaves a remainder of f(a).','Substitute the value a into the polynomial rather than performing the full long division when only the remainder is needed.','The remainder when f(x) = x² + 3x + 1 is divided by x − 2 is f(2) = 11.'],
  ['Transformations of graphs','Translations, reflections and dilations change a graph’s position, orientation or scale.','Compare the transformed equation with the original and track how each change affects x- and y-values.','y = f(x − 3) shifts the graph three units to the right.'],
  ['Exponential functions','An exponential function has the variable in the exponent and models repeated multiplicative change.','Identify the base, initial value and whether the base creates growth or decay.','f(x) = 2ˣ doubles for every increase of one in x.'],
  ['Logarithms as inverse functions','Logarithms undo exponentiation and can solve equations where the unknown is in an exponent.','Convert between logarithmic and exponential form and check that the logarithm’s argument is positive.','log₂(8) = 3 because 2³ = 8.'],
  ['Solving exponential equations','Exponential equations can sometimes be solved by expressing both sides with the same base.','Rewrite powers using common bases where possible; otherwise use logarithms and check the solution.','2ˣ = 16 gives x = 4.'],
  ['Average rate of change','Average rate of change measures the change in output divided by the change in input over an interval.','Use the two endpoints and interpret the result as a secant gradient with contextual units.','If height rises from 2 m to 8 m in 3 s, the average rate is 2 m/s.'],
  ['The derivative and gradient','The derivative gives the instantaneous rate of change of a function and the gradient of its tangent.','Differentiate using appropriate rules, substitute the required input and interpret the sign and magnitude.','For f(x) = x², f′(3) = 6.'],
  ['Differentiation rules','Power, constant-multiple and sum rules provide efficient methods for differentiating polynomial expressions.','Differentiate each term, multiply by its power and reduce the exponent by one.','d/dx(5x³ − 2x) = 15x² − 2.'],
  ['The chain rule','The chain rule differentiates a composite function by multiplying the derivative of the outer function by the derivative of the inner function.','Identify the inner expression, differentiate the outer structure, then multiply by the inner derivative.','d/dx(3x + 1)² = 2(3x + 1) × 3.'],
  ['Stationary points','A stationary point occurs where the derivative is zero, so the tangent is horizontal.','Solve f′(x) = 0, then find the corresponding y-value and classify the point using further evidence.','For f(x) = x² − 4x, f′(x) = 2x − 4, so the stationary point occurs at x = 2.'],
  ['Optimisation','Optimisation finds a maximum or minimum value under stated conditions.','Build a function for the quantity being optimised, identify its domain and use derivatives or a graph to locate the best value.','A rectangular area with a fixed perimeter can be maximised by examining the area function.'],
  ['Antiderivatives','An antiderivative reverses differentiation and includes a constant of integration.','Increase the power by one and divide by the new power, then add C. Check by differentiating the result.','An antiderivative of 6x is 3x² + C.'],
  ['Definite integrals and area','A definite integral accumulates signed area between a curve and the horizontal axis over an interval.','Evaluate the antiderivative at the upper bound and subtract its value at the lower bound.','The integral of 2x from 0 to 3 is [x²]₀³ = 9.'],
  ['Velocity and displacement','Velocity is the rate of change of displacement, and the signed area under a velocity-time graph gives displacement.','Use the graph’s sign and units, and distinguish displacement from total distance when direction changes.','A constant velocity of 4 m/s for 5 s gives a displacement of 20 m.'],
  ['Discrete random variables','A discrete random variable has a countable set of possible values, each with an associated probability.','Check that probabilities are between zero and one and add to one before calculating expected values.','For a fair die, each outcome has probability 1/6.'],
  ['Expected value','Expected value is the long-run mean outcome predicted by a probability distribution.','Multiply each possible value by its probability and add the products.','A fair die has expected value (1+2+3+4+5+6)/6 = 3.5.'],
  ['Binomial distributions','A binomial model counts successes in a fixed number of independent trials with a constant success probability.','Check the number of trials, independence, two possible outcomes and fixed probability before applying the model.','The number of heads in 10 fair coin tosses can be modelled binomially.'],
  ['Normal distributions','A normal distribution is symmetric and bell-shaped, with its centre determined by the mean.','Use the mean and standard deviation to interpret standardised values and areas under the curve.','In a normal distribution, approximately 68% of values lie within one standard deviation of the mean.'],
  ['Conditional probability and trees','Tree diagrams represent successive events and show conditional probabilities along branches.','Multiply along one path and add the probabilities of separate paths that meet the required condition.','The probability of two independent events both occurring is the product of their probabilities.'],
  ['Communicating mathematical reasoning','A mathematical argument should state assumptions, show logical steps and connect the result to the original question.','Define variables, write equations clearly, justify transformations and check the final result.','A solution to a modelling problem should include both the calculated value and its meaning in context.']
 ],
 specialist:[
  ['Vector notation and components','A vector has magnitude and direction and can be represented using components.','Separate horizontal and vertical components and keep their signs to represent direction.','The vector (3,4) has magnitude √(3²+4²) = 5.'],
  ['Vector addition and subtraction','Vectors combine component by component and can represent successive displacements or forces.','Draw a head-to-tail diagram or add corresponding components, then interpret the resultant vector.','(2,−1) + (3,4) = (5,3).'],
  ['Scalar and dot products','A scalar product multiplies vectors to produce a number and can describe the angle between vectors.','Use a·b = |a||b|cosθ or multiply corresponding components and add.','(1,2)·(3,4) = 3 + 8 = 11.'],
  ['Vector geometry','Vectors can describe points, lines and geometric relationships in two and three dimensions.','Choose a consistent origin, express positions as vectors and compare directions or lengths using components.','The displacement from A(1,2) to B(4,6) is (3,4).'],
  ['Three-dimensional coordinates','Three-dimensional coordinates use x, y and z values to locate a point in space.','Use the three coordinate differences to calculate displacement and apply the three-dimensional distance formula.','The distance from (0,0,0) to (2,3,6) is √(4+9+36) = 7.'],
  ['Complex numbers','Complex numbers have a real part and an imaginary part, where i² = −1.','Collect real and imaginary terms separately and replace i² with −1 when multiplying.','(2 + 3i) + (4 − i) = 6 + 2i.'],
  ['Operations with complex numbers','Complex arithmetic follows algebraic rules while treating i as a number with square equal to −1.','Use expansion for multiplication and multiply by the conjugate when simplifying certain quotients.','(1 + i)(1 − i) = 1 − i² = 2.'],
  ['Modulus and argument','The modulus is the distance of a complex number from the origin, while the argument is its angle from the positive real axis.','Plot the real and imaginary parts, use Pythagoras for modulus and check the correct quadrant for the angle.','The modulus of 3 + 4i is 5.'],
  ['Polar form of complex numbers','Polar form represents a complex number using its modulus and argument.','Convert between rectangular and polar forms using trigonometric ratios and the correct angle.','A complex number with modulus 2 and argument 0 can be written as 2(cos 0 + i sin 0).'],
  ['De Moivre’s theorem','De Moivre’s theorem raises a complex number in polar form to an integer power by raising the modulus and multiplying the argument.','Convert to polar form, apply the power to the modulus and multiply the angle by the exponent.','[2(cos θ + i sin θ)]³ = 8(cos 3θ + i sin 3θ).'],
  ['Matrices and linear transformations','Matrices can represent transformations of vectors and coordinate points.','Multiply the transformation matrix by a coordinate vector and interpret the new coordinates.','The matrix [[1,0],[0,−1]] reflects points in the x-axis.'],
  ['Matrix multiplication','Matrix multiplication combines rows of the first matrix with columns of the second and is generally not commutative.','Check the inner dimensions match, calculate row-by-column products and preserve the correct order.','A 2×3 matrix can multiply a 3×1 matrix to produce a 2×1 matrix.'],
  ['Determinants and invertibility','The determinant is a scalar associated with a square matrix and indicates whether the matrix has an inverse.','For a 2×2 matrix, calculate ad − bc. A zero determinant means the matrix is singular.','The determinant of [[2,1],[3,4]] is 8 − 3 = 5.'],
  ['Sequences and recurrence','A sequence is an ordered list, and a recurrence relation defines terms using earlier terms.','Identify the initial values and apply the recurrence consistently to generate later terms.','For a₁ = 2 and aₙ₊₁ = aₙ + 3, the first four terms are 2, 5, 8, 11.'],
  ['Mathematical induction','Mathematical induction proves a statement for all positive integers using a base case and an inductive step.','Verify the first case, assume the statement for n = k and use that assumption to prove it for n = k + 1.','A proof that 1+2+…+n = n(n+1)/2 uses a base case and an inductive step.'],
  ['Proof by contradiction','Proof by contradiction assumes the opposite of the desired result and derives an impossibility.','State the negated claim clearly, use accepted facts and identify the contradiction.','To prove √2 is irrational, assume it is a fraction in lowest terms and show both numerator and denominator must be even.'],
  ['Permutations and arrangements','Permutations count ordered arrangements where changing the order produces a different outcome.','Decide whether order matters and whether repetition is allowed before choosing a counting method.','The number of arrangements of four distinct objects is 4! = 24.'],
  ['Combinations and selections','Combinations count selections where order does not matter.','Use combinations when the same group is counted regardless of the order in which members are selected.','Choosing 2 people from 5 gives 5C2 = 10 groups.'],
  ['Trigonometric identities','Trigonometric identities are relationships that hold for all allowed values of an angle.','Use a known identity to rewrite expressions and check restrictions before dividing by a trigonometric term.','sin²θ + cos²θ = 1.'],
  ['Parametric equations','Parametric equations express coordinates using a separate parameter, often time.','Eliminate the parameter when a Cartesian equation is needed, or use the parameter to describe motion.','If x = 2t and y = t + 1, eliminating t gives y = x/2 + 1.'],
  ['Differential equations','A differential equation relates a function to one or more of its derivatives.','Identify the derivative order, solve using an appropriate method and use initial conditions to determine constants.','If dy/dx = 3x², then y = x³ + C.'],
  ['Optimisation with constraints','Constrained optimisation finds an extreme value while satisfying a stated condition.','Use the constraint to express the objective in one variable, differentiate and check the domain and endpoints.','A fixed perimeter can be used to express a rectangle’s area as a function of one side length.'],
  ['Mathematical modelling and proof','Advanced modelling combines definitions, assumptions, representations and logical reasoning.','State the model, justify each step and discuss when the conclusion is valid.','A vector model of motion should define the reference frame and use consistent units.']
 ],
 biology:[
  ['Cell membranes and transport','The cell membrane is selectively permeable and controls movement of substances into and out of a cell.','Compare diffusion, osmosis and active transport by considering concentration gradients and energy requirements.','Water moves by osmosis across a partially permeable membrane towards the region with lower water potential.'],
  ['Diffusion and osmosis','Diffusion is net movement down a concentration gradient; osmosis is diffusion of water through a selectively permeable membrane.','Identify the substance moving, the direction of the gradient and whether a membrane is involved.','Oxygen diffuses from an alveolus into blood when its concentration is higher in the alveolus.'],
  ['Enzymes and reaction rates','Enzymes are biological catalysts that lower activation energy and are affected by conditions such as temperature and pH.','Compare reaction rates while controlling variables and explain how changes in enzyme shape affect activity.','An enzyme may work slowly at low temperature and lose its functional shape at very high temperature.'],
  ['Photosynthesis and energy storage','Photosynthesis converts light energy into chemical energy stored in organic molecules.','Relate light, carbon dioxide and water availability to the rate of photosynthesis, and identify glucose as an energy store.','A plant in low light may photosynthesise more slowly if light is the limiting factor.'],
  ['Cellular respiration and ATP','Cellular respiration transfers energy from glucose to ATP, which cells use to power processes.','Distinguish aerobic respiration from anaerobic pathways and interpret evidence such as oxygen consumption or carbon dioxide production.','Muscle cells increase cellular respiration when energy demand rises during exercise.'],
  ['DNA structure and replication','DNA stores genetic information in a sequence of nucleotides and can be copied before cell division.','Use complementary base pairing to explain how each strand can act as a template.','A pairs with T, and C pairs with G during DNA replication.'],
  ['Gene expression and proteins','Gene expression uses genetic information to produce RNA and proteins that influence cell structure and function.','Describe transcription and translation and connect changes in gene expression with cell activity.','A cell can produce more of a particular protein when the relevant gene is expressed more strongly.'],
  ['Mitosis and cell division','Mitosis produces genetically similar daughter cells for growth, repair and asexual reproduction.','Track chromosome behaviour through the stages and explain why chromosome number is maintained.','Skin cells use mitosis to replace cells lost from the surface.'],
  ['Meiosis and genetic variation','Meiosis produces haploid gametes and contributes to genetic variation.','Compare meiosis with mitosis and identify crossing over and independent assortment as sources of variation.','Gametes contain one set of chromosomes, so fertilisation restores the diploid number.'],
  ['Inheritance and pedigrees','Inheritance patterns describe how alleles are passed from parents to offspring.','Use genotype and phenotype information to interpret crosses and pedigrees.','If both parents are heterozygous for a recessive allele, each child has a 1/4 chance of being homozygous recessive.'],
  ['Mutations and genetic variation','A mutation is a change in DNA sequence. Its effect depends on where it occurs and how it influences gene expression or protein function.','Distinguish a mutation from its possible effects and consider whether it can be inherited.','A change in a protein-coding region may alter an amino acid sequence.'],
  ['Natural selection','Natural selection changes the frequency of inherited traits when some variants contribute to greater reproductive success.','Identify variation, selection pressure, differential reproduction and inheritance in a population.','A resistant bacterial variant may become more common when susceptible bacteria are removed by an antibiotic.'],
  ['Evolution and common ancestry','Evolution is change in inherited characteristics of populations across generations.','Use fossils, DNA similarities and anatomical evidence to support explanations of relatedness.','Shared DNA sequences can support the hypothesis that two species share a common ancestor.'],
  ['Phylogenetic trees','Phylogenetic trees represent hypotheses about evolutionary relationships and shared ancestry.','Read branching points as common ancestors and compare how recently groups share a branch.','Two species sharing a recent branch point are inferred to be more closely related than species sharing an older one.'],
  ['Population growth','Population size changes through births, deaths, immigration and emigration.','Interpret population data over time and identify resource limits or environmental pressures.','A population can grow rapidly when resources are abundant and limiting factors are low.'],
  ['Ecosystem interactions','Ecosystems contain interacting organisms and non-living environmental factors.','Examine competition, predation, mutualism and other interactions using evidence from the system.','A pollinator and flowering plant may both benefit from their interaction.'],
  ['Nutrient cycles','Nutrients move between organisms and the physical environment through processes such as decomposition and uptake.','Trace matter through producers, consumers, decomposers and environmental stores.','Decomposers return nutrients from dead material to the soil.'],
  ['Disease transmission','Infectious diseases spread through routes such as direct contact, droplets, contaminated surfaces or vectors.','Use evidence to identify the transmission pathway and evaluate prevention methods.','Reducing mosquito breeding sites can limit transmission of mosquito-borne disease.'],
  ['Immune responses','The immune system recognises and responds to pathogens using barriers, cells and molecules.','Distinguish general barriers from specific immune responses and explain the role of immune memory.','Memory cells can support a faster response after a person encounters the same pathogen again.'],
  ['Homeostasis','Homeostasis maintains internal conditions within suitable ranges despite external changes.','Identify the variable, receptor, control centre and effector in a feedback system.','Sweating helps regulate body temperature when internal temperature rises.'],
  ['Experimental design in biology','Biological investigations require a clear question, controlled variables, repeatable methods and ethical treatment of organisms.','Identify independent, dependent and controlled variables and explain how repeats improve reliability.','When testing light intensity and plant growth, keep plant type, water and soil consistent.'],
  ['Evaluating biological evidence','Biological claims should be evaluated using the quality, relevance and limitations of the evidence.','Consider sample size, uncertainty, controls and whether conclusions go beyond the data.','A study of five organisms may not represent an entire species.'],
  ['Biotechnology and applications','Biotechnology uses living systems or biological processes to develop products and solve problems.','Explain the process, intended benefit and possible limitations or ethical questions.','DNA profiling compares genetic patterns to help identify biological samples.']
 ],
 chemistry:[
  ['Atomic structure and isotopes','Atoms contain protons, neutrons and electrons; isotopes are atoms of the same element with different neutron numbers.','Use atomic number to identify protons and mass number to calculate neutrons.','Carbon-12 and carbon-14 both have 6 protons but different numbers of neutrons.'],
  ['Electron configuration','Electrons occupy energy levels and arrangements that influence an element’s chemical behaviour.','Use the atomic number and shell model or subshell notation appropriate to the level of the question.','A neutral oxygen atom has 8 electrons.'],
  ['Periodic trends','Periodic table patterns in atomic radius, ionisation energy and electronegativity relate to nuclear charge and electron arrangement.','Compare elements in the same group or period and explain trends using attraction between nucleus and electrons.','Atomic radius generally decreases across a period as effective nuclear attraction increases.'],
  ['Ionic bonding','Ionic bonding involves electrostatic attraction between oppositely charged ions, commonly formed by electron transfer.','Identify the ions formed and use charge balance to write a neutral formula.','Magnesium ions Mg²⁺ and chloride ions Cl⁻ form MgCl₂.'],
  ['Covalent bonding','Covalent bonding involves atoms sharing pairs of electrons to achieve more stable outer electron arrangements.','Use valence electrons to draw an appropriate Lewis structure and identify shared pairs.','A water molecule has two O–H covalent bonds.'],
  ['Metallic bonding','Metallic bonding is the attraction between positive metal ions and delocalised electrons.','Relate mobile electrons to electrical conductivity and layers of ions to malleability.','Metals conduct electricity because delocalised electrons can move through the structure.'],
  ['Molecular shape and polarity','Molecular shape and bond polarity determine whether a molecule has an overall dipole.','Draw the shape, consider bond polarity and check whether bond dipoles cancel.','Water is bent and polar because its O–H bond dipoles do not cancel.'],
  ['Intermolecular forces','Intermolecular forces act between particles and influence boiling point, melting point and solubility.','Identify dispersion forces, dipole interactions or hydrogen bonding and compare their relative strengths.','Hydrogen bonding contributes to water’s relatively high boiling point.'],
  ['Chemical equations and stoichiometry','Balanced equations show conservation of atoms and provide mole ratios for quantitative calculations.','Balance first, convert known quantities to moles and use coefficients to find the required amount.','N₂ + 3H₂ → 2NH₃ shows a 1:3:2 mole ratio.'],
  ['The mole and Avogadro constant','The mole is a counting unit for amount of substance, linked to the number of particles.','Use n = m/M for mass-to-mole conversions and multiply moles by Avogadro’s constant to count particles.','18 g of water is 1 mol because its molar mass is approximately 18 g/mol.'],
  ['Limiting reagents','The limiting reagent is consumed first and determines the maximum amount of product.','Convert reactants to moles, compare their mole ratios with the balanced equation and identify the limiting reactant.','If the equation requires 2 mol A per 1 mol B, insufficient A limits the amount of product.'],
  ['Concentration of solutions','Concentration describes the amount of solute in a given volume of solution.','Use c = n/V with volume in litres and check whether the question gives mass or amount in moles.','0.5 mol in 2 L gives a concentration of 0.25 mol/L.'],
  ['Acids, bases and pH','Acids and bases differ in their behaviour in aqueous solution; pH indicates the acidity or basicity of a solution.','Interpret the pH scale logarithmically and use indicators or measured values to compare solutions.','A solution at pH 3 is more acidic than one at pH 5.'],
  ['Redox reactions','Redox reactions involve electron transfer: oxidation is loss of electrons and reduction is gain of electrons.','Track oxidation states and identify which species is oxidised and which is reduced.','A metal atom that forms a positive ion has lost electrons and has been oxidised.'],
  ['Reaction rates','Reaction rate describes how quickly reactants are used or products form.','Use concentration or mass changes over time and explain effects of temperature, concentration, surface area and catalysts.','Powdered calcium carbonate reacts faster than large chips because more surface is exposed.'],
  ['Chemical equilibrium','Dynamic equilibrium occurs in a closed system when forward and reverse reaction rates are equal.','Use concentration changes and equilibrium ideas to predict how a system responds to a disturbance.','At equilibrium, concentrations remain constant even though both reactions continue.'],
  ['Le Chatelier’s principle','A system at equilibrium shifts in a direction that reduces the effect of a change imposed on it.','Identify the change in concentration, pressure or temperature and compare how each direction responds.','Adding a reactant can shift equilibrium towards products if other conditions are unchanged.'],
  ['Enthalpy and energy profiles','Enthalpy change describes heat energy transferred at constant pressure during a reaction.','Interpret energy profile diagrams and distinguish exothermic from endothermic reactions.','An exothermic reaction has products at lower enthalpy than the reactants.'],
  ['Organic functional groups','Functional groups are characteristic arrangements of atoms that influence the reactions of organic compounds.','Recognise common groups and use them to classify and name molecules.','An alcohol contains a hydroxyl group, –OH.'],
  ['Polymerisation','Polymerisation joins small molecules called monomers to form long-chain polymers.','Identify the monomer structure and explain how repeating units form the polymer chain.','Ethene molecules can join to form poly(ethene).'],
  ['Analytical chemistry','Analytical techniques identify substances or determine their quantities in a sample.','Match the technique to the information required and interpret calibration data or spectra carefully.','Chromatography can separate mixture components based on their movement through a medium.'],
  ['Reaction pathways','Reaction pathways describe a sequence of chemical changes linking reactants to products.','Track the structural changes at each stage and identify conditions or reagents needed.','An alcohol can be oxidised to a carbonyl compound under suitable conditions.'],
  ['Evaluating chemical data','Chemical conclusions rely on measured values, uncertainty, controls and appropriate calculations.','Check significant figures, units, repeatability and whether the evidence supports the stated conclusion.','A result with large uncertainty should not be reported with unjustified precision.']
 ],
 physics:[
  ['Motion graphs','Displacement-time and velocity-time graphs show how motion changes over time.','Use gradient to find velocity on a displacement-time graph and area to find displacement on a velocity-time graph.','A straight displacement-time line with constant gradient represents constant velocity.'],
  ['Vector components','Vectors have magnitude and direction and can be split into perpendicular components.','Resolve using trigonometry and state the reference direction for each component.','A 10 N force at 30° above horizontal has a horizontal component of 10cos30°.'],
  ['Newton’s laws','Newton’s laws connect net force, mass and motion.','Draw a free-body diagram, find the net force and apply F = ma in a consistent direction.','A 2 kg object with net force 6 N accelerates at 3 m/s².'],
  ['Momentum and impulse','Momentum is mass multiplied by velocity; impulse equals change in momentum.','Choose a positive direction, calculate initial and final momentum and apply conservation when external forces are negligible.','A 0.5 kg object moving at 4 m/s has momentum 2 kg·m/s.'],
  ['Work, energy and power','Work transfers energy when a force causes displacement; power is the rate of energy transfer.','Use the angle between force and displacement and select suitable energy or power relationships.','A 20 N force moving an object 3 m in its direction does 60 J of work.'],
  ['Conservation of mechanical energy','Mechanical energy is shared between kinetic and potential energy when dissipative effects are negligible.','Compare initial and final energy stores and account for transfers to thermal or sound energy when friction acts.','A falling object loses gravitational potential energy while gaining kinetic energy.'],
  ['Circular motion','Circular motion requires an inward centripetal acceleration even when speed is constant.','Identify the radius and speed and distinguish centripetal force from an additional physical force.','A satellite in circular orbit accelerates towards the centre of its orbit.'],
  ['Gravitational fields','A gravitational field describes the force per unit mass experienced by a mass at a location.','Use field strength and mass to calculate force, and distinguish field strength from gravitational potential energy.','A 2 kg object in a 9.8 N/kg field experiences a weight of 19.6 N.'],
  ['Electric fields and potential','Electric fields describe forces on charges, while electric potential difference is energy transferred per unit charge.','Use field diagrams and relationships between charge, force, energy and voltage.','A charge moving through 12 V transfers 12 J of energy per coulomb.'],
  ['Direct-current circuits','Circuit behaviour depends on component arrangement and the relationships between current, potential difference and resistance.','Apply Ohm’s law and series or parallel rules while tracking the units.','A 6 Ω resistor connected to 12 V carries a current of 2 A.'],
  ['Kirchhoff’s laws','Kirchhoff’s current law expresses charge conservation at a junction; the voltage law expresses energy conservation around a loop.','Label currents and potential differences consistently before forming equations.','If 2 A enters a junction and 0.5 A leaves along one branch, 1.5 A leaves through the other branch.'],
  ['Magnetic fields','Magnetic fields exert forces on magnets, moving charges and current-carrying wires.','Use the field direction and current direction to determine force direction, and identify factors affecting force size.','A current-carrying wire in a magnetic field can experience a sideways force.'],
  ['Electromagnetic induction','Changing magnetic flux through a coil can induce an electromotive force.','Identify what changes the magnetic flux and explain how the induced effect opposes the change.','Moving a magnet into a coil can induce a current in a closed circuit.'],
  ['Wave behaviour','Waves transfer energy and can reflect, refract, diffract and interfere.','Use ray or wavefront diagrams to describe changes in direction, speed or amplitude.','A wave slows when entering a medium where its wave speed is lower, causing refraction.'],
  ['Superposition and interference','When waves overlap, their displacements combine according to the principle of superposition.','Compare phase and amplitude to identify constructive or destructive interference.','Two in-phase waves of equal amplitude can produce a resultant wave with twice the amplitude.'],
  ['Sound and resonance','Sound is a mechanical longitudinal wave, and resonance occurs when a system is driven near its natural frequency.','Connect pitch with frequency, loudness with amplitude and resonance with energy transfer.','A tuning fork can make a matching resonant object vibrate strongly.'],
  ['Light and refraction','Light changes direction when it enters a medium where its speed changes, except when it enters along the normal.','Use normal lines and angles measured from the normal when applying refraction rules.','Light bends towards the normal when it enters a medium where it travels more slowly.'],
  ['Quantum and photon ideas','Quantum models describe energy exchange in discrete amounts, and photons carry energy proportional to frequency.','Use E = hf and distinguish photon energy from wave intensity.','Doubling light frequency doubles the energy of each photon.'],
  ['Photoelectric effect','The photoelectric effect occurs when light transfers enough energy to release electrons from a material.','Compare photon energy with the work function and distinguish threshold frequency from intensity.','Increasing frequency above threshold increases the maximum kinetic energy of emitted electrons.'],
  ['Nuclear stability and decay','Nuclear decay changes unstable nuclei and may emit alpha, beta or gamma radiation.','Track mass number and atomic number and compare the penetrating and ionising properties of radiation.','Alpha decay reduces mass number by four and atomic number by two.'],
  ['Relativity and reference frames','Relativity explains how measurements of time and space depend on relative motion and reference frames.','Define the observer and frame before comparing measured intervals or lengths.','Two observers moving relative to each other may measure different time intervals for the same pair of events.'],
  ['Uncertainty in measurements','Measurement uncertainty describes the range within which a measured value is reasonably expected to lie.','Use instrument resolution, repeat readings and percentage uncertainty to judge the precision of a result.','A reading of 5.0 ± 0.1 cm has a percentage uncertainty of 2%.'],
  ['Physics investigations','A physics investigation tests a relationship using controlled variables, reliable measurement and evidence-based conclusions.','Plan repeats, identify sources of error and compare data with the predicted model.','Repeating a timing measurement reduces the influence of random reaction-time variation.']

 earth:[
  ['Earth system interactions','The geosphere, hydrosphere, atmosphere and biosphere interact through transfers of matter and energy.','Identify the systems involved in a change and trace the links between them.','Volcanic activity can add gases to the atmosphere and alter local ecosystems.'],
  ['Minerals and rock identification','Minerals have characteristic properties such as hardness, cleavage, lustre and streak.','Use several observable properties together rather than relying on colour alone.','A mineral’s streak can help distinguish it from another mineral with a similar surface colour.'],
  ['Igneous processes','Igneous rocks form when magma or lava cools and solidifies, with cooling rate influencing crystal size.','Compare intrusive and extrusive settings and relate texture to the time available for crystals to grow.','Slow cooling underground can produce large crystals in granite.'],
  ['Sedimentary records','Sedimentary rocks form from deposited material and can preserve evidence of past environments.','Interpret layering, grain size, fossils and sedimentary structures to infer past conditions.','Rounded river gravel may become conglomerate after burial and cementation.'],
  ['Metamorphism','Metamorphic rocks form when existing rocks are changed by heat, pressure or chemically active fluids without fully melting.','Identify the parent rock and the conditions that produce new minerals or textures.','Shale can change into slate under increasing pressure and temperature.'],
  ['Tectonic processes','Plate motion is driven by processes within Earth and creates different boundary environments.','Use geological evidence such as earthquakes, volcanoes and seafloor patterns to support plate-motion explanations.','A mid-ocean ridge forms where plates move apart and new crust is produced.'],
  ['Earthquakes and seismic waves','Earthquakes release energy that travels through Earth as seismic waves.','Compare P-waves and S-waves and use arrival-time differences to reason about distance from an epicentre.','P-waves arrive before S-waves because they travel faster through the same medium.'],
  ['Geological time','Geological time scales organise Earth history using relative and numerical dating evidence.','Use rock layers, index fossils and radiometric ages while recognising the assumptions of each method.','A layer below another undisturbed layer is generally older by the principle of superposition.'],
  ['Fossils and past environments','Fossils preserve evidence of past organisms and environments.','Consider the fossil type, surrounding rock and geological context before drawing conclusions.','Marine fossils found in sedimentary rock can indicate that the area was once underwater.'],
  ['Atmospheric circulation','Global atmospheric circulation moves heat and moisture and contributes to broad climate patterns.','Interpret pressure belts, prevailing winds and rising or sinking air using circulation diagrams.','Warm air rising near the equator contributes to areas of low pressure and frequent rainfall.'],
  ['Ocean-atmosphere interactions','Ocean and atmosphere exchange energy and moisture, influencing regional and global climate.','Connect sea-surface temperature with evaporation, winds and rainfall patterns.','Warm ocean water can provide energy and moisture to a developing tropical cyclone.'],
  ['Climate proxies','Climate proxies provide indirect evidence about past climate when direct measurements are unavailable.','Compare evidence from ice cores, tree rings, sediments and fossils, noting what each proxy measures.','Ice-core gas bubbles preserve samples of ancient atmospheric composition.'],
  ['Hydrological systems','Hydrological systems move water through stores and flows, including groundwater, rivers, soil and the atmosphere.','Distinguish a water store from a flow and consider how pumping or land clearing affects the balance.','Groundwater extraction faster than recharge can lower the water table.'],
  ['Natural hazards and risk','Natural hazards become risks when they affect people, infrastructure or valued environments.','Compare hazard likelihood, exposure and vulnerability when evaluating risk reduction strategies.','An evacuation plan can reduce exposure to a flood hazard.'],
  ['Land degradation','Land degradation reduces the capacity of land to support ecosystems or human uses.','Identify drivers such as erosion, salinity and vegetation loss, then evaluate management responses.','Maintaining ground cover can reduce soil erosion by wind and water.'],
  ['Resource extraction and impacts','Resource extraction provides materials and energy but can affect land, water, biodiversity and communities.','Compare environmental costs and benefits over the full life cycle of a resource project.','Rehabilitation plans aim to restore disturbed mine sites after extraction.'],
  ['Renewable and non-renewable resources','Renewable resources replenish on human timescales under suitable management, while non-renewable resources are finite.','Compare renewal rate with extraction rate and consider reliability, storage and environmental impacts.','A fishery may be renewable only when harvest remains within sustainable limits.'],
  ['Biodiversity and ecosystem services','Biodiversity supports ecosystem resilience and services such as pollination, water filtration and nutrient cycling.','Connect species, genetic and ecosystem diversity with the functions they support.','Wetlands can filter sediment and provide habitat for many species.'],
  ['Environmental monitoring','Environmental monitoring tracks changes using repeated measurements and consistent sampling methods.','Select indicators, sites and sampling frequency that match the question and allow comparisons over time.','Repeated water-quality measurements can show whether nutrient concentrations are changing.'],
  ['Remote sensing and GIS','Remote sensing collects information from a distance, while GIS stores and analyses spatial data.','Interpret map layers, resolution and classification choices before comparing places or time periods.','Satellite images can show changes in vegetation cover across a region.'],
  ['Climate adaptation','Climate adaptation reduces harm by adjusting systems to current or expected climate impacts.','Match a strategy to the local hazard and assess effectiveness, cost and equity.','Coastal planning may use setbacks and restored dunes to reduce exposure to erosion.'],
  ['Sustainability indicators','Sustainability indicators measure environmental, social and economic conditions to support decisions.','Choose indicators that are measurable, relevant and able to reveal trade-offs.','Water use per person can help track progress in reducing demand.'],
  ['Evaluating Earth science claims','Earth science explanations should be supported by multiple lines of evidence and clearly stated uncertainty.','Compare data sources, timescales and alternative explanations before reaching a conclusion.','A climate trend is stronger evidence when it is supported by several independent records.']
 ],
 marine:[
  ['Ocean zones and habitats','Marine environments vary with depth, light, pressure, substrate and distance from shore.','Describe the physical conditions of a zone and connect them with the organisms adapted to live there.','Photosynthetic organisms are most abundant where sufficient sunlight reaches the water.'],
  ['Ocean temperature and density','Temperature and salinity influence seawater density and contribute to ocean layering and circulation.','Compare water masses using temperature and salinity data rather than temperature alone.','Cold, salty seawater is generally denser than warm, fresher seawater.'],
  ['Ocean currents','Ocean currents move water and redistribute heat, nutrients and organisms.','Distinguish surface currents from deep circulation and interpret the effect of winds, density and Earth’s rotation.','A warm current can raise coastal temperatures in regions it passes.'],
  ['Waves and coastal processes','Waves transfer energy through water and influence sediment movement along coastlines.','Identify wave direction, energy and the shape of the coast when explaining erosion or deposition.','Longshore drift moves sediment along a beach when waves approach at an angle.'],
  ['Tides and tidal patterns','Tides are regular changes in sea level mainly caused by gravitational interactions involving the Moon and Sun.','Compare high and low tides, spring and neap patterns, and the local timing of tidal cycles.','Spring tides have a larger tidal range than neap tides.'],
  ['Salinity and ocean chemistry','Seawater chemistry depends on dissolved ions, freshwater input, evaporation and biological processes.','Interpret salinity measurements in context and identify processes that raise or lower salinity.','High evaporation can increase salinity when water is removed but dissolved salts remain.'],
  ['Marine primary production','Marine primary producers convert light or chemical energy into organic matter that supports food webs.','Connect light availability, nutrients and temperature with rates of primary production.','Phytoplankton use light and dissolved nutrients to produce organic matter.'],
  ['Marine food webs','Marine food webs show how energy and nutrients move among producers, consumers and decomposers.','Trace feeding links and consider how a change in one population can affect higher trophic levels.','A decline in small fish can reduce food availability for larger predators.'],
  ['Coral reef ecosystems','Coral reefs are diverse ecosystems built by coral animals and supported by complex ecological relationships.','Explain the role of symbiosis, water quality, temperature and habitat complexity.','Reef-building corals host photosynthetic symbionts that provide some of their energy.'],
  ['Coral bleaching','Coral bleaching occurs when stressed corals lose or expel symbiotic algae, reducing their colour and energy supply.','Use temperature and water-quality evidence to explain stress and distinguish bleaching from immediate coral death.','A prolonged marine heatwave can increase the risk of coral bleaching.'],
  ['Seagrass and mangrove habitats','Seagrass beds and mangroves provide nursery habitat, stabilise sediments and store carbon.','Compare their physical setting, ecological roles and pressures from coastal development.','Mangrove roots can trap sediment and provide shelter for juvenile fish.'],
  ['Marine biodiversity','Marine biodiversity includes variation within species, between species and among marine ecosystems.','Use sampling evidence to compare richness and evenness and identify threats to diversity.','A reef with many species and balanced populations may have higher diversity than one dominated by a single species.'],
  ['Marine population dynamics','Marine populations change through recruitment, mortality, migration and environmental conditions.','Interpret catch or survey data and distinguish population trends from temporary changes in observation.','A strong recruitment year can temporarily increase the number of juvenile fish.'],
  ['Fisheries and sustainable harvest','Fisheries management aims to maintain populations while supporting food, livelihoods and ecosystems.','Compare catch limits, size restrictions, protected areas and monitoring evidence.','A seasonal closure can protect a species during its breeding period.'],
  ['Marine pollution','Marine pollution includes plastics, nutrients, chemicals, oil and noise that can affect organisms and habitats.','Trace sources and pathways, then link exposure to ecological effects using evidence.','Excess nutrients can contribute to algal blooms and low oxygen in coastal waters.'],
  ['Ocean acidification','Ocean acidification occurs as seawater absorbs carbon dioxide and carbonate chemistry changes.','Explain the link between dissolved CO₂, pH and carbonate availability for shell-building organisms.','Lower carbonate availability can make it harder for some organisms to build calcium carbonate structures.'],
  ['Marine protected areas','Marine protected areas manage human activities within defined zones to conserve habitats and biodiversity.','Evaluate boundaries, enforcement, ecological connectivity and effects on local communities.','A no-take zone can allow some fish populations to recover.'],
  ['Marine field sampling','Field sampling gathers observations from marine habitats using consistent methods.','Choose transects, quadrats or other methods appropriate to the organism and habitat, then record limitations.','A transect can compare seagrass cover from the shore towards deeper water.'],
  ['Water-quality indicators','Water quality can be assessed using temperature, salinity, turbidity, dissolved oxygen, nutrients and pH.','Select measurements relevant to the ecological question and compare results against appropriate reference conditions.','Low dissolved oxygen may indicate conditions that stress fish and invertebrates.'],
  ['Marine research data','Marine datasets require careful handling of sampling effort, units, season and measurement uncertainty.','Graph results, identify patterns and consider whether the sample represents the wider marine system.','Comparing surveys from the same season can reduce one source of variation.'],
  ['Coastal change and management','Coastlines change through waves, currents, storms, sediment supply and human structures.','Distinguish erosion and accretion and assess how management alters sediment movement.','A seawall may protect one section while changing erosion patterns nearby.'],
  ['Marine climate change','Climate change affects oceans through warming, sea-level rise, changing circulation and acidification.','Use long-term records and connect physical changes with ecological consequences.','Marine heatwaves can shift species distributions towards cooler waters.'],
  ['Evaluating conservation strategies','Conservation strategies should be judged using measurable outcomes and local ecological context.','Compare the baseline, intervention and monitoring results while considering unintended effects.','A restoration project should track habitat cover and the return of associated species.']
 ],
 psychology:[
  ['Research questions and hypotheses','A research question defines what a study will investigate, while a hypothesis predicts a relationship or outcome.','Make variables clear and measurable and ensure the hypothesis can be tested with the chosen method.','A study might predict that spaced revision leads to higher recall scores than one cramming session.'],
  ['Independent and dependent variables','The independent variable is changed or compared by the researcher; the dependent variable is measured.','Identify what is manipulated and what outcome is recorded, then list relevant controlled variables.','In a memory experiment, revision method may be independent and recall score dependent.'],
  ['Experimental and correlational methods','Experiments test effects under controlled conditions, while correlational studies examine naturally occurring associations.','Check whether variables were manipulated and whether alternative explanations remain possible.','A correlation between sleep and grades does not prove that sleep alone caused the grade difference.'],
  ['Sampling and generalisation','Sampling determines who participates and affects how widely results can be applied.','Consider sample size, selection method, participant diversity and the target population.','A sample made only of university students may not represent all adolescents.'],
  ['Reliability and validity','Reliability concerns consistency of measurement, while validity concerns whether a method measures what it intends to measure.','Use repeated measures and clear operational definitions, then evaluate whether the measure captures the intended construct.','A scale that gives the same reading repeatedly may be reliable but not valid if it measures the wrong quantity.'],
  ['Ethics in psychological research','Psychological research should respect participants through informed consent, confidentiality, voluntary participation and appropriate risk management.','Identify ethical issues before data collection and provide a clear withdrawal process.','Participants should know the general nature of a study and that they can withdraw.'],
  ['Descriptive statistics','Descriptive statistics summarise data using measures of centre, spread and frequency.','Choose statistics that suit the data type and distribution and report units where relevant.','The median can summarise a skewed distribution of response times.'],
  ['The nervous system','The nervous system receives information, processes it and coordinates responses through neurons and connected structures.','Trace the pathway from sensory input to processing and response.','A sensory neuron carries information from a receptor towards the central nervous system.'],
  ['Neurons and synapses','Neurons transmit signals electrically along their membranes and communicate chemically across many synapses.','Identify dendrites, cell body, axon and synapse, and explain the direction of information flow.','Neurotransmitters cross a synaptic gap and bind to receptors on a receiving cell.'],
  ['Sensation and perception','Sensation detects physical stimuli; perception organises and interprets sensory information.','Distinguish the stimulus from the interpretation and consider how context can influence perception.','The same ambiguous image may be interpreted differently depending on surrounding cues.'],
  ['Attention and selective processing','Attention prioritises some information while other available information receives less processing.','Consider task demands, distractions and limits on cognitive resources when explaining performance.','A person may miss a quiet announcement while concentrating on a difficult task.'],
  ['Memory processes','Memory involves encoding, storage and retrieval, which can be influenced by attention and meaning.','Distinguish stages and strategies and use evidence from recall or recognition tasks.','Organising facts into meaningful groups can improve later retrieval.'],
  ['Learning through association','Classical conditioning links stimuli, while operant conditioning links behaviour with consequences.','Identify the stimulus, response or consequence involved and distinguish the two learning processes.','A behaviour followed by a reward may become more likely in a similar situation.'],
  ['Observational learning','Observational learning occurs when people learn by watching and interpreting another person’s behaviour and its consequences.','Consider attention, retention, ability to reproduce the behaviour and motivation.','A child may copy a practical skill after observing a demonstration.'],
  ['Cognitive development','Cognitive development describes changes in thinking, reasoning, language and problem-solving across life.','Use age-appropriate evidence and consider individual and cultural variation rather than assuming identical development.','A young child may gradually use more complex reasoning as experience and language develop.'],
  ['Adolescent development','Adolescent development involves interacting biological, cognitive, social and emotional changes.','Avoid single-cause explanations and consider how context, relationships and individual differences shape development.','Peer relationships can influence identity and decision-making during adolescence.'],
  ['Social influence and conformity','Social influence occurs when the presence or expectations of others affect behaviour or attitudes.','Distinguish conformity, compliance and obedience and identify the social context.','A person may change an answer to match a group even when initially unsure.'],
  ['Group behaviour','Group processes can affect identity, decision-making, cooperation and conflict.','Consider group norms, roles, status and shared goals when interpreting behaviour.','A clearly shared task can improve coordination in a team.'],
  ['Personality and individual differences','Personality research investigates patterns in thinking, feeling and behaviour while recognising variation across situations.','Evaluate how a theory or measure defines traits and whether its findings generalise.','A personality questionnaire provides an estimate, not a complete description of a person.'],
  ['Stress and coping','Stress involves responses to demands perceived as challenging or threatening. Coping strategies vary by person and situation.','Distinguish stressors, responses and coping methods and use evidence rather than assumptions.','Planning and seeking support may help someone manage a demanding assessment period.'],
  ['Wellbeing and protective factors','Wellbeing is influenced by interacting personal, social and environmental factors.','Consider protective factors and support systems while avoiding one-size-fits-all conclusions.','Supportive relationships can contribute to resilience during periods of change.'],
  ['Psychological disorders and classification','Classification systems provide shared criteria for describing patterns of symptoms, but assessment requires context and professional judgement.','Distinguish a symptom from a diagnosis and consider duration, impact and professional assessment.','One isolated behaviour is not enough to establish a psychological disorder.'],
  ['Evaluating psychological claims','Psychological claims should be assessed using the study design, evidence quality, sample and limitations.','Check whether the conclusion matches the data and whether alternative explanations have been considered.','A small self-selected survey cannot establish what an entire population believes.']
 ]

function juniorBankKey(course,subject){
 const t=`${course.title} ${course.description}`.toLowerCase();
 if(subject==='math'){
  if(/statistic|probab|data/.test(t))return 'stats';
  if(/geometry|trigon|pythag|measurement|space|transform/.test(t))return 'geometry';
  if(/algebra|linear|quadratic|function|equation|relationship/.test(t))return 'algebra';
  return 'number';
 }
 if(/classification|biodiversity|ecosystem|cells|living|body|genetic|inheritance|evolution/.test(t))return 'biology';
 if(/earth|climate|tectonic|moon|space|sun/.test(t))return 'earth';
 if(/chemical|particle|mixture|atom|reaction/.test(t))return 'chemistry';
 return 'physics';
}
function lessonFromBank(entry,subject,year,courseTitle){
 const [title,idea,teachingMethod,workedExample]=entry;
 const method=teachingMethod || (subject==='math'
  ? `Identify the values and units, choose a suitable rule, show each step and check that the result makes sense in the context.`
  : `Identify the system or process, use relevant observations or data, and connect the evidence to a scientific explanation.`);
 const example=workedExample || (subject==='math'?'Use a small example to check the method before applying it to a longer problem.':'Use an observation from the investigation and explain what it suggests about the system.');
 return L(title,idea,method,example,[title,'Apply the idea to a new example']);
}
function generatedLessonQuestions(lesson,subject,index){
 const title=lesson.title.toLowerCase(),idea=lesson.steps[0].body,method=lesson.steps[1].body,example=lesson.steps[2].body;
 const wrong=subject==='math'
  ? ['Choose an operation before checking what the quantities represent.','Change only one side of an equation and leave the other side untouched.','Ignore the units and accept the first numerical result.']
  : ['Make a conclusion before checking the observations or data.','Change several variables at once, then assume the cause is clear.','Treat one result as proof that the same outcome must happen in every setting.'];
 const make=(prompt,correct,offset,type='mcq',expected='')=>{
  const answer=(index+offset)%4,options=[],distractors=[...wrong];let wi=0;
  for(let i=0;i<4;i++)options.push(i===answer?correct:distractors[wi++]);
  const q=Q(prompt,options,answer,`${correct} Example: ${example}`,2);
  q.lessonTitle=lesson.title;
  if(type!=='mcq'){q.type=type;q.expected=expected||correct;}
  return q;
 };
 const mathWorking=()=>{
  if(subject!=='math') return null;
  let q=null;
  if(/linear|equation|algebra|rearrang|expression|simultaneous/.test(title)){
   const a=3+(index%4), b=5+(index%6), x=2+(index%3), c=a*x+b;
   q=make(`Solve ${a}x + ${b} = ${c}. Show every algebraic step.`,`${x}`,2,'working',`${x}`);
   q.explanation=`Subtract ${b} from both sides, then divide by ${a}: x = ${x}.`;
  }else if(/quadratic|polynomial|factor/.test(title)){
   const a=2+(index%3), r1=2+(index%3), r2=4+(index%2), b=-(r1+r2)*a, c=r1*r2*a;
   q=make(`Solve ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x + ${c} = 0 by factorising. Show your working.`,`${r1} and ${r2}`,2,'working',`${r1} and ${r2}`);
   q.explanation=`The equation factorises to ${a}(x − ${r1})(x − ${r2}) = 0, so x = ${r1} or x = ${r2}.`;
  }else if(/gradient|slope|straight line|linear function/.test(title)){
   const x1=1+(index%3), y1=2+(index%4), x2=x1+2, y2=y1+6;
   q=make(`Find the gradient of the line through (${x1}, ${y1}) and (${x2}, ${y2}). Show rise over run.`,`3`,2,'working','3');
   q.explanation=`Gradient = (${y2} − ${y1}) ÷ (${x2} − ${x1}) = 6 ÷ 2 = 3.`;
  }else if(/trig|triangle|pythag|hypotenuse/.test(title)){
   const a=3+(index%3), b=4, c=Math.sqrt(a*a+b*b);
   if(Number.isInteger(c)){
    q=make(`A right triangle has legs ${a} cm and ${b} cm. Find the hypotenuse. Show your Pythagoras working.`,`${c} cm`,2,'working',`${c}`);
    q.explanation=`c² = ${a}² + ${b}² = ${a*a+b*b}, so c = ${c} cm.`;
   }
  }else if(/percentage|percent|finance|interest|discount|rate|ratio|fraction|decimal/.test(title)){
   const original=80+(index%5)*20, pct=10+(index%4)*5, answer=original*(pct/100), final=original-answer;
   q=make(`An item costs $${original}. It is discounted by ${pct}%. Calculate the discount and final price. Show your working.`,`$${final.toFixed(2)}`,2,'working',`${final.toFixed(2)}`);
   q.explanation=`${pct}% of $${original} is $${answer.toFixed(2)}, so the final price is $${final.toFixed(2)}.`;
  }else if(/probability|chance/.test(title)){
   const favourable=2+(index%3), total=6+(index%4)*2;
   q=make(`A fair experiment has ${total} equally likely outcomes, ${favourable} of which are favourable. Find the probability and simplify it. Show your working.`,`${favourable}/${total}`,2,'working',`${favourable}/${total}`);
   q.explanation=`Probability = favourable outcomes ÷ total outcomes = ${favourable}/${total}.`;
  }else if(/area|volume|measurement|perimeter|circumference/.test(title)){
   const length=4+(index%4), width=3+(index%3), area=length*width;
   q=make(`A rectangle is ${length} m long and ${width} m wide. Calculate its area and show your working.`,`${area} m²`,2,'working',`${area}`);
   q.explanation=`Area = length × width = ${length} × ${width} = ${area} m².`;
  }else if(/indices|index|exponent|power/.test(title)){
   const a=2+(index%3), m=2+(index%3), n=1+(index%2), answer=Math.pow(a,m+n);
   q=make(`Simplify ${a}^${m} × ${a}^${n}. Give the numerical value and show the index-law steps.`,`${answer}`,2,'working',`${answer}`);
   q.explanation=`Use aᵐ × aⁿ = aᵐ⁺ⁿ, so ${a}^${m} × ${a}^${n} = ${a}^${m+n} = ${answer}.`;
  }else if(/function|substitut|domain|range/.test(title)){
   const x=2+(index%4), answer=2*x*x-3*x+4;
   q=make(`For f(x) = 2x² − 3x + 4, calculate f(${x}). Show your substitution and working.`,`${answer}`,2,'working',`${answer}`);
   q.explanation=`f(${x}) = 2(${x})² − 3(${x}) + 4 = ${answer}.`;
  }else if(/calculus|derivative|differenti/.test(title)){
   const x=2+(index%3), answer=2*x;
   q=make(`For f(x) = x², calculate f′(${x}). Show the differentiation and substitution steps.`,`${answer}`,2,'working',`${answer}`);
   q.explanation=`f′(x) = 2x, so f′(${x}) = ${answer}.`;
  }else if(/matrix/.test(title)){
   const x=2+(index%3), y=1+(index%3), answer=`${x}, ${y}`;
   q=make(`A transformation leaves the point (${x}, ${y}) unchanged. Write the coordinates after the transformation and explain the calculation.`,`(${answer})`,2,'working',answer);
   q.explanation=`Because the point is unchanged, its coordinates remain (${x}, ${y}).`;
  }else if(/vector/.test(title)){
   const a=2+(index%3), b=3+(index%2), answer=a+b;
   q=make(`Given vectors u = (${a}, 0) and v = (0, ${b}), find u + v. Show your component working.`,`(${a}, ${b})`,2,'working',`${a}, ${b}`);
   q.explanation=`Add corresponding components: (${a}+0, 0+${b}) = (${a}, ${b}).`;
  }else{
   const a=4+(index%4), b=3+(index%3), answer=a+b;
   q=make(`A calculation gives ${a} + ${b}. Work through the arithmetic and write the result with a clear working line.`,`${answer}`,2,'working',`${answer}`);
   q.explanation=`Add the two quantities: ${a} + ${b} = ${answer}.`;
  }
  return q;
 };
 const working=mathWorking();
 const base=[
  make(`Which statement best describes ${title}?`,idea,0),
  make(`A student is applying ${title} to a new problem. What is a sensible first step? Explain briefly.`,method,1,'short',method),
  subject==='math'
   ? (working||make(`A worked example for ${title} is: ${example} Show the main steps you would use to solve a similar question.`,example,2,'working',example))
   : make(`Use this example from ${title}: ${example} Write a short explanation linking it to the main scientific idea.`,example,2,'paragraph',idea)
 ];
 if(subject==='math'){
  const second=mathWorking();
  if(second){second.question=second.question.replace(/^Solve /,'Now solve ').replace(/^A right triangle/,'Now solve: A right triangle');base.push(second);}
 }
 return base;
}
function expandedJuniorCourse(course,subject,year){
 const key=juniorBankKey(course,subject);
 const bank=[...(JUNIOR_LESSON_BANKS[subject]?.[key]||[]),...(JUNIOR_EXTRA_LESSON_BANKS[subject]?.[key]||[])];
 const additions=bank.map(entry=>lessonFromBank(entry,subject,year,course.title));
 const generated=additions.flatMap((lesson,i)=>generatedLessonQuestions(lesson,subject,i));
 return {...course,lessons:[...course.lessons,...additions],questions:[...course.questions,...generated]};
}
function expandedSeniorCourse(course,subject,year,pathway){
 const bank=[...(SENIOR_LESSON_BANKS[pathway]||[]),...(SENIOR_EXTRA_LESSON_BANKS[pathway]||[])];
 const additions=bank.map(entry=>lessonFromBank(entry,subject,year,course.title));
 const generated=additions.flatMap((lesson,i)=>generatedLessonQuestions(lesson,subject,i));
 return {...course,lessons:[...course.lessons,...additions],questions:[...course.questions,...generated]};
}

function normaliseRun(value){
 if(!value||typeof value!=='object'||!['math','science'].includes(value.subject))return null;
 const year=Number(value.year);if(![7,8,9,10,11,12].includes(year))return null;
 if(year>=11&&!(SENIOR_PATHS[value.subject]||[]).some(p=>p.id===value.pathway))return null;
 return {...value,year,completedLessons:Array.isArray(value.completedLessons)?value.completedLessons.filter(x=>typeof x==='string'):[],passedCourses:Array.isArray(value.passedCourses)?value.passedCourses.filter(x=>typeof x==='string'):[],passedAssessments:Array.isArray(value.passedAssessments)?value.passedAssessments.filter(x=>typeof x==='string'):[],finalsPassed:Array.isArray(value.finalsPassed)?value.finalsPassed.filter(x=>typeof x==='string'):[],pathwayCompleted:!!value.pathwayCompleted,iq:Number.isFinite(Number(value.iq))?Math.max(0,Math.floor(Number(value.iq))):0,bestScores:value.bestScores&&typeof value.bestScores==='object'?value.bestScores:{},quizRewards:value.quizRewards&&typeof value.quizRewards==='object'?value.quizRewards:{},totalCorrect:Math.max(0,Number(value.totalCorrect)||0),totalQuestions:Math.max(0,Number(value.totalQuestions)||0),examsPassed:Math.max(0,Number(value.examsPassed)||0),createdAt:value.createdAt||new Date().toISOString()};
}

function loadProfile(){
 const base=defaultProfile();
 try{
  const raw=localStorage.getItem(SAVE_KEY);if(!raw)return base;
  const stored=JSON.parse(raw);if(!stored||typeof stored!=='object'||Array.isArray(stored))return base;
  const profile={...base,...stored,version:5};
  const validIds=new Set(COSMETICS.map(c=>c.id));
  profile.owned=Array.from(new Set([...base.owned,...(Array.isArray(stored.owned)?stored.owned.filter(id=>validIds.has(id)):[])]));
  profile.equipped={...base.equipped,...(stored.equipped&&typeof stored.equipped==='object'?stored.equipped:{})};
  for(const [slot,id] of Object.entries(profile.equipped)){
   const item=COSMETICS.find(c=>c.id===id&&c.slot===slot);
   if(!item||!profile.owned.includes(id))profile.equipped[slot]=base.equipped[slot]||'';
  }
  profile.achievements=stored.achievements&&typeof stored.achievements==='object'?stored.achievements:{};
  profile.completedPathways=Array.isArray(stored.completedPathways)?stored.completedPathways.filter(x=>x&&typeof x.key==='string'):[];
  profile.lastCompletedPathway=stored.lastCompletedPathway&&typeof stored.lastCompletedPathway==='object'?stored.lastCompletedPathway:null;
  profile.history=Array.isArray(stored.history)?stored.history.filter(h=>h&&typeof h==='object').slice(0,100):[];
  profile.customFlashcards=Array.isArray(stored.customFlashcards)?stored.customFlashcards.filter(c=>c&&typeof c.front==='string'&&typeof c.back==='string').slice(0,500):[];
  profile.currentRun=normaliseRun(stored.currentRun);
  return profile;
 }catch(e){console.warn('Vise save could not be read',e);return base;}
}

function inferMathTool(q){if(q.toolId)return q.toolId;const text=`${q.question||''} ${q.explanation||''} ${q.expected||''}`.toLowerCase();if(/pythagor|hypotenuse|right[- ]angled triangle|right triangle/.test(text))return 'pythagoras';if(/quadratic|x²|x\^2|discriminant/.test(text))return 'quadratic';if(/\b(sin|cos|tan)\b|trigonomet|angle of elevation|angle of depression/.test(text))return 'trig';if(/index law|indices|exponent|\braised to\b|power of/.test(text))return 'indices';if(/circumference|diameter|radius|\bcircle\b|π|\bpi\b/.test(text))return 'circle';if(/\bspeed\b|\bvelocity\b|distance.{0,35}time|time.{0,35}distance/.test(text))return 'speed';if(/percentage|percent|discount|interest rate|percentage change/.test(text))return 'percent';if(/factoris|factoriz|expand|rearrang|simplif|\bequation\b|\bsolve\b|\bvariable\b|find x|\bx\s*=/.test(text))return 'algebra';return null;}

function toolForQuestion(q){if(run?.subject!=='math'||Number(q.difficulty||1)<3)return null;return q.toolId||null;}

function questionType(q,index){if(q.type)return q.type;if(run?.subject==='math')return index%5===1?'short':index%5===2?'working':index%5===4?'short':'mcq';return index%5===1?'short':index%5===2?'paragraph':index%5===4?'short':'mcq';}

function makeAssessmentQuestion(q,index){const type=questionType(q,index),expected=q.expected||q.options?.[q.answer]||'',toolId=run?.subject==='math'?inferMathTool({...q,expected}):null,difficulty=Math.max(Number(q.difficulty||1),toolId&&index%5===2?3:toolId&&index%5===4?4:1);const decorated={...q,type,expected,difficulty,toolId};return {...decorated,modelAnswer:q.explanation||'Review the related lesson for the method and key idea.'};}

function responseLooksCorrect(q,response){const text=String(response||'').trim().toLowerCase();if(!text)return false;const expected=String(q.expected||'').trim().toLowerCase();if(q.type==='short'){if(text===expected||text.includes(expected))return true;const words=expected.replace(/[^a-z0-9.%−-]+/g,' ').split(/\s+/).filter(w=>w.length>=4);return words.length?words.slice(0,2).every(w=>text.includes(w)):false;}if(q.type==='working'){const nums=expected.match(/-?\d+(?:\.\d+)?/g)||[];if(nums.some(n=>text.replace(/,/g,'').includes(n)))return text.length>=3;const words=expected.replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(w=>w.length>=4);return words.length?words.slice(0,2).every(w=>text.includes(w)):false;}if(q.type==='paragraph'){const source=`${expected} ${q.explanation||''}`.toLowerCase();const keywords=[...new Set(source.replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(w=>w.length>=5))].slice(0,8);return text.length>=80&&keywords.filter(w=>text.includes(w)).length>=2;}return false;}

function rankInfo(){
 const total=Math.max(1,getTotalLessons()),count=Math.min(run?.completedLessons?.length||0,total);
 const needFor=index=>index===0?0:Math.ceil(total*index/(RANKS.length-1));
 let index=0;for(let i=1;i<RANKS.length;i++){if(count>=needFor(i))index=i;}
 const current={...RANKS[index],need:needFor(index)},next=RANKS[index+1]?{...RANKS[index+1],need:needFor(index+1)}:null;
 const progress=next?Math.max(0,Math.min(100,((count-current.need)/(next.need-current.need))*100)):100;
 return {index,current,next,progress,count};
}

 </svg>`;

function brandLockup(subject='math',size=46,subline='Learn · practise · level up'){
 const wordmark=subject==='science'?`<span class="brand-title">Vise</span><small class="brand-terra">terra</small>`:`<span class="brand-title">Vise</span>`;
 return `<div class="brand-lockup">${brandMark(subject,size)}<div class="brand">${wordmark}${subline?`<small class="brand-context">${subline}</small>`:''}</div></div>`;
}

function toast(msg){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}

function subjectName(){return run?.subject==='science'?'Science':'Maths';}

function pathwayKey(subject,year,pathway=null){return year<=10?`${subject}:${year}`:`${subject}:${year}:${pathway}`;}
function pathwayIsComplete(subject,year,pathway=null){const key=pathwayKey(subject,year,pathway);return (profile?.completedPathways||[]).some(p=>p.key===key);}
function pathwayTitle(subject,year,pathway=null){if(year<=10)return `${subject==='math'?'Maths':'Science'} · Year ${year}`;const p=(SENIOR_PATHS[subject]||[]).find(x=>x.id===pathway);return `${p?.name||'Senior subject'} · Year ${year}`;}
function renderPathwayCard(subject,year,pathway=null,icon=null){const done=pathwayIsComplete(subject,year,pathway),title=pathwayTitle(subject,year,pathway),ico=icon||(subject==='math'?'🔷':'🔬'),pathCourses=getCourses({subject,year,pathway})||[],lessonCount=pathCourses.reduce((n,c)=>n+c.lessons.length,0);return `<article class="course-card ${done?'completed-path':''}"><div class="course-top"><span class="course-symbol">${ico}</span><span class="${done?'tag':'lock-chip'}">${done?'✓ Completed':'Available'}</span></div><h3>${esc(title)}</h3><p>${year<=10?`Year ${year} ${subject==='math'?'Mathematics':'Science'} pathway, organised as topic units with lessons and field finals.`:`${esc((SENIOR_PATHS[subject]||[]).find(x=>x.id===pathway)?.desc||'Senior subject pathway')}`}</p><div class="course-foot"><span>${done?'Finished':`${lessonCount} lessons · ${pathCourses.length} field finals`}</span><button class="${done?'secondary-btn':'primary-btn'} small-btn" data-action="portal-start" data-subject="${subject}" data-year="${year}" data-pathway="${pathway||''}" ${done?'disabled':''}>${done?'Completed':'Start pathway →'}</button></div></article>`;}
function renderPathwayMenu(){const completed=profile.completedPathways||[];return `<section class="screen center-screen portal-screen"><div class="onboard-card portal-card">${brandLockup('math',52,'YOUR STUDY HUB')}<div class="eyebrow" style="margin-top:28px">PATHWAY MENU</div><h1 class="onboard-title">Choose your next pathway</h1><p class="onboard-copy">Each pathway has a full lesson sequence, topic quizzes, practice exams and a final assessment for every course field. Completed pathways stay marked here.</p><div class="portal-summary"><strong>${completed.length} pathways completed</strong><span>${Math.max(0,28-completed.length)>0?`${Math.max(0,28-completed.length)} pathways still available`:'You have completed every listed pathway.'}</span></div><section class="portal-section"><div class="section-title"><div><h2>Junior pathways · Years 7–10</h2><p>Choose Maths or Science at your year level.</p></div></div><div class="card-grid">${[7,8,9,10].map(y=>renderPathwayCard('math',y,null,'🔷')).join('')}${[7,8,9,10].map(y=>renderPathwayCard('science',y,null,'🧪')).join('')}</div></section><section class="portal-section"><div class="section-title"><div><h2>Senior pathways · Year 11</h2><p>Pick the QCAA subject you are studying.</p></div></div><div class="card-grid">${SENIOR_PATHS.math.map(p=>renderPathwayCard('math',11,p.id,p.icon)).join('')}${SENIOR_PATHS.science.map(p=>renderPathwayCard('science',11,p.id,p.icon)).join('')}</div></section><section class="portal-section"><div class="section-title"><div><h2>Senior pathways · Year 12</h2><p>Continue with another senior subject pathway.</p></div></div><div class="card-grid">${SENIOR_PATHS.math.map(p=>renderPathwayCard('math',12,p.id,p.icon)).join('')}${SENIOR_PATHS.science.map(p=>renderPathwayCard('science',12,p.id,p.icon)).join('')}</div></section>${profile.lastCompletedPathway?`<div class="curriculum-note"><strong>Recently completed:</strong> ${esc(profile.lastCompletedPathway.title||'Pathway')} · ${new Date(profile.lastCompletedPathway.completedAt).toLocaleDateString()}</div>`:''}<p class="tiny muted" style="margin-top:18px">Your lesson progress, achievements, IQ points, flashcards and character collection remain saved in this browser.</p></div></section>`;}
function returnToPathwayMenu(){if(run){profile.history.unshift({id:run.id,subject:run.subject,year:run.year,pathway:run.pathway,createdAt:run.createdAt,endedAt:new Date().toISOString(),completedLessons:run.completedLessons.length,iq:run.iq,rank:rankInfo().current.name,examsPassed:run.examsPassed||0,finalsPassed:(run.finalsPassed||[]).length,pathwayCompleted:!!run.pathwayCompleted});}run=null;quiz=null;selectedCourse=null;selectedLesson=null;lessonSearch='';save();view='portal';render();}


function courseComplete(course){return course.lessons.every(l=>run.completedLessons.includes(`${course.id}:${slug(l.title)}`));}

function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

function lessonDone(course,lesson){return run.completedLessons.includes(`${course.id}:${slug(lesson.title)}`);}

function currentCourses(){return getCourses(run);}

function unlockedCourse(index){if(index===0)return true;const courses=currentCourses();return courseComplete(courses[index-1]);}

function getTotalLessons(){return currentCourses().reduce((n,c)=>n+c.lessons.length,0);}

function setView(next){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}view=next;render();}

function render(){applyTheme();const app=$('#app');if(view==='subject')app.innerHTML=renderSubject();else if(view==='year')app.innerHTML=renderYear();else if(view==='senior')app.innerHTML=renderSenior();else if(view==='portal')app.innerHTML=renderPathwayMenu();else if(view==='dashboard'){app.innerHTML=renderDashboard();}else if(view==='quiz')app.innerHTML=renderQuiz();else if(view==='result')app.innerHTML=renderResult();if(view==='quiz'&&quiz&&!quiz.answered)startTimer();}

function renderSubject(){return `<section class="screen center-screen"><div class="onboard-card">${brandLockup('math',56,'Learn · practise · level up')}<div class="eyebrow" style="margin-top:30px">Step 1 · Choose your subject</div><h1 class="onboard-title">What are you studying?</h1><p class="onboard-copy">Choose the learning world you want to enter.</p><div class="choice-grid"><button class="choice-card" data-action="choose-subject" data-subject="math"><span class="choice-icon">${brandMark('math',52)}</span><strong>Vise</strong><span>Maths<br>Problem solving, patterns and proofs.</span></button><button class="choice-card" data-action="choose-subject" data-subject="science"><span class="choice-icon">${brandMark('science',52)}</span><strong class="choice-brand">Vise<small>terra</small></strong><span>Science<br>Explore living systems, matter, energy and Earth.</span></button></div><p class="tiny muted" style="margin-top:20px">Your progress is saved in this browser. You can change subject by starting a new run.</p></div></section>`;}

function renderYear(){const name=brandName(pendingSubject);return `<section class="screen center-screen"><div class="onboard-card"><button class="back-btn" data-action="go-subject">← Back</button>${brandLockup(pendingSubject,48,'Learning pathway')}<div class="eyebrow" style="margin-top:26px">Step 2 · Choose your year level</div><h1 class="onboard-title">Which year are you in?</h1><p class="onboard-copy">We’ll organise the course material and challenge level around your year.</p><div class="year-grid">${[7,8,9,10,11,12].map(y=>`<button class="year-btn" data-action="choose-year" data-year="${y}">Year ${y}${y>=11?'<small style="display:block;font-size:10px;color:var(--muted);margin-top:4px">Senior</small>':''}</button>`).join('')}</div><p class="tiny muted" style="margin-top:18px">Years 7–10 use Queensland’s Australian Curriculum v9.0. Years 11–12 are organised by senior subject.</p></div></section>`;}
function renderSenior(){const paths=SENIOR_PATHS[pendingSubject]||[];const area=pendingSubject==='math'?'Mathematics':'Sciences';return `<section class="screen center-screen"><div class="onboard-card"><button class="back-btn" data-action="back-year">← Back</button>${brandLockup(pendingSubject,48,`Year ${pendingYear} senior pathway`)}<div class="eyebrow" style="margin-top:26px">Step 3 · Choose your senior subject</div><h1 class="onboard-title">Which subject are you taking?</h1><p class="onboard-copy">Choose the ${area.toLowerCase()} subject you are studying. Each field has its own lesson sequence, practice and final assessment.</p><div class="senior-selection-label"><strong>${area}</strong><span>Queensland senior subjects · ${pendingYear}</span></div><div class="senior-grid">${paths.map(p=>`<button class="senior-btn" data-action="choose-pathway" data-pathway="${p.id}"><span class="ico">${p.icon}</span><span><strong>${esc(p.name)}</strong><small><b>${esc(p.type||'Senior subject')}</b> · ${esc(p.units||'Units 1–4')}<br>${esc(p.desc)}</small></span></button>`).join('')}</div><div class="curriculum-note" style="margin-top:18px"><strong>QCAA pathway:</strong> ${pendingYear===11?'Units 1–2 are the foundation for Units 3–4.':'Units 3–4 consolidate the senior course and are studied as a pair in General syllabuses.'} ${pendingSubject==='math'&&paths.some(p=>p.id==='specialist')?' Specialist Mathematics requires Mathematical Methods alongside or beforehand.':''}</div><p class="tiny muted" style="margin-top:12px">Your school may offer a different selection of senior subjects.</p></div></section>`;}
function renderHeader(){const rank=rankInfo();const wordmark=run.subject==='science'?`<div class="top-brand-wordmark">Vise<small class="top-brand-terra">terra</small></div>`:'Vise';return `<header class="topbar"><div class="top-brand-wrap">${brandMark(run.subject,42)}<div class="top-brand">${wordmark}<span class="top-brand-meta">${subjectName()} · Year ${run.year}${run.pathway?` · ${esc(SENIOR_PATHS[run.subject].find(p=>p.id===run.pathway)?.name||'')}`:''}</span></div></div><div class="top-right"><span class="pill">🧠 ${run.iq} IQ</span><span class="pill">🏅 ${rank.current.name}</span><div class="avatar-mini">${avatarMarkup('mini')}</div></div></header>`;}

function renderLearn(){const courses=currentCourses();const total=courses.reduce((n,c)=>n+c.lessons.length,0);return `<div class="page-head"><div><div class="eyebrow">LESSON LIBRARY</div><h1>Learn the ideas</h1><p>Each topic has a short explanation, a way to apply it and an example. Pick a course, or use the lesson search to jump straight to a topic.</p></div><span class="tag">${total} lessons</span></div><div class="teach-grid"><div>${courses.map((c,ci)=>`<section class="panel" style="margin-bottom:14px"><div class="section-title" style="margin-top:0"><div><span class="tag">${c.icon} Unit ${ci+1}</span><h2 style="margin-top:8px">${esc(c.title)}</h2><p>${esc(c.description)}</p></div><button class="text-btn" data-action="open-course" data-course="${c.id}">Open unit →</button></div>${c.lessons.map((l,li)=>`<article class="teach-card" style="margin-top:11px"><div class="eyebrow">LESSON ${li+1}</div><h2>${esc(l.title)}</h2>${l.steps.map((step,si)=>`<div class="teach-section"><h3>${esc(step.title)}</h3>${si===2?`<div class="example-box">${esc(step.body)}</div>`:`<p>${esc(step.body)}</p>`}</div>`).join('')}${l.takeaways?.length?`<div class="teach-section"><h3>Key points</h3>${l.takeaways.map(t=>`<span class="key-point">${esc(t)}</span>`).join('')}</div>`:''}<div style="margin-top:15px"><button class="primary-btn small-btn" data-action="open-lesson" data-course="${c.id}" data-lesson="${slug(l.title)}">Open lesson →</button></div></article>`).join('')}</section>`).join('')}</div><aside><div class="panel"><div class="eyebrow">A GOOD ROUTINE</div><h2 style="margin:7px 0">Read, try, check</h2><p class="muted" style="line-height:1.6;font-size:13px">Work through a lesson, then try its check or a topic quiz. When something feels shaky, search for that topic and revisit just that part.</p></div><div class="panel" style="margin-top:14px"><strong>For written answers</strong><p class="muted" style="font-size:13px;line-height:1.55">Maths: show each step and include units. Science: use function renderAchievements(){const earned=ACHIEVEMENTS.filter(a=>achievementEarned(a.id)).length;return `<div class="page-head"><div><div class="eyebrow">PROFILE PROGRESSION</div><h1>Achievements</h1><p>Complete challenges to earn badges and exclusive character cosmetics.</p></div><span class="pill">🏆 ${earned}/${ACHIEVEMENTS.length}</span></div><div class="ach-grid">${ACHIEVEMENTS.map(a=>{const done=achievementEarned(a.id),item=COSMETICS.find(c=>c.id===a.reward);return `<article class="achievement ${done?'':'locked'}"><div class="achievement-icon">${done?a.icon:'🔒'}</div><div><strong>${esc(a.name)}</strong><small>${esc(a.desc)}</small><span class="reward">${done?'✓ Unlocked · ':''}${item?esc(item.name):'Achievement reward'}</span></div></article>`;}).join('')}</div>`;}

function renderTools(){if(run.subject!=='math')return `<div class="page-head"><div><div class="eyebrow">STUDY TOOLS</div><h1>Science toolkit</h1><p>Vise: Terra uses evidence checklists and terminology prompts rather than a maths formula drawer.</p></div></div><div class="tool-grid"><div class="tool-card"><div class="achievement-icon">🔬</div><h3>Evidence checklist</h3><p>Identify the observation, evidence, explanation and limitation before writing a conclusion.</p></div><div class="tool-card"><div class="achievement-icon">🧪</div><h3>Scientific vocabulary</h3><p>Define key terms, use them accurately, and connect them to the evidence in the question.</p></div></div>`;return `<div class="page-head"><div><div class="eyebrow">VISE TOOLKIT</div><h1>Maths tools</h1><p>Harder Maths questions require the relevant tool to be opened before you can submit.</p></div><span class="tag">🧰 ${MATH_TOOLS.length} tools</span></div><div class="tool-grid">${MATH_TOOLS.map(t=>`<article class="tool-card"><div class="achievement-icon">${t.icon}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><div class="formula">${esc(t.formula)}</div></article>`).join('')}</div>`;}

function renderHome(){const courses=currentCourses(),rank=rankInfo(),done=run.completedLessons.length,total=getTotalLessons(),pct=total?Math.round(done/total*100):0;const nextCourse=courses.find((c,i)=>unlockedCourse(i)&&!courseComplete(c));const finals=run.finalsPassed||[];return `<div class="page-head"><div><div class="eyebrow">YOUR LEARNING DASHBOARD</div><h1>Welcome back.</h1><p>Pick up where you left off, or jump to a topic you want to work on.</p></div><button class="secondary-btn" data-action="change-path">Choose another pathway</button></div><div class="stat-row"><div class="stat-card"><span>IQ Points</span><strong>🧠 ${run.iq}</strong><em>Earned from passed assessments</em></div><div class="stat-card"><span>Current rank</span><strong>🏅 ${rank.current.name}</strong><em>${rank.count} lessons completed</em></div><div class="stat-card"><span>Learning progress</span><strong>${pct}%</strong><em>${done} of ${total} lessons</em></div><div class="stat-card"><span>Field finals passed</span><strong>${finals.length}/${courses.length}</strong><em>Complete every field final to finish</em></div></div><section class="hero"><div><div class="eyebrow" style="color:#fff">${run.subject==='science'?'VISE: TERRA · SCIENCE':'VISE · MATHS'}</div><h2>${run.pathwayCompleted?'All field finals passed!':nextCourse?`Next up: ${esc(nextCourse.title)}`:'Ready for your field finals?'}</h2><p>${run.pathwayCompleted?'Return to the pathway menu to choose another course.':nextCourse?esc(nextCourse.description):'Your lessons are complete. Pass the final assessment for every course field to mark this pathway as completed.'}</p></div><button class="primary-btn" data-action="${run.pathwayCompleted?'return-menu':nextCourse?'open-course':'tab'}" ${nextCourse?`data-course="${nextCourse.id}"`:'data-tab="exams"'}>${run.pathwayCompleted?'Main menu':nextCourse?'Continue learning':'View field finals'} →</button></section><div class="two-col"><div><div class="section-title"><div><h2>Your courses</h2><p>All course lessons are available in the Lessons tab search.</p></div><button class="text-btn" data-action="tab" data-tab="lessons">See all</button></div><div class="card-grid">${courses.slice(0,4).map((c,i)=>renderCourseCard(c,i)).join('')}</div></div><div><div class="rank-box"><div class="eyebrow" style="color:#bcd4ff">RANK PROGRESSION</div><h3>${rank.current.name}</h3><p>${rank.next?`${rank.next.need-rank.count} more lesson${rank.next.need-rank.count===1?'':'s'} to reach ${rank.next.name}.`:'Highest rank reached. Brilliant work.'}</p><div class="rank-track"><span style="width:${rank.progress}%"></span></div><div class="rank-meta"><span>${rank.count} completed</span><span>${rank.next?rank.next.need+' next':'MAX RANK'}</span></div></div><div class="panel" style="margin-top:14px"><div class="section-title" style="margin:0 0 8px"><h2>Quick actions</h2></div><div class="feature-list"><div class="feature-row"><span class="ficon">⏱️</span><div><strong>Practice exams</strong><small>Topic quizzes, course tests and field finals</small></div><button class="text-btn" data-action="tab" data-tab="exams">Go</button></div><div class="feature-row"><span class="ficon">🃏</span><div><strong>Flashcards</strong><small>Four cards for every lesson</small></div><button class="text-btn" data-action="tab" data-tab="cards">Go</button></div><div class="feature-row"><span class="ficon">🎨</span><div><strong>Character wardrobe</strong><small>Wear shirts, hats, trousers and shoes</small></div><button class="text-btn" data-action="tab" data-tab="customize">Go</button></div></div></div></div></div><div class="curriculum-note"><strong>Curriculum note:</strong> Junior lessons are organised around Queensland’s Australian Curriculum v9.0 learning areas. Senior field lessons are introductory study materials, not a replacement for a school’s full QCAA course sequence. These are independent Vise practice resources, not official QCAA assessment papers. <a href="https://www.qcaa.qld.edu.au/p-10/aciq/version-9/learning-areas/p-10-mathematics" target="_blank" rel="noopener">QCAA Maths</a> · <a href="https://www.qcaa.qld.edu.au/p-10/aciq/version-9/learning-areas/p-10-science" target="_blank" rel="noopener">QCAA Science</a> · <a href="https://www.qcaa.qld.edu.au/senior/senior-subjects/syllabuses" target="_blank" rel="noopener">Senior syllabuses</a></div>`;}
function renderCourseCard(c,i,browse=false){const done=c.lessons.filter(l=>lessonDone(c,l)).length,pct=Math.round(done/c.lessons.length*100),locked=!browse&&!unlockedCourse(i);return `<article class="course-card ${locked?'locked':''}"><div class="course-top"><span class="course-symbol">${c.icon}</span>${locked?'<span class="lock-chip">🔒 Locked</span>':`<span class="tag">${courseComplete(c)?'✓ Complete':`${done}/${c.lessons.length} lessons`}</span>`}</div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="course-foot"><span>${pct}% complete</span>${locked?'<span>Finish the course above</span>':`<button class="text-btn small-btn" data-action="open-course" data-course="${c.id}">${browse?'Browse lessons':'Open'} →</button>`}</div></article>`;}
function renderLessonSearchBox(){return `<div class="lesson-search-box"><label for="lessonSearch">Find a lesson</label><input id="lessonSearch" type="search" value="${esc(lessonSearch)}" placeholder="Search topics, e.g. gradient, cells, probability…" autocomplete="off"><small>Search every course in this pathway. You can still follow the course order, or open any result straight away.</small><div id="lessonSearchResults" class="lesson-search-results ${lessonSearch.trim()?'':'hidden'}">${renderLessonSearchResults(lessonSearch)}</div></div>`;}
function renderLessonSearchResults(query){const q=String(query||'').trim().toLowerCase();if(!q)return '';const matches=currentCourses().flatMap(c=>c.lessons.map((l,i)=>({c,l,i}))).filter(x=>`${x.l.title} ${x.c.title} ${x.l.steps.map(st=>st.body).join(' ')}`.toLowerCase().includes(q)).slice(0,60);if(!matches.length)return '<div class="empty">No lessons match that search. Try a broader topic or a different spelling.</div>';return matches.map(x=>`<div class="lesson-search-result"><div class="lesson-number">${lessonDone(x.c,x.l)?'✓':x.i+1}</div><div><strong>${esc(x.l.title)}</strong><small>${esc(x.c.title)} · ${lessonDone(x.c,x.l)?'Completed':'Not completed yet'}</small></div><span class="push"></span><button class="primary-btn small-btn" data-action="open-lesson" data-course="${x.c.id}" data-lesson="${slug(x.l.title)}">Open →</button></div>`).join('');}

 return `<div class="page-head"><div><div class="eyebrow">PART 1 · LEARN BIT BY BIT</div><h1>Lessons</h1><p>Browse by course or search the whole pathway and jump directly to the topic you need.</p></div><span class="pill">${run.completedLessons.length} / ${getTotalLessons()} lessons completed</span></div>${renderLessonSearchBox()}<div id="lessonCourseGrid" class="card-grid ${lessonSearch.trim()?'hidden':''}">${courses.map((c,i)=>renderCourseCard(c,i,true)).join('')}</div>`;}

function startQuiz(mode,questions,minutes,label,targetCourse=null,requestedCount=null){
 if(timerHandle){clearInterval(timerHandle);timerHandle=null;}
 const decorated=questions.map((q,i)=>makeAssessmentQuestion(q,i));
 const defaults={final:24,exam:22,course:18,topic:12,lesson:3,pop:12};
 const requested=Number(requestedCount)||defaults[mode]||12;
 const count=Math.min(Math.max(1,requested),decorated.length);
 const picked=shuffle(decorated).slice(0,count);
 if(!picked.length){toast('There are no questions in this topic yet.');return;}
 const timed=['exam','course','final'].includes(mode);
 quiz={mode,label,questions:picked,index:0,score:0,answered:false,correct:false,answer:null,selected:null,response:'',timed,endsAt:timed?Date.now()+minutes*60*1000:null,timeLeft:timed?minutes*60:null,targetCourse,expired:false,toolsViewed:{}};
 view='quiz';render();
}
function startTimer(){if(timerHandle||!quiz||!quiz.timed||quiz.answered)return;timerHandle=setInterval(()=>{if(!quiz||view!=='quiz'){clearInterval(timerHandle);timerHandle=null;return;}const left=Math.max(0,Math.ceil((quiz.endsAt-Date.now())/1000));const el=$('#timerValue');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(timerHandle);timerHandle=null;quiz.expired=true;finishQuiz(true);}},500);}

function renderQuiz(){if(!quiz)return '';const q=quiz.questions[quiz.index],type=q.type||'mcq',progress=Math.round((quiz.index/quiz.questions.length)*100),left=quiz.timed?Math.max(0,quiz.endsAt-Date.now()):0;const timer=quiz.timed?`<div class="timer">⏱ <span id="timerValue">${Math.floor(left/60000)}:${String(Math.floor((left/1000)%60)).padStart(2,'0')}</span></div>`:`<div class="timer">∞ <span>No timer</span></div>`;const tool=toolForQuestion(q),toolViewed=tool?quiz.toolsViewed?.[tool]:true;const typeLabel={mcq:'Multiple choice',short:'Short answer',working:'Show your working',paragraph:'TEEL-style response'}[type];const modeName={pop:'Mixed quiz',topic:'Topic quiz',exam:'Mixed timed exam',course:'Course practice exam',final:'Field final assessment',lesson:'Lesson check'}[quiz.mode]||'Practice';let body='';if(type==='mcq'){body=`<div class="answer-grid">${q.options.map((o,i)=>{const selected=quiz.selected===i;let cls='answer-btn';if(quiz.answered&&i===q.answer)cls+=' correct';else if(quiz.answered&&selected&&i!==q.answer)cls+=' wrong';else if(selected)cls+=' selected';return `<button class="${cls}" data-action="select-answer" data-index="${i}" ${quiz.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`;}).join('')}</div>`;}else{const placeholder=type==='working'?'Write each step of your calculation here…':type==='paragraph'?'Write a structured response. Use relevant terminology and explain how the evidence supports your point.':'Write a concise answer in your own words…';body=`<textarea id="freeResponse" class="response-box" ${quiz.answered?'disabled':''} placeholder="${placeholder}">${esc(quiz.response||'')}</textarea>`;}return `${renderHeader()}<div class="layout"><aside class="sidebar"><div class="nav-label">ASSESSMENT</div><div class="nav-btn active"><span class="nav-ico">📝</span>${esc(quiz.label)}</div>${tool?`<div class="required-tool"><strong>🧰 Required tool</strong><br>${esc(MATH_TOOLS.find(t=>t.id===tool)?.name||'Maths tool')}<br>${tool function answerQuestion(index,response){if(!quiz||quiz.answered)return;const q=quiz.questions[quiz.index];let correct=false;if(q.type==='mcq'){if(!Number.isInteger(index)||index<0||index>=q.options.length)return;quiz.answer=index;correct=index===q.answer;}else{quiz.answer=String(response||'').trim();correct=responseLooksCorrect(q,quiz.answer);}q.userResponse=q.type==='mcq'?q.options[quiz.answer]:quiz.answer;q.correct=correct;quiz.answered=true;quiz.correct=correct;if(correct)quiz.score++;render();}

function finishQuiz(expired=false){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}if(!quiz)return;quiz.expired=expired||quiz.expired;const total=quiz.questions.length,score=quiz.score,pct=total?Math.round(score/total*100):0,passed=pct>=70&&!quiz.expired;const rewardBase=20+Math.max(0,run.year-7)*5;const multiplier=quiz.mode==='final'?2.1:quiz.mode==='exam'?1.5:quiz.mode==='course'?1.15:quiz.mode==='topic'?.85:.65;const scope=quiz.targetCourse||questionScope(quiz.questions);const key=`${quiz.mode}:${scope}`;run.bestScores=run.bestScores||{};run.passedAssessments=run.passedAssessments||[];run.finalsPassed=run.finalsPassed||[];const best=Number(run.bestScores[key])||0;let award=0;if(passed){const raw=Math.round(rewardBase*multiplier*pct/100);award=best>=pct?0:Math.max(1,raw-Math.round(rewardBase*multiplier*best/100));run.bestScores[key]=Math.max(best,pct);run.iq+=award;if(!run.passedAssessments.includes(key)){run.passedAssessments.push(key);run.examsPassed=(run.examsPassed||0)+1;}}run.totalCorrect=(run.totalCorrect||0)+score;run.totalQuestions=(run.totalQuestions||0)+total;if(quiz.mode==='course'&&quiz.targetCourse&&passed&&!run.passedCourses.includes(quiz.targetCourse))run.passedCourses.push(quiz.targetCourse);if(quiz.mode==='final'&&quiz.targetCourse&&passed&&!run.finalsPassed.includes(quiz.targetCourse)){run.finalsPassed.push(quiz.targetCourse);const courses=currentCourses();if(courses.length&&courses.every(c=>run.finalsPassed.includes(c.id))){run.pathwayCompleted=true;const pkey=pathwayKey(run.subject,run.year,run.pathway);if(!profile.completedPathways.some(p=>p.key===pkey)){const entry={key:pkey,subject:run.subject,year:run.year,pathway:run.pathway,title:pathwayTitle(run.subject,run.year,run.pathway),completedAt:new Date().toISOString(),finalCount:courses.length};profile.completedPathways.push(entry);profile.lastCompletedPathway=entry;}}}quiz.result={score,total,pct,passed,award,expired:quiz.expired,mode:quiz.mode,label:quiz.label,targetCourse:quiz.targetCourse,finalsPassed:(run.finalsPassed||[]).length,finalsTotal:currentCourses().length,pathwayCompleted:!!run.pathwayCompleted,questions:quiz.questions.map(q=>({question:q.question,type:q.type,answer:q.type==='mcq'?q.options[q.answer]:q.expected||q.modelAnswer||'',userResponse:q.userResponse||'',model:q.modelAnswer,explanation:q.explanation,correct:q.correct}))};checkAchievements();save();view='result';render();if(quiz.result.pathwayCompleted){setTimeout(()=>{if(view==='result'&&quiz?.result?.pathwayCompleted)returnToPathwayMenu();},25000);}}
function renderResult(){if(!quiz?.result)return '';const r=quiz.result,misses=r.questions.filter(q=>!q.correct),improve=misses.slice(0,5);const finalStatus=r.mode==='final'?`<div class="improve"><strong>${r.pathwayCompleted?'🏁 Pathway completed':'Field finals'} </strong><p style="margin:7px 0 0">${r.pathwayCompleted?'You passed every field final in this pathway. Your results have been saved, and you’ll return to the pathway menu shortly.':`${r.finalsPassed}/${r.finalsTotal} field finals passed. ${r.passed?'This field is complete.':'You can retake this final after revising the topic.'}`}</p>${r.pathwayCompleted?`<button class="primary-btn" style="margin-top:12px" data-action="return-menu">Choose your next pathway →</button>`:''}</div>`:'';return `${renderHeader()}<div class="layout"><aside class="sidebar"><div class="nav-label">RESULTS</div><div class="nav-btn active">🏁 Feedback</div><button class="nav-btn" data-action="tab" data-tab="learn"><span class="nav-ico">🧑‍🏫</span>Review lessons</button><button class="nav-btn" data-action="tab" data-tab="exams"><span class="nav-ico">⏱️</span>Back to exams</button>${r.pathwayCompleted?`<button class="nav-btn" data-action="return-menu"><span class="nav-ico">⌂</span>Pathway menu</button>`:''}</aside><main class="main"><div class="result-wrap"><article class="result-card"><div class="score-hero"><div class="eyebrow">${r.passed?'ASSESSMENT PASSED':'ASSESSMENT COMPLETE'}</div><div style="font-size:52px;margin:10px">${r.passed?'🎉':'📘'}</div><h1>${r.passed?'Great work!':'Good effort — keep practising.'}</h1><div class="result-score">${r.pct}%</div><p class="muted">${r.score}/${r.total} correct.${r.expired?' The timer ran out.':''}</p>${r.passed?(r.award?`<div class="tag" style="font-size:15px;margin:9px">+${r.award} IQ Points 🧠</div>`:'<p class="muted">You have already earned the IQ reward for this score.</p>'):'<p class="muted">You need 70% to pass and earn IQ Points.</p>'}</div><div class="result-grid"><div class="mini-result"><strong>${r.total-r.score}</strong><small>Questions to review</small></div><div class="mini-result"><strong>${r.pct}%</strong><small>Score</small></div><div class="mini-result"><strong>${r.passed?'Pass':'Keep practising'}</strong><small>Status</small></div></div>${finalStatus}<div class="improve"><strong>🎯 What to improve</strong>${improve.length?`<ul class="improvement-list">${improve.map(q=>`<li><strong>${esc(q.type==='mcq'?'Knowledge check':q.type==='working'?'Working out':q.type==='paragraph'?'Written explanation':'Short answer')}:</strong> ${esc(q.question)}</li>`).join('')}</ul>`:'<p style="margin:7px 0 0">Nothing flagged. Keep practising so you can use the method without prompts.</p>'}</div><div class="answer-sheet"><div class="section-title" style="margin-top:20px"><div><h2>Answer sheet</h2><p>Compare your response with the model answer and explanation.</p></div></div>${r.questions.map((q,i)=>`<details ${i<2?'open':''}><summary>${i+1}. ${esc(q.question)} ${q.correct?'✓':'✗'}</summary><p><strong>Your response:</strong> ${esc(q.userResponse||'Not recorded')}</p><p><strong>Correct answer / model response:</strong> ${esc(q.answer)}</p>${q.model?`<p class="muted"><strong>Explanation:</strong> ${esc(q.model)}</p>`:''}</details>`).join('')}</div><div class="modal-actions" style="justify-content:center;margin-top:20px"><button class="primary-btn" data-action="tab" data-tab="learn">Review learning material</button>${r.pathwayCompleted?`<button class="secondary-btn" data-action="return-menu">Main menu</button>`:`<button class="secondary-btn" data-action="tab" data-tab="exams">Back to exams</button>`}</div></article></div></main></div>`;}

function builtInCards(){
 const list=[];
 currentCourses().forEach(c=>c.lessons.forEach(l=>{
  const [first,second,example]=l.steps;
  const takeaways=(l.takeaways||[]).slice(0,3).join(' · ');
  list.push({id:`${c.id}-${slug(l.title)}-idea`,front:`What does ${l.title} describe?`,back:first.body,custom:false,course:c.title});
  list.push({id:`${c.id}-${slug(l.title)}-method`,front:`How would you approach a question on ${l.title}?`,back:second.body,custom:false,course:c.title});
  list.push({id:`${c.id}-${slug(l.title)}-example`,front:`What example illustrates ${l.title}?`,back:example.body,custom:false,course:c.title});
  list.push({id:`${c.id}-${slug(l.title)}-recall`,front:`Name a key point to remember about ${l.title}.`,back:takeaways||first.body,custom:false,course:c.title});
 }));

}

function renderCustomize(){const current=profile.equipped;const slots=[['face','Face'],['head','Hats'],['outfit','T-shirts & tops'],['bottom','Trousers'],['shoes','Shoes'],['accessory','Accessories'],['aura','Aura'],['background','Scene']];const bg=COSMETICS.find(c=>c.id===current.background)?.emoji||'☁️';const bgColor=bg==='🌌'?'eee5ff':bg==='🌳'?'e8f5e8':bg==='🌅'?'fff0e8':'eaf2ff';const items=COSMETICS.filter(c=>cosmeticFilter==='all'||c.slot===cosmeticFilter);return `<div class="page-head"><div><div class="eyebrow">YOUR AVATAR</div><h1>Character studio</h1><p>Choose actual clothes and accessories for your character. New shirts, hats, trousers and shoes appear on the live preview.</p></div><span class="pill">🧠 ${run.iq} IQ available</span></div><div class="avatar-layout"><section class="avatar-preview"><div class="eyebrow">LIVE CHARACTER</div><div class="avatar-stage" style="background:linear-gradient(140deg,#fff,#${bgColor})"><div style="font-size:25px;height:27px">${COSMETICS.find(c=>c.id===current.aura)?.emoji||''}</div>${avatarMarkup('large')}<div style="font-size:13px;font-weight:900">Your ${brandName()} character</div><div class="avatar-outfit-caption">${esc(COSMETICS.find(c=>c.id===current.head)?.name||'No hat')} · ${esc(COSMETICS.find(c=>c.id===current.outfit)?.name||'T-shirt')} · ${esc(COSMETICS.find(c=>c.id===current.bottom)?.name||'Trousers')}</div></div><p class="muted tiny">Your equipped outfit is saved across visits and pathways.</p></section><section class="panel"><div class="section-title" style="margin-top:0"><div><h2>Wardrobe</h2><p>Filter by clothing slot, then equip or buy an item.</p></div></div><div class="form-field" style="max-width:260px;margin-bottom:16px"><label for="cosmeticFilter">Show wardrobe section</label><select id="cosmeticFilter"><option value="all" ${cosmeticFilter==='all'?'selected':''}>Everything</option>${slots.map(([slot,label])=>`<option value="${slot}" ${cosmeticFilter===slot?'selected':''}>${label}</option>`).join('')}</select></div><div class="cosmetic-grid">${items.map(c=>{const owned=profile.owned.includes(c.id),equipped=current[c.slot]===c.id;const required=c.rank?RANKS[c.rank]?.name||'Rank':'',achievement=ACHIEVEMENTS.find(a=>a.id===c.achievement);return `<div class="cosmetic"><div class="cosmetic-icon">${cosmeticPreview(c)}</div><strong>${esc(c.name)}</strong><small>${owned?'Owned':achievement?`Unlock: ${esc(achievement.name)}`:c.rank?`Unlock at rank ${required}`:`${c.price} IQ Points`}</small><button class="${equipped?'secondary-btn':owned?'primary-btn':'secondary-btn'} small-btn" data-action="${owned?'equip-cosmetic':'buy-cosmetic'}" data-id="${c.id}" ${equipped||(!owned&&achievement)?'disabled':''}>${equipped?'Wearing':owned?'Wear':achievement?'Locked':c.rank?'Locked':'Buy & wear'}</button></div>`;}).join('')}</div></section></div>`;}
function renderHistory(){return `<div class="page-head"><div><div class="eyebrow">SAVED RUNS</div><h1>Run history</h1><p>Your previous runs are archived here when you start a new one.</p></div><button class="primary-btn" data-action="new-run">＋ New run</button></div><div class="panel">${profile.history.length?profile.history.map(h=>`<div class="history-row"><div class="hist-icon">${h.subject==='science'?'🧪':'🔷'}</div><div><strong>${h.subject==='science'?'Vise: Terra':'Vise'} · Year ${h.year}${h.pathway?` · ${esc((SENIOR_PATHS[h.subject]||[]).find(p=>p.id===h.pathway)?.name||'')}`:''}</strong><small>Started ${new Date(h.createdAt).toLocaleDateString()} – archived ${new Date(h.endedAt).toLocaleDateString()} · ${h.completedLessons} lessons · ${h.examsPassed} assessments passed</small></div><b>${h.iq} IQ</b><span class="tag">${esc(h.rank)}</span></div>`).join(''):'<div class="empty"><strong>No previous runs yet.</strong>When you start a new run, your current run will be archived here.</div>'}</div><div class="curriculum-note">Starting a new run does not delete your run history, custom flashcards or cosmetics. It resets your current run’s lesson progress and IQ Points.</div>`;}

function renderResume(){return `<div class="modal-backdrop"><div class="modal">${brandLockup(run.subject,48,'')}<div class="eyebrow" style="margin-top:22px">WELCOME BACK</div><h2>Continue where you left off?</h2><p>You have a saved Year ${run.year} ${run.subject==='science'?'Science':'Maths'} run${run.pathway?` in ${esc(SENIOR_PATHS[run.subject].find(p=>p.id===run.pathway)?.name||'')}`:''}, with ${run.completedLessons.length} lessons completed and ${run.iq} IQ Points.</p><div class="modal-actions"><button class="primary-btn" data-action="continue-run">Continue run</button><button class="secondary-btn" data-action="new-run">Start a new run</button></div><p class="tiny" style="margin-top:15px">Your finished-run history and character collection are kept when you start again.</p></div></div>`;}

function modalConfirmNew(){return `<div class="modal-backdrop" id="confirmModal"><div class="modal"><h2>Start a new run?</h2><p>Your current progress and IQ total will be saved to Run History. The new run will start with fresh lesson progress and 0 IQ Points.</p><div class="modal-actions"><button class="secondary-btn" data-action="cancel-new">Keep current run</button><button class="primary-btn" data-action="confirm-new">Archive & start new</button></div></div></div>`;}

function showResume(){const modal=document.createElement('div');modal.innerHTML=renderResume();document.body.appendChild(modal.firstElementChild);}

function removeModal(){const m=$('.modal-backdrop');if(m)m.remove();}

/* =========================================================
   10 · USER ACTIONS, EVENT LISTENERS & APP STARTUP
   ========================================================= */
function action(el){const act=el.dataset.action;if(!act)return;
 switch(act){
  case'choose-subject':pendingSubject=el.dataset.subject;view='year';render();break;
  case'go-subject':pendingSubject=null;view='subject';render();break;
  case'choose-yeasr':pendingYear=Number(el.dataset.year);if(pendingYear>=11){view='senior';render();}else createRun(pendingSubject,pendingYear);break;
  case'back-year':view='year';render();break;
  case'choose-pathway':createRun(pendingSubject,pendingYear,el.dataset.pathway);break;
  case'portal-start':createRun(el.dataset.subject,Number(el.dataset.year),el.dataset.pathway||null);break;
  case'continue-run':removeModal();view='dashboard';activeTab='home';render();break;
  case'new-run':removeModal();document.body.insertAdjacentHTML('beforeend',modalConfirmNew());break;
  case'cancel-new':removeModal();break;
  case'confirm-new':removeModal();startNewRun();break;
  case'tab':selectedCourse=null;selectedLesson=null;activeTab=el.dataset.tab;setView('dashboard');break;
  case'return-menu':if(timerHandle){clearInterval(timerHandle);timerHandle=null;}returnToPathwayMenu();break;
  case'open-tool':{if(!quiz)break;quiz.toolsViewed=quiz.toolsViewed||{};quiz.toolsViewed[el.dataset.tool]=true;toast(`${MATH_TOOLS.find(t=>t.id===el.dataset.tool)?.name||'Tool'} opened.`);render();break;}
  case'select-answer':{if(!quiz||quiz.answered)return;quiz.selected=Number(el.dataset.index);render();break;}
  case'submit-answer':{if(!quiz||quiz.answered)break;const q=quiz.questions[quiz.index];if(q.type==='mcq'){if(quiz.selected==null){toast('Select an answer first.');break;}answerQuestion(quiz.selected,'');}else{const response=$('#freeResponse')?.value.trim()||'';if(!response){toast('Write your response before submitting.');break;}quiz.response=response;answerQuestion(null,response);}break;}
  case'change-path':document.body.insertAdjacentHTML('beforeend',modalConfirmNew());break;
  case'open-course':selectedCourse=el.dataset.course;selectedLesson=null;lessonStep=0;activeTab='lessons';setView('dashboard');break;
  case'open-lesson':if(el.dataset.course)selectedCourse=el.dataset.course;selectedLesson=el.dataset.lesson;lessonStep=0;activeTab='lessons';setView('dashboard');break;
  case'lesson-next':lessonStep=Math.min(2,lessonStep+1);render();break;
  case'lesson-back':if(lessonStep>0){lessonStep--;render();}else{selectedLesson=null;render();}break;
  case'complete-lesson':{const id=`${el.dataset.course}:${el.dataset.lesson}`;if(!run.completedLessons.includes(id)){run.completedLessons.push(id);applyRankUnlocks();checkAchievements();save();toast('Lesson completed! Your rank progress increased.');}selectedLesson=null;render();break;}
  case'scroll-course':activeTab='exams';render();break;
  case'lesson-check':{
   const c=currentCourses().find(x=>x.id===el.dataset.course);if(!c)break;
   const lesson=c.lessons.find(l=>slug(l.title)===el.dataset.lesson);
   const qs=lesson?c.questions.filter(q=>q.lessonTitle===lesson.title):[];
   startQuiz('lesson',qs.length?qs:c.questions,0,`${lesson?.title||c.title} check`,`${c.id}:${el.dataset.lesson||'unit'}`,Math.min(5,qs.length||c.questions.length));break;
  }
  case'start-pop':{const qs=allPathwayQuestions();startQuiz('pop',qs,0,'Mixed pathway quiz',`mixed-quiz:${questionScope(qs)}`,12);break;}
  case'start-revision':{
   const qs=eligibleQuestions();if(!qs.length){toast('Finish the lessons in at least one course to unlock mixed practice exams.');break;}
   const variant=el.dataset.variant||'A',count=Number(el.dataset.count)||22,minutes=Number(el.dataset.minutes)||20;
   startQuiz('exam',qs,minutes,`Mixed practice exam ${variant}`,`mixed-${variant}:${questionScope(qs)}`,count);break;
  }
  case'course-quiz':{
   const c=currentCourses().find(x=>x.id===el.dataset.course);if(!c)break;
   const variant=el.dataset.variant||'quick',count=variant==='challenge'?18:12;
   startQuiz('topic',c.questions,0,`${c.title} · ${variant==='challenge'?'challenge':'topic'} quiz`,`${c.id}:${variant}`,count);break;
  }
  case'course-exam':{
   const c=currentCourses().find(x=>x.id===el.dataset.course);if(!c)break;
   if(!courseComplete(c)){toast('Complete every lesson in this course to unlock its timed practice exams.');break;}
   const variant=el.dataset.variant||'A',count=variant==='B'?24:18,minutes=variant==='B'?24:18;
   startQuiz('course',c.questions,minutes,`${c.title} · practice exam ${variant}`,`${c.id}:${variant}`,count);break;
  }
  case'final-assessment':{
   const c=currentCourses().find(x=>x.id===el.dataset.course);if(!c)break;
   if(!courseComplete(c)){toast('Finish the lessons in this field before taking its final assessment.');break;}
   startQuiz('final',c.questions,30,`${c.title} · field final`,c.id,24);break;
  }
  case'start-final':{const qs=eligibleQuestions();if(qs.length)startQuiz('exam',qs,20,'Mixed pathway exam',`mixed-main:${questionScope(qs)}`,22);else toast('Complete every lesson in at least one course to unlock this exam.');break;}
  case'next-question':if(quiz.index<quiz.questions.length-1){quiz.index++;quiz.answered=false;quiz.correct=false;quiz.answer=null;quiz.selected=null;quiz.response='';render();}else finishQuiz(false);break;
  case'exit-quiz':if(confirm('Leave this assessment? Your current attempt will not earn IQ Points.')){if(timerHandle)clearInterval(timerHandle);timerHandle=null;quiz=null;activeTab='exams';setView('dashboard');}break;
  case'flip-card':flashFlipped=!flashFlipped;render();break;
  case'flash-next':flashIndex++;flashFlipped=false;render();break;
  case'flash-prev':flashIndex--;flashFlipped=false;render();break;
  case'delete-card':if(confirm('Delete this custom flashcard?')){profile.customFlashcards.splice(Number(el.dataset.index),1);save();flashIndex=0;render();toast('Flashcard deleted.');}break;
  case'equip-cosmetic':{const item=COSMETICS.find(c=>c.id===el.dataset.id);if(item&&profile.owned.includes(item.id)){profile.equipped[item.slot]=item.id;save();render();toast(`${item.name} equipped.`);}break;}
  case'buy-cosmetic':{const item=COSMETICS.find(c=>c.id===el.dataset.id);if(!item)break;if(item.achievement){toast('Earn the matching achievement to unlock this cosmetic.');break;}if(item.rank){toast(`Reach rank ${RANKS[item.rank]?.name||item.rank} to unlock this item.`);break;}if(run.iq<item.price){toast('You need more IQ Points for this item.');break;}run.iq-=item.price;profile.owned.push(item.id);profile.equipped[item.slot]=item.id;save();render();toast(`${item.name} purchased and equipped.`);break;}
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el);});
// Keep typed short-answer / working responses in state and update Submit immediately.
$('#app').addEventListener('input',e=>{if(e.target.id==='lessonSearch'){lessonSearch=e.target.value;const results=$('#lessonSearchResults');if(results){results.innerHTML=renderLessonSearchResults(lessonSearch);results.classList.toggle('hidden',!lessonSearch.trim());}const grid=$('#lessonCourseGrid');if(grid)grid.classList.toggle('hidden',!!lessonSearch.trim());const list=$('#courseLessonList');if(list)list.classList.toggle('hidden',!!lessonSearch.trim());return;}if(e.target.id!=='freeResponse'||!quiz||quiz.answered)return;quiz.response=e.target.value;const submit=$('#app [data-action="submit-answer"]');const tool=toolForQuestion(quiz.questions[quiz.index]);if(submit)submit.disabled=!quiz.response.trim()||(!!tool&&!quiz.toolsViewed?.[tool]);});
$('#app').addEventListener('change',e=>{if(e.target.id==='flashFilter'){flashMode=e.target.value;flashIndex=0;flashFlipped=false;render();}if(e.target.id==='cosmeticFilter'){cosmeticFilter=e.target.value;render();}});
$('#app').addEventListener('submit',e=>{if(e.target.id!=='cardForm')return;e.preventDefault();const front=$('#cardFront')?.value.trim(),back=$('#cardBack')?.value.trim();if(!front||!back)return;if(profile.customFlashcards.length>=500){toast('Your custom flashcard collection is full.');return;}profile.customFlashcards.push({front,back,createdAt:new Date().toISOString()});save();flashMode='custom';flashIndex=profile.customFlashcards.length-1;flashFlipped=false;render();toast('Flashcard saved.');});

function boot(){profile=loadProfile();run=profile.currentRun;if(run?.pathwayCompleted){returnToPathwayMenu();return;}if(run){applyTheme();applyRankUnlocks(true);save();showResume();}else{view=profile.completedPathways.length?'portal':'subject';render();}}
window.addEventListener('beforeunload',()=>save());
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
boot();
</script>
